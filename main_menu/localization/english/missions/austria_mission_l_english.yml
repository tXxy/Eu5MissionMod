  STATIC_MODIFIER_NAME_aus_reichsitalien: "Imperial Italy"
  STATIC_MODIFIER_DESC_aus_reichsitalien: "The princes of northern Italy acknowledge the Emperor."
  STATIC_MODIFIER_NAME_aus_italian_campaigns: "Italian Campaigns"
  STATIC_MODIFIER_DESC_aus_italian_campaigns: "Our armies have driven the French from Italy."
  STATIC_MODIFIER_NAME_aus_universal_monarchy: "Universal Monarchy"
  STATIC_MODIFIER_DESC_aus_universal_monarchy: "The House of Habsburg stands above all the dynasties of Christendom."
  STATIC_MODIFIER_NAME_aus_palatine_archdukes: "Palatine Archdukes"
  STATIC_MODIFIER_DESC_aus_palatine_archdukes: "The archdukes claim the old honours of the palatine dukes."
  STATIC_MODIFIER_NAME_aus_marriage_diplomacy: "Felix Austria"
  STATIC_MODIFIER_DESC_aus_marriage_diplomacy: "Our house wins by marriage what others win by war."
  STATIC_MODIFIER_NAME_aus_habsburg_legacy: "Habsburg Legacy"
  STATIC_MODIFIER_DESC_aus_habsburg_legacy: "The House of Habsburg has risen above all other dynasties."


  # ==================== AUSTRIAN FLAVOR CONTENT ====================
  aus_unlock_aeiou_tt: "Unlocks the [ShowAdvanceName('aus_aeiou')] advance."
  aus_unlock_rudolfinum_tt: "Unlocks the [ShowAdvanceName('aus_rudolfinum')] advance."
  aus_unlock_salzamt_tt: "Unlocks the [ShowAdvanceName('aus_salzamt')] advance, which allows the #Y Kammergut#! town rights in salt-producing locations."
  aus_unlock_ironworks_tt: "Unlocks the [ShowAdvanceName('aus_innerberg_ironworks')] advance, which allows the #Y Iron Town of the Eisenwurzen#! town rights in iron-producing locations."
  aus_unlock_kuerisser_tt: "Unlocks the [ShowAdvanceName('aus_kuerisser_tradition')] advance, which unlocks the #Y Austrian Kürisser#! heavy cavalry."
  aus_unlock_frontier_charter_tt: "Unlocks the [ShowAdvanceName('aus_military_frontier_charter')] advance, which unlocks the #Y Border Guard#! light infantry."
  aus_unlock_wiener_stadtrecht_tt: "Unlocks the #Y Wiener Stadtrecht#! town rights for Vienna."
  aus_rudolfinum: "Alma Mater Rudolphina"
  aus_rudolfinum_desc: "Founded by Duke Rudolf IV in 1365, the University of Vienna is the oldest university in the German-speaking lands and trains the officials, physicians and clerics of the archduchy."
  aus_innerberg_ironworks: "Innerberg Ironworks"
  aus_innerberg_ironworks_desc: "The mines of the Styrian Erzberg and the smelters and forges of the Eisenwurzen are organised into one great iron trade, supplying the smiths of Steyr and the armouries of the crown."
  aus_salzamt: "The Salzamt"
  aus_salzamt_desc: "The archducal salt office runs the mines and salt pans of the Salzkammergut as a crown monopoly. Its officials rule the salt valleys almost like a state within the state."
  aus_aeiou: "A.E.I.O.U."
  aus_aeiou_desc: "Frederick III carved five vowels on his buildings, books and plate. Read as \"Austriae est imperare orbi universo\", they proclaim that Austria is destined to rule the world."
  aus_kuerisser_tradition: "Kürisser Tradition"
  aus_kuerisser_tradition_desc: "The Austrian and Styrian nobility ride to war as heavily armoured lancers, equipped by the armourers of Innsbruck and Steyr."
  aus_military_frontier_charter: "Charter of the Military Frontier"
  aus_military_frontier_charter_desc: "Along the Croatian and Slavonian border, settlers receive land and freedom from serfdom in return for lifelong military service against the Turks."
  a_aus_kuerisser: "Austrian Kürisser"
  a_aus_kuerisser_desc: "Heavily armoured noble lancers of Austria and Styria, who ride knee to knee and break enemy lines with the lance."
  a_aus_grenzwache: "Border Guard"
  a_aus_grenzwache_desc: "Soldier-farmers of the Military Frontier, who guard the border watchtowers and are always ready to meet raiders in the hills."
  aus_wiener_stadtrecht: "Wiener Stadtrecht"
  aus_wiener_stadtrecht_desc: "This [location|e] enjoys the town law of Vienna and its staple right over the trade of the Danube."
  aus_eisenwurzen_town: "Iron Town of the Eisenwurzen"
  aus_eisenwurzen_town_desc: "This [location|e] smelts and trades iron under the ordinances of the Innerberg iron trade."
  aus_kammergut_town: "Kammergut"
  aus_kammergut_town_desc: "This [location|e] belongs to the Kammergut, the salt lands governed directly by the archducal salt office."
  aus_hofburg: "The Hofburg"
  aus_hofburg_desc: "The great palace of the Habsburgs in Vienna houses the court, the chancery and the treasury of the dynasty."
  aus_hofburg_why: "$aus_hofburg$ can only be built by completing a mission."
  aus_stephansdom: "St. Stephen's Cathedral"
  aus_stephansdom_desc: "The Gothic cathedral of Vienna, with its great south tower and roof of glazed tiles, is the spiritual heart of Austria."
  aus_stephansdom_why: "$aus_stephansdom$ can only be built by completing a mission."
  aus_erzberg_mine: "The Erzberg"
  aus_erzberg_mine_desc: "A whole mountain of iron ore, mined in great terraces since Roman times. Its iron is carried down the Enns to the forges of the Eisenwurzen."
  aus_erzberg_mine_why: "$aus_erzberg_mine$ can only be built by completing a mission."
  aus_theresian_academy: "Theresian Military Academy"
  aus_theresian_academy_desc: "In the castle of Wiener Neustadt, cadets from every land of the monarchy are trained as officers."
  aus_theresian_academy_why: "$aus_theresian_academy$ can only be built by completing a mission."
  aus_herren_und_ritterstand: "Lords and Knights of the Landtag"
  aus_herren_und_ritterstand_desc: "The lords and knights of each Austrian land sit as separate estates in its diet, vote its taxes and lead its levies in war."
  aus_vienna_staple_right: "Viennese Staple Right"
  aus_vienna_staple_right_desc: "Since 1221, foreign merchants must offer their goods for sale to the burghers of Vienna before they may travel further down the Danube."
  austria_mission_events.1.t: "The Privilegium Maius"
  austria_mission_events.1.d: "Duke Rudolf IV has presented a bundle of ancient charters, supposedly granted by Caesar and Nero themselves, that raise Austria above every other principality of the Empire and give its rulers the title of archduke. Petrarch has already called them a clumsy forgery. Shall we stand by them?"
  austria_mission_events.1.a: "The charters are genuine. We are archdukes!"
  austria_mission_events.1.b: "Put them away for a better time."
  austria_mission_events.2.t: "The Alma Mater Rudolphina"
  austria_mission_events.2.d: "The University of Vienna has opened its doors, with faculties of arts, law and medicine. Its masters ask whether the crown will now press the Pope for a faculty of theology, or spend the money on the city that houses them."
  austria_mission_events.2.a: "Endow colleges and houses for the students."
  austria_mission_events.2.b: "Petition Rome for a faculty of theology."
  austria_mission_events.3.t: "Tu Felix Austria Nube"
  austria_mission_events.3.d: "Our envoys have arranged another splendid match, and the court is already counting the crowns that may one day come to our house through it. Some councillors say the dynasty should make marriage its policy. Others say only the sword truly wins kingdoms."
  austria_mission_events.3.a: "Let others wage war; we shall marry."
  austria_mission_events.3.b: "A good marriage is no substitute for a good army."
  austria_mission_events.4.t: "The Imperial Crown"
  austria_mission_events.4.d: "The electors have chosen a Habsburg as King of the Romans. In the cathedral of Aachen the crown of Charlemagne is placed on his head, and the princes of the Empire kneel to swear their fealty."
  austria_mission_events.4.a: "A coronation the Empire will never forget!"
  austria_mission_events.4.b: "Use the occasion to settle affairs with the princes."
  austria_mission_events.5.t: "The Burgundian Marriage"
  austria_mission_events.5.d: "Mary of Burgundy, heiress to Flanders, Brabant, Holland and the Franche-Comté, has married a Habsburg. The King of France is furious and his armies are already gathering on the border."
  austria_mission_events.5.a: "Win over the cities of the Low Countries."
  austria_mission_events.5.b: "Rally the Burgundian knights against France."
  austria_mission_events.6.t: "The Siege of Vienna"
  austria_mission_events.6.d: "For weeks the Ottoman army has dug mines beneath the walls and stormed the breaches, but Vienna has held. Now a relief army has appeared on the Kahlenberg, and the besiegers are fleeing in disorder."
  austria_mission_events.6.a: "Pursue them down the Danube!"
  austria_mission_events.6.b: "Give thanks to God in every church."
  austria_mission_events.7.t: "The Battle of Sempach"
  austria_mission_events.7.d: "Near the little town of Sempach our knights dismounted to fight the Confederates on foot, and were cut down by halberds. Duke Leopold himself lies among the dead. The lords demand revenge, while the peasants of our Swiss lands mutter that the Confederates are right."
  austria_mission_events.7.a: "Avenge the duke!"
  austria_mission_events.7.b: "Confirm the old liberties of our Swiss subjects."
  austria_mission_events.8.t: "The First Congress of Vienna"
  austria_mission_events.8.d: "In St. Stephen's Cathedral the Emperor has married his grandchildren to the heirs of the Jagiellon kings of Bohemia and Hungary. If either dynasty dies out, its crowns will pass to the other, and everyone knows which dynasty has more heirs."
  austria_mission_events.8.a: "A triumph of the House of Austria!"
  austria_mission_events.8.b: "Use the congress to win friends among the princes."
  austria_mission_events.9.t: "The Pragmatic Sanction"
  austria_mission_events.9.d: "The ruler has decreed that all the Habsburg lands shall pass undivided to the eldest heir, son or daughter. The estates of every land must accept it, and every court in Europe must be persuaded to guarantee it, at a price."
  austria_mission_events.9.a: "Pay whatever it costs to secure the guarantees."
  austria_mission_events.9.b: "A strong army is a better guarantee than a hundred treaties."
  austria_mission_events.10.t: "The Jesuits in Vienna"
  austria_mission_events.10.d: "Peter Canisius and the fathers of the Society of Jesus have arrived in Vienna. They offer to take over the university and open colleges in every town to win back the nobility from Lutheranism. The burghers are not pleased."
  austria_mission_events.10.a: "Give them the university and the schools."
  austria_mission_events.10.b: "Welcome them, but keep the university independent."
