l_english:
  austria_mission_pack: "Austria Missions"
  austria_mission_pack_DESCRIPTION: "From a duchy on the Danube the House of Habsburg can rise to rule the Holy Roman Empire, the crowns of Bohemia and Hungary, and lands across the world, winning by marriage what others win by war."
  austria_mission_pack_BUTTON_DETAILS: "Raise the House of Habsburg from the archduchy of Austria to the imperial crown and beyond."
  austria_mission_pack_BUTTON_TOOLTIP: "\n\n"
  austria_mission_pack_CRITERIA_DESCRIPTION: "Complete missions to build the Habsburg monarchy and make Austria the first house of Christendom."

  mission_aus_house_of_habsburg: "The House of Habsburg"
  mission_aus_house_of_habsburg_desc: "From a castle in the Aargau the Habsburgs rose to rule Austria, Styria and Carinthia. Now the dynasty must prove that its rise was no accident."
  mission_aus_house_of_habsburg_tooltip: "Hold Vienna with a legitimate and stable government."

  mission_aus_archducal_court: "The Ducal Court"
  mission_aus_archducal_court_desc: "A ruler is measured by his court. Gather the lords of the Austrian lands in Vienna and bind them to the dynasty with offices and honours."
  mission_aus_archducal_court_tooltip: "Strengthen the crown, keep the nobles content and develop Vienna."

  mission_aus_rudolf_the_founder: "Rudolf the Founder"
  mission_aus_rudolf_the_founder_desc: "The Golden Bull has passed Austria over for the electoral dignity. A bold duke might answer with charters of his own, old and splendid, even if they were written last winter."
  mission_aus_rudolf_the_founder_tooltip: "Rule with high legitimacy and prestige and develop Vienna."

  mission_aus_privilegium_maius: "Privilegium Maius"
  mission_aus_privilegium_maius_desc: "The archdukes of Austria shall stand above all other princes of the Empire, owing service to no one and judged by no court but their own. Let the Emperor himself confirm it."
  mission_aus_privilegium_maius_tooltip: "Have the Privilegium Maius confirmed by an emperor, or wear the imperial crown yourself, and rule with high legitimacy."

  mission_aus_aeiou: "A.E.I.O.U."
  mission_aus_aeiou_desc: "Five vowels carved on palaces, books and plate: Austriae est imperare orbi universo. It is Austria's destiny to rule the whole world."
  mission_aus_aeiou_tooltip: "Research Austrian Heritage, gain prestige and own works of art."

  mission_aus_hofkammer: "The Hofkammer"
  mission_aus_hofkammer_desc: "The archducal domains, tolls and mines have been pawned piece by piece to pay for wars. A court chamber of trained officials must take them back and run them properly."
  mission_aus_hofkammer_tooltip: "Embrace Legalism, pay off all loans and build up the power of the crown."

  mission_aus_landtage: "The Landtage"
  mission_aus_landtage_desc: "Each of the Austrian lands has its own diet of prelates, lords, knights and towns. Win them over and they will vote the taxes the crown needs."
  mission_aus_landtage_tooltip: "Keep all estates content, especially the nobles and burghers."

  mission_aus_hofkanzlei: "The Court Chancery"
  mission_aus_hofkanzlei_desc: "A separate Austrian chancery must handle the affairs of the hereditary lands, apart from the business of the Empire and its quarrelsome princes."
  mission_aus_hofkanzlei_tooltip: "Research the Austrian Court, raise crown power and rule with high legitimacy."

  mission_aus_geheimer_rat: "The Privy Council"
  mission_aus_geheimer_rat_desc: "A small council of trusted advisers, meeting in secret, must decide the great questions of state before the estates ever hear of them."
  mission_aus_geheimer_rat_tooltip: "Research the Privy Council or adopt the Geheimer Rat reform, and make the crown dominant."

  mission_aus_pragmatic_sanction: "The Pragmatic Sanction"
  mission_aus_pragmatic_sanction_desc: "The Habsburg lands must pass undivided to the next ruler, whether son or daughter. Every estate and every court in Europe must swear to it."
  mission_aus_pragmatic_sanction_tooltip: "Have an heir, very high legitimacy, a strong crown and a stable realm."

  mission_aus_enlightened_absolutism: "Enlightened Absolutism"
  mission_aus_enlightened_absolutism_desc: "Everything for the people, nothing by the people. Schools, religious tolerance and a reformed state will be granted from above by a ruler who knows best."
  mission_aus_enlightened_absolutism_tooltip: "Embrace the Enlightenment, raise literacy and make the crown dominant."

  mission_aus_vienna_staple_right: "The Viennese Staple Right"
  mission_aus_vienna_staple_right_desc: "Since 1221 every foreign merchant on the Danube has had to unload in Vienna and sell to Viennese burghers. Confirm the privilege and make the city rich."
  mission_aus_vienna_staple_right_tooltip: "Make Vienna a developed market centre with a marketplace."

  mission_aus_stephansdom: "St. Stephen's Cathedral"
  mission_aus_stephansdom_desc: "Rudolf IV laid the foundation of a new Gothic nave for St. Stephen's. Its great south tower, the Steffl, will rise higher than any church in the Empire."
  mission_aus_stephansdom_tooltip: "Build a temple in Vienna, keep the clergy content and gather religious influence."

  mission_aus_university_of_vienna: "The University of Vienna"
  mission_aus_university_of_vienna_desc: "Prague has its university and Vienna shall not be left behind. Found a studium generale where the sons of the Austrian lands can study law, medicine and theology."
  mission_aus_university_of_vienna_tooltip: "Build libraries, raise literacy in Vienna and keep the clergy content."

  mission_aus_walls_of_vienna: "The Walls of Vienna"
  mission_aus_walls_of_vienna_desc: "The ransom paid for Richard the Lionheart built Vienna's walls. They must be kept strong, for the city lies at the gate between East and West."
  mission_aus_walls_of_vienna_tooltip: "Fortify Vienna and hold four forts."

  mission_aus_hofburg: "The Hofburg"
  mission_aus_hofburg_desc: "The old castle by the Widmertor must grow into a palace worthy of the dynasty, with wings for the court, the chancery and the imperial treasury."
  mission_aus_hofburg_tooltip: "Grow Vienna into a large city and rule with high legitimacy."

  mission_aus_college_of_poets: "The College of Poets"
  mission_aus_college_of_poets_desc: "Conrad Celtis has proposed a college of poets and mathematicians at the university, where humanists will be crowned with laurel in the name of the Emperor."
  mission_aus_college_of_poets_tooltip: "Embrace the Renaissance, employ an artist and own works of art."

  mission_aus_baroque_vienna: "Baroque Vienna"
  mission_aus_baroque_vienna_desc: "Palaces, churches and gardens in the new style are rising outside the old walls. Vienna shall be the most splendid capital in Christendom."
  mission_aus_baroque_vienna_tooltip: "Develop Vienna, make it prosperous and gather works of art there."

  mission_aus_wiener_klassik: "The Viennese Classics"
  mission_aus_wiener_klassik_desc: "Haydn, Mozart and the young Beethoven have all come to Vienna. Its theatres, salons and palace chapels make it the musical capital of the world."
  mission_aus_wiener_klassik_tooltip: "Research the Wiener Klassik or own many works of art, and employ several artists."

  mission_aus_kaiserstadt: "The Imperial City"
  mission_aus_kaiserstadt_desc: "Vienna is no longer a ducal town on the Danube but the capital of an empire, home to the court, the government and the treasures of the dynasty."
  mission_aus_kaiserstadt_tooltip: "Make Vienna a vast capital and be Holy Roman Emperor or rule an empire."

  mission_aus_lower_austria: "Unite Lower Austria"
  mission_aus_lower_austria_desc: "The bishops of Passau and Freising still hold towns in the heart of our duchy. Lower Austria must answer to Vienna alone."
  mission_aus_lower_austria_tooltip: "Own all of Lower Austria, including St. Pölten and Waidhofen."

  mission_aus_upper_austria: "Land ob der Enns"
  mission_aus_upper_austria_desc: "Bavaria still holds the Innviertel above the Enns. Take it back and make Linz the second city of the archduchy."
  mission_aus_upper_austria_tooltip: "Own all of Upper Austria and develop Linz."

  mission_aus_salzkammergut: "The Salzkammergut"
  mission_aus_salzkammergut_desc: "White gold from Hallstatt, Ischl and Aussee. The salt mines are too valuable to leave to monasteries and burghers, and must be run by a salt office of the crown."
  mission_aus_salzkammergut_tooltip: "Own Gmunden, Bad Ischl and Liezen and produce salt."

  mission_aus_styria: "The Duchy of Styria"
  mission_aus_styria_desc: "Styria has been ours since the days of King Rudolf. Graz, on the Mur, can become the seat of a court of its own for the inner Austrian lands."
  mission_aus_styria_tooltip: "Hold most of Styria and develop Graz."

  mission_aus_styrian_erzberg: "The Styrian Erzberg"
  mission_aus_styrian_erzberg_desc: "A whole mountain of iron ore rises above Eisenerz. Its iron is carried down the Enns to the smithies of Steyr and sold from Venice to the Baltic."
  mission_aus_styrian_erzberg_tooltip: "Own Leoben and Steyr, produce iron and build an armory."

  mission_aus_steyr_blades: "The Smiths of Steyr"
  mission_aus_steyr_blades_desc: "The blades, scythes and armour of Steyr are known from Spain to Muscovy. Encourage the smiths and the crown's armies will never lack for steel."
  mission_aus_steyr_blades_tooltip: "Build armories, research the Innerberg Ironworks and develop Steyr."

  mission_aus_wiener_pfennig: "The Vienna Penny"
  mission_aus_wiener_pfennig_desc: "Styrian silver is struck into the Vienna penny, the coin of the whole Danube valley. A sound coinage is the foundation of the crown's revenue."
  mission_aus_wiener_pfennig_tooltip: "Own Judenburg and Weiz, mine silver and build a minting office."

  mission_aus_wachau_wine: "Wine of the Wachau"
  mission_aus_wachau_wine_desc: "Terraced vineyards line the Danube from Melk to Krems. Austrian wine is drunk in every tavern from Bavaria to Bohemia."
  mission_aus_wachau_wine_tooltip: "Own Krems and Korneuburg and build wineries."

  mission_aus_marchfeld_granary: "The Marchfeld Granary"
  mission_aus_marchfeld_granary_desc: "The broad plain of the Marchfeld, where King Rudolf won Austria for our house, can feed all of Vienna if its fields are well tended."
  mission_aus_marchfeld_granary_tooltip: "Build farming villages, keep the peasants content and own Gänserndorf."

  mission_aus_danube_trade: "Trade on the Danube"
  mission_aus_danube_trade_desc: "Hungarian cattle and wine travel up the Danube, while cloth and metalware from the west travel down. Vienna must profit from all of it."
  mission_aus_danube_trade_tooltip: "Trade in two markets, expand merchant capacity and keep Vienna a market centre."

  mission_aus_alpine_roads: "Roads through the Alps"
  mission_aus_alpine_roads_desc: "Mountain passes divide our lands. Good roads over the Semmering and the Pyhrn will bind Styria, Carinthia and Carniola to Vienna."
  mission_aus_alpine_roads_tooltip: "Connect Graz, Linz, Klagenfurt and Ljubljana to Vienna by road."

  mission_aus_road_to_the_sea: "The Road to the Sea"
  mission_aus_road_to_the_sea_desc: "A road from Vienna to Trieste will carry the trade of the hereditary lands to the Adriatic without paying a single toll to Venice."
  mission_aus_road_to_the_sea_tooltip: "Connect Trieste, Gorizia and Maribor to Vienna by road."

  mission_aus_state_manufactories: "State Manufactories"
  mission_aus_state_manufactories_desc: "Cameralist advisers urge the crown to found manufactories of cloth, glass and porcelain, so that silver stays in the country instead of flowing abroad."
  mission_aus_state_manufactories_tooltip: "Embrace Manufactories, build cloth guilds and keep the burghers content."

  mission_aus_austrian_industry: "Austrian Industry"
  mission_aus_austrian_industry_desc: "Steam engines, spinning mills and foundries are changing the valleys of Styria and Bohemia. The state must lead the way."
  mission_aus_austrian_industry_tooltip: "Research Austrian State Industrialization or embrace Industrialization, and build an iron foundry."

  mission_aus_carinthia: "The Duchy of Carinthia"
  mission_aus_carinthia_desc: "Carinthia came to our house in 1335. The bishop of Bamberg still holds Villach, and the counts of Gorizia hold the Drau valley. They must be brought to heel."
  mission_aus_carinthia_tooltip: "Hold most of Carinthia, including Villach."

  mission_aus_carniola: "The March of Carniola"
  mission_aus_carniola_desc: "Carniola guards the road to the sea and the passes into Italy and Croatia. Ljubljana must become a proper capital for the march."
  mission_aus_carniola_tooltip: "Hold most of Carniola and develop Ljubljana."

  mission_aus_counts_of_celje: "The Counts of Celje"
  mission_aus_counts_of_celje_desc: "The counts of Cilli are rich, ambitious and married into every royal house of the east. When their line dies out, their lands must fall to us."
  mission_aus_counts_of_celje_tooltip: "Own Celje and Ptuj and keep the nobles content."

  mission_aus_gorizia: "The Gorizian Inheritance"
  mission_aus_gorizia_desc: "The counts of Gorizia hold scattered lands from the Puster valley to Istria. A treaty of inheritance will bring them to us when the line fails."
  mission_aus_gorizia_tooltip: "Own Gorizia and Lienz."

  mission_aus_trieste: "The Port of Trieste"
  mission_aus_trieste_desc: "Trieste fears Venice more than it fears us. If it places itself under Austrian protection, the archduchy will finally have a port on the sea."
  mission_aus_trieste_tooltip: "Own Trieste."

  mission_aus_istria_and_fiume: "Istria and Fiume"
  mission_aus_istria_and_fiume_desc: "Pazin in the heart of Istria and Fiume on the Kvarner will give us a stretch of coast that Venice cannot blockade."
  mission_aus_istria_and_fiume_tooltip: "Own Pazin and Rijeka."

  mission_aus_adriatic_fleet: "The Adriatic Fleet"
  mission_aus_adriatic_fleet_desc: "Without ships our ports are hostages to Venice and the Barbary corsairs. A small fleet will protect the coast and Austrian merchants."
  mission_aus_adriatic_fleet_tooltip: "Own three ports, build a shipyard and maintain a squadron of light ships."

  mission_aus_free_port_of_trieste: "The Free Port"
  mission_aus_free_port_of_trieste_desc: "Declare Trieste a free port, open to merchants of every nation without customs. Ships from the Levant and beyond will come to Austria instead of Venice."
  mission_aus_free_port_of_trieste_tooltip: "Develop Trieste and trade in three markets."

  mission_aus_friuli: "The Patriarchate of Aquileia"
  mission_aus_friuli_desc: "The patriarchs of Aquileia are weak and Venice is eager to swallow Friuli. We must take it first."
  mission_aus_friuli_tooltip: "Own Udine and Aquileia."

  mission_aus_venetian_rivalry: "Mistress of the Adriatic"
  mission_aus_venetian_rivalry_desc: "Venice calls the Adriatic its gulf and taxes every ship on it. We will not pay her tolls for sailing out of our own harbours."
  mission_aus_venetian_rivalry_tooltip: "Rival Venice or take Venice or Dalmatia, and maintain a fleet of light ships."

  mission_aus_tyrolean_inheritance: "The Tyrolean Inheritance"
  mission_aus_tyrolean_inheritance_desc: "Margaret of Tyrol, called Maultasch, has no heir. If Tyrol passes to us it will link Austria to our lands in Swabia and Alsace."
  mission_aus_tyrolean_inheritance_tooltip: "Hold Innsbruck directly or through a subject."

  mission_aus_schwaz_silver: "The Silver of Schwaz"
  mission_aus_schwaz_silver_desc: "The mines at Schwaz are the richest in Europe, and the Fuggers would lend against them. Their silver will pay for the dynasty's ambitions."
  mission_aus_schwaz_silver_tooltip: "Own Schwaz and Sterzing and mine silver."

  mission_aus_ambras_castle: "Ambras Castle"
  mission_aus_ambras_castle_desc: "Archduke Ferdinand has filled the castle above Innsbruck with armour, curiosities and paintings, the first museum of the north."
  mission_aus_ambras_castle_tooltip: "Develop Innsbruck and own works of art."

  mission_aus_vorarlberg: "Vorarlberg"
  mission_aus_vorarlberg_desc: "The counts of Montfort and Werdenberg hold the lands before the Arlberg pass. Bought or conquered, they link Tyrol to Lake Constance."
  mission_aus_vorarlberg_tooltip: "Own Feldkirch, Bregenz and Bludenz."

  mission_aus_south_tyrol_and_trent: "South Tyrol and Trent"
  mission_aus_south_tyrol_and_trent_desc: "The bishops of Trent and Brixen are princes of the Empire, but they cannot defend themselves. Austria will be their protector."
  mission_aus_south_tyrol_and_trent_tooltip: "Own Bolzano, Merano, Trento and Brixen."

  mission_aus_landlibell: "The Landlibell"
  mission_aus_landlibell_desc: "By the Landlibell of 1511 every Tyrolean valley must send its men to defend the county, but never to fight beyond its borders. No army has ever taken the mountains from them."
  mission_aus_landlibell_tooltip: "Hold most of Tyrol, hold five forts and keep light infantry."

  mission_aus_further_austria: "Further Austria"
  mission_aus_further_austria_desc: "Our oldest lands lie scattered along the Upper Rhine, in Alsace, the Breisgau and the Black Forest. A government at Ensisheim must hold them together."
  mission_aus_further_austria_tooltip: "Own Ensisheim, Freiburg and Villingen and develop Ensisheim."

  mission_aus_university_of_freiburg: "The University of Freiburg"
  mission_aus_university_of_freiburg_desc: "Archduke Albert VI will found a university at Freiburg in the Breisgau, to train officials for the western lands of our house."
  mission_aus_university_of_freiburg_tooltip: "Own Freiburg, develop it and build a library there."

  mission_aus_alsace: "The Landgraviate of Alsace"
  mission_aus_alsace_desc: "The Sundgau and Upper Alsace have been Habsburg since our first counts. The free cities and petty lords around them must be brought into our fold."
  mission_aus_alsace_tooltip: "Hold most of Alsace and part of the Upper Rhine."

  mission_aus_swiss_question: "The Swiss Question"
  mission_aus_swiss_question_desc: "The forest cantons have sworn an oath against their Habsburg lords. Our knights must ride into the mountains and teach the peasants obedience."
  mission_aus_swiss_question_tooltip: "Own Glarus and Aarau and raise a strong army."

  mission_aus_cradle_of_habsburg: "The Cradle of Habsburg"
  mission_aus_cradle_of_habsburg_desc: "The Habsburg, our ancestral castle, stands in the Aargau. The lands around it must never be lost to the Confederates."
  mission_aus_cradle_of_habsburg_tooltip: "Hold half of central and eastern Switzerland."

  mission_aus_swabian_bailiwick: "The Swabian Bailiwick"
  mission_aus_swabian_bailiwick_desc: "The imperial bailiwick of Swabia gives its holder authority over the towns and abbeys between the Danube and Lake Constance."
  mission_aus_swabian_bailiwick_tooltip: "Hold part of Swabia and either be emperor or have three subjects."

  mission_aus_imperial_ambitions: "Imperial Ambitions"
  mission_aus_imperial_ambitions_desc: "King Rudolf and King Albert both wore the crown of Germany. The Habsburgs will wear it again."
  mission_aus_imperial_ambitions_tooltip: "Be a member of the Holy Roman Empire with prestige and legitimacy."

  mission_aus_win_the_electors: "Win the Electors"
  mission_aus_win_the_electors_desc: "Seven electors choose the King of the Romans, and each has a price: a dowry, a fief, or a chest of gold. Find out what they want."
  mission_aus_win_the_electors_tooltip: "Gather prestige and political influence and be among the great powers."

  mission_aus_imperial_crown: "The Imperial Crown"
  mission_aus_imperial_crown_desc: "The electors have chosen a Habsburg. He will be crowned at Aachen with the crown of Charlemagne."
  mission_aus_imperial_crown_tooltip: "Become Holy Roman Emperor."

  mission_aus_golden_bull: "The Golden Bull"
  mission_aus_golden_bull_desc: "The Golden Bull fixes the rules of every imperial election. A Habsburg emperor who upholds it will be trusted by the electors."
  mission_aus_golden_bull_tooltip: "Be emperor and have the Golden Bull in force in the Empire."

  mission_aus_reichshofrat: "The Aulic Council"
  mission_aus_reichshofrat_desc: "The Reichshofrat will judge disputes between the princes of the Empire. Its judges are appointed by the Emperor alone."
  mission_aus_reichshofrat_tooltip: "Be emperor with high legitimacy and embrace Legalism."

  mission_aus_ewiger_landfriede: "The Eternal Peace"
  mission_aus_ewiger_landfriede_desc: "Feuds between princes must end forever. Any lord who takes up arms against another member of the Empire shall face the imperial ban."
  mission_aus_ewiger_landfriede_tooltip: "Be emperor, have the Landfriede in force and stay at peace for five years."

  mission_aus_imperial_diet: "The Imperial Diet"
  mission_aus_imperial_diet_desc: "The electors, princes and free cities will sit together in the Reichstag. The Emperor presides, proposes and, with patience, gets his way."
  mission_aus_imperial_diet_tooltip: "Be emperor and have an Imperial Diet in the Empire."

  mission_aus_imperial_circles: "The Imperial Circles"
  mission_aus_imperial_circles_desc: "The Empire will be divided into circles, each responsible for keeping the peace, raising troops and collecting taxes for the Emperor."
  mission_aus_imperial_circles_tooltip: "Be emperor and have the Imperial Circles established."

  mission_aus_reichsarmee: "The Imperial Army"
  mission_aus_reichsarmee_desc: "Each circle must send its contingent to the Reichsarmee. Under a Habsburg field marshal it will defend the Empire against all enemies."
  mission_aus_reichsarmee_tooltip: "Be emperor and have an imperial army raised in the Empire."

  mission_aus_vienna_concordat: "Emperor and Pope"
  mission_aus_vienna_concordat_desc: "The Emperor and the Pope must settle who appoints bishops and who collects the church's taxes in Germany. A concordat will bind Rome to Vienna."
  mission_aus_vienna_concordat_tooltip: "Agree the Vienna Concordat or win the Pope's friendship, and be Catholic."

  mission_aus_free_imperial_cities: "Cities of the Emperor"
  mission_aus_free_imperial_cities_desc: "The free cities of the Empire answer to the Emperor alone. Protect them from the princes and their gold will flow to Vienna."
  mission_aus_free_imperial_cities_tooltip: "Be emperor, protect the free cities of the Empire and keep the burghers content."

  mission_aus_protector_of_princes: "Protector of the Princes"
  mission_aus_protector_of_princes_desc: "The small princes of the Empire need a protector against France, the Turks and their greedy neighbours. Austria will be that protector."
  mission_aus_protector_of_princes_tooltip: "Be emperor, have three subjects and be a great power."

  mission_aus_hereditary_emperorship: "The Hereditary Crown"
  mission_aus_hereditary_emperorship_desc: "The electors elect, but they elect a Habsburg every time. It is time the Empire admitted that the crown belongs to the House of Austria."
  mission_aus_hereditary_emperorship_tooltip: "Be emperor and either make the crown hereditary or raise imperial authority very high."

  mission_aus_renovatio_imperii: "Renovatio Imperii"
  mission_aus_renovatio_imperii_desc: "The princes have taken too much from the Emperor over the centuries. Now the crown will take it back, and the Empire will be a true state once again."
  mission_aus_renovatio_imperii_tooltip: "Be emperor and restore the power of the Emperor in the Empire."

  mission_aus_bella_gerant_alii: "Bella Gerant Alii"
  mission_aus_bella_gerant_alii_desc: "Let others wage war; you, happy Austria, marry. What Mars gives to others, Venus will give to you."
  mission_aus_bella_gerant_alii_tooltip: "Arrange a royal marriage with a major European dynasty and gain prestige."

  mission_aus_bohemian_marriage: "A Bohemian Bride"
  mission_aus_bohemian_marriage_desc: "The kings of Bohemia are electors of the Empire and the richest princes in Germany. A marriage will give our house a claim to their crown."
  mission_aus_bohemian_marriage_tooltip: "Have a royal marriage with Bohemia, or have Bohemia in a union or as a subject."

  mission_aus_crown_of_bohemia: "The Crown of Saint Wenceslas"
  mission_aus_crown_of_bohemia_desc: "The crown of Bohemia brings Moravia, Silesia, Lusatia and an electoral vote. It must be ours."
  mission_aus_crown_of_bohemia_tooltip: "Have Bohemia in a union or as a subject, or own Prague."

  mission_aus_moravia_and_silesia: "The Lands of the Bohemian Crown"
  mission_aus_moravia_and_silesia_desc: "Moravia and Silesia belong to the crown of Bohemia. Their towns, mines and weavers must answer to our government."
  mission_aus_moravia_and_silesia_tooltip: "Hold most of Moravia and part of Silesia."

  mission_aus_renewed_land_ordinance: "The Renewed Land Ordinance"
  mission_aus_renewed_land_ordinance_desc: "The Bohemian crown shall no longer be elected by the estates but inherited by our house. German shall stand beside Czech, and the Catholic faith alone shall be permitted."
  mission_aus_renewed_land_ordinance_tooltip: "Own Prague and most of Bohemia directly, be Catholic and make the crown dominant."

  mission_aus_hungarian_marriage: "A Hungarian Bride"
  mission_aus_hungarian_marriage_desc: "The crown of Saint Stephen rules the whole Danube basin below Vienna. A marriage alliance will give us a claim when its royal line fails."
  mission_aus_hungarian_marriage_tooltip: "Have a royal marriage with Hungary, or have Hungary in a union or as a subject."

  mission_aus_double_wedding: "The Congress of Vienna"
  mission_aus_double_wedding_desc: "Two Habsburg grandchildren will marry two Jagiellon heirs in St. Stephen's Cathedral. If either line fails, both kingdoms will come to the other."
  mission_aus_double_wedding_tooltip: "Be bound to both Bohemia and Hungary by marriage or union, and gain prestige."

  mission_aus_crown_of_saint_stephen: "The Crown of Saint Stephen"
  mission_aus_crown_of_saint_stephen_desc: "The Hungarian nobles want a king who will defend them against the Turks. Our house can give them one."
  mission_aus_crown_of_saint_stephen_tooltip: "Have Hungary in a union or as a subject, or own Buda."

  mission_aus_pressburg: "Pressburg and the Western March"
  mission_aus_pressburg_desc: "Pressburg lies a day's ride from Vienna. Whoever holds it and Sopron controls the road into Hungary."
  mission_aus_pressburg_tooltip: "Hold Bratislava, Sopron and Trnava."

  mission_aus_royal_hungary: "Royal Hungary"
  mission_aus_royal_hungary_desc: "Pressburg, the mining towns and the plains west of the Danube are the heart of the Hungarian kingdom. They must be firmly under our rule."
  mission_aus_royal_hungary_tooltip: "Hold most of Transdanubia and Upper Hungary."

  mission_aus_croatia_and_slavonia: "Croatia and Slavonia"
  mission_aus_croatia_and_slavonia_desc: "The Croatian Sabor has chosen our house to defend the kingdom. Its border must be turned into a frontier no army can cross."
  mission_aus_croatia_and_slavonia_tooltip: "Hold most of Slavonia, including Zagreb."

  mission_aus_danubian_monarchy: "The Danubian Monarchy"
  mission_aus_danubian_monarchy_desc: "Austria, Bohemia and Hungary, three crowns under one ruler. Together they form a great power on the Danube that no neighbour can match."
  mission_aus_danubian_monarchy_tooltip: "Rule forty provinces, accept the Hungarian or Czech culture and keep a strong crown."

  mission_aus_multicultural_empire: "Many Peoples, One Crown"
  mission_aus_multicultural_empire_desc: "Germans, Czechs, Hungarians, Croats, Slovenes and Italians all serve the same ruler. Each must feel at home under the double eagle."
  mission_aus_multicultural_empire_tooltip: "Research the Multicultural Empire or accept the Hungarian, Czech and Croatian cultures, and keep cultural unity."

  mission_aus_kuerisser: "The Austrian Knights"
  mission_aus_kuerisser_desc: "The lords of Austria and Styria ride to war in full plate on armoured horses. Give them the best armourers and they will break any line."
  mission_aus_kuerisser_tooltip: "Field four regiments of heavy cavalry and build up army tradition."

  mission_aus_austrian_army: "The Archducal Army"
  mission_aus_austrian_army_desc: "An archduke needs an army of his own, not just the feudal levies his lords grudgingly send. Raise companies of Kürisser and pay them from the treasury."
  mission_aus_austrian_army_tooltip: "Raise an army and research the Kürisser tradition."

  mission_aus_landsknechte: "Father of the Landsknechte"
  mission_aus_landsknechte_desc: "Emperor Maximilian has trained German foot soldiers to fight in the Swiss manner with long pikes. The Landsknechte will be the terror of Europe."
  mission_aus_landsknechte_tooltip: "Embrace Pike and Shot and field ten regiments of heavy infantry."

  mission_aus_border_fortresses: "Fortresses of the Border"
  mission_aus_border_fortresses_desc: "Wiener Neustadt, Graz, Hainburg and Pettau guard the eastern border. They must be ready when the raiders come."
  mission_aus_border_fortresses_tooltip: "Hold six forts and build castles."

  mission_aus_turkish_menace: "The Turkish Menace"
  mission_aus_turkish_menace_desc: "The Ottoman sultan has crossed the Danube. Every Christian prince must stand together, and Austria must stand in front."
  mission_aus_turkish_menace_tooltip: "Rival the Ottomans, or see them gone, and raise a large army."

  mission_aus_siege_of_vienna: "The Siege of Vienna"
  mission_aus_siege_of_vienna_desc: "The Grand Vizier's army is camped before the walls of Vienna. If the city holds, the Ottoman tide will turn."
  mission_aus_siege_of_vienna_tooltip: "Keep Vienna fortified, build bastions or a star fort and raise a large army."

  mission_aus_hofkriegsrat: "The Court War Council"
  mission_aus_hofkriegsrat_desc: "One council in Vienna will command every regiment and fortress in the hereditary lands, from the Rhine to the Croatian border."
  mission_aus_hofkriegsrat_tooltip: "Research the Hofkriegsrat or embrace Professional Armies, and build up army tradition."

  mission_aus_military_frontier: "The Military Frontier"
  mission_aus_military_frontier_desc: "Along the Croatian and Slavonian border, free settlers receive land in return for military service. They will hold the frontier forever."
  mission_aus_military_frontier_tooltip: "Research the Military Frontier charter, hold ten forts and part of Croatia."

  mission_aus_reconquer_hungary: "The Reconquest of Hungary"
  mission_aus_reconquer_hungary_desc: "After a century and a half, Buda can be retaken. Drive the Turks from the plains of Hungary."
  mission_aus_reconquer_hungary_tooltip: "Own Buda and hold most of the southern plains and part of Transylvania."

  mission_aus_take_belgrade: "Prince Eugene at Belgrade"
  mission_aus_take_belgrade_desc: "Belgrade, the key to the Danube, can be taken. Under a commander of genius our army will storm its walls."
  mission_aus_take_belgrade_tooltip: "Own Belgrade and build up great army tradition."

  mission_aus_liberate_the_balkans: "Liberate the Balkans"
  mission_aus_liberate_the_balkans_desc: "The Christians of Serbia and Bosnia look to the Emperor to free them. Our armies will march to the Morava and beyond."
  mission_aus_liberate_the_balkans_tooltip: "Hold half of Serbia and part of Bosnia."

  mission_aus_theresian_academy: "The Theresian Military Academy"
  mission_aus_theresian_academy_desc: "In the castle of Wiener Neustadt, cadets of every nation in the monarchy will be trained as officers of the Empire."
  mission_aus_theresian_academy_tooltip: "Field eight artillery regiments, embrace the Military Revolution and own Wiener Neustadt."

  mission_aus_melk_reform: "The Melk Reform"
  mission_aus_melk_reform_desc: "The Benedictines of Melk are leading a reform of monastic life across Austria and southern Germany. The crown should support it."
  mission_aus_melk_reform_tooltip: "Grant the Melk Reform or build monasteries, and keep the clergy content."

  mission_aus_mariazell: "Pilgrimage to Mariazell"
  mission_aus_mariazell_desc: "Pilgrims from Austria, Hungary and Bohemia travel to the shrine of the Virgin at Mariazell. The crown will build them a basilica."
  mission_aus_mariazell_tooltip: "Build temples and keep religious unity high."

  mission_aus_counter_reformation: "The Counter-Reformation"
  mission_aus_counter_reformation_desc: "Lutheran preachers have converted much of the Austrian nobility. The Jesuits, the universities and the crown must win them back."
  mission_aus_counter_reformation_tooltip: "Embrace Confessionalism, be Catholic and keep religious unity high."

  mission_aus_edict_of_restitution: "The Edict of Restitution"
  mission_aus_edict_of_restitution_desc: "All church lands taken by the Protestant princes since the Peace of Passau must be returned. The Emperor will enforce it."
  mission_aus_edict_of_restitution_tooltip: "Research the Edict of Restitution or keep religious unity very high, and gather religious influence."

  mission_aus_pietas_austriaca: "Pietas Austriaca"
  mission_aus_pietas_austriaca_desc: "The House of Austria is the defender of the Catholic faith. Its rulers walk in procession on Corpus Christi and found churches in every town."
  mission_aus_pietas_austriaca_tooltip: "Be Catholic, keep religious unity very high and build cathedrals."

  mission_aus_burgundian_marriage: "The Burgundian Marriage"
  mission_aus_burgundian_marriage_desc: "Charles the Bold has only a daughter, Mary, the richest heiress in Europe. Her hand will bring us Flanders, Brabant and the Franche-Comté."
  mission_aus_burgundian_marriage_tooltip: "Have a royal marriage with Burgundy, have Burgundy in a union or as a subject, or own Dijon."

  mission_aus_burgundian_inheritance: "The Burgundian Inheritance"
  mission_aus_burgundian_inheritance_desc: "France claims the duchy of Burgundy, but the Low Countries and the Franche-Comté belong to Mary's heirs, and her heirs are Habsburgs."
  mission_aus_burgundian_inheritance_tooltip: "Have Burgundy in a union or as a subject, or hold Brussels and Ghent, or Dijon and Besançon."

  mission_aus_low_countries: "The Seventeen Provinces"
  mission_aus_low_countries_desc: "The cities of Flanders and Brabant are the richest in Europe. Their cloth and their trade will fill the dynasty's treasury."
  mission_aus_low_countries_tooltip: "Hold most of Brabant and Flanders."

  mission_aus_spanish_marriage: "The Spanish Marriage"
  mission_aus_spanish_marriage_desc: "A double marriage with the Catholic Monarchs of Castile and Aragon could one day bring Spain, Naples and the New World to our house."
  mission_aus_spanish_marriage_tooltip: "Have a royal marriage with Castile, Aragon, Spain or Portugal, or Castile or Spain in a union or as a subject."

  mission_aus_empire_of_the_sun: "An Empire on Which the Sun Never Sets"
  mission_aus_empire_of_the_sun_desc: "From Vienna to Madrid and from Brussels to Mexico, the lands of our house circle the globe."
  mission_aus_empire_of_the_sun_tooltip: "Have Castile, Spain or Aragon in a union or as a subject."

  mission_aus_reichsitalien: "Imperial Italy"
  mission_aus_reichsitalien_desc: "The duchies and cities of northern Italy are fiefs of the Empire. The Emperor must make his authority felt south of the Alps."
  mission_aus_reichsitalien_tooltip: "Be emperor and hold Milan or part of Lombardy, or make Milan your subject."

  mission_aus_italian_wars: "The Italian Wars"
  mission_aus_italian_wars_desc: "France wants Milan and Naples. If the King of France holds Italy, he will surround our lands. We must drive him back over the Alps."
  mission_aus_italian_wars_tooltip: "Own Milan, rival France and raise a large army."

  mission_aus_austria_est_imperare: "Austriae Est Imperare Orbi Universo"
  mission_aus_austria_est_imperare_desc: "It is Austria's destiny to rule the whole world. The House of Habsburg stands above all the dynasties of Christendom."
  mission_aus_austria_est_imperare_tooltip: "Be one of the two greatest powers, rule eighty provinces and be emperor."

