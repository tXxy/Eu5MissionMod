 denmark_mission_pack: "The North Sea Empire"
 denmark_mission_pack_desc: "Guide Denmark from a kingdom burdened by debt and noble strife through the glory of the Kalmar Union, the wealth of the Øresund Toll, and the building of a true North Sea Empire spanning from Vinland to the Indian Ocean."
