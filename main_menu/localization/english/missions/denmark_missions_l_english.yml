l_english:
 # ==================== MISSION NAMES ====================
 mission_den_recover_the_crown: "Recover the Crown"
 mission_den_recover_the_crown_desc: "The Danish crown has been weakened by debt and political turmoil. Before we can pursue our greater ambitions, we must first stabilize our finances and restore confidence in royal authority."
 mission_den_recover_the_crown_tooltip: "Eliminate your loans, achieve a stable income, and avoid bankruptcy."

 mission_den_secure_the_danish_crown: "Secure the Danish Crown"
 mission_den_secure_the_danish_crown_desc: "With our finances restored, we must now cement royal authority. The nobility must be managed, the capital developed, and the crown's power made unchallengeable."
 mission_den_secure_the_danish_crown_tooltip: "Achieve high stability and legitimacy, maintain crown estate dominance, and develop Copenhagen."

 mission_den_strengthen_royal_authority: "Strengthen Royal Authority"
 mission_den_strengthen_royal_authority_desc: "The Danish crown must stand supreme. The power of the nobles must be curtailed, and the authority of the monarch made absolute in law and practice."
 mission_den_strengthen_royal_authority_tooltip: "Achieve high crown estate power while limiting noble power."

 mission_den_lutheran_reformation: "The Lutheran Reformation"
 mission_den_lutheran_reformation_desc: "The winds of religious reform blow from Wittenberg. Denmark stands at a crossroads — the old faith or the new. A strong monarch can use the Reformation to seize Church wealth and assert control over religious life."
 mission_den_lutheran_reformation_tooltip: "Break with the Catholic Church and establish a new dominant faith with high religious unity."

 mission_den_dynastic_ambition: "Dynastic Ambition"
 mission_den_dynastic_ambition_desc: "The Kalmar Union is our destiny — but it must be built on firm dynastic foundations. Secure an heir, cultivate relations with Norway, and prepare the claim that will bring the North under Danish leadership."
 mission_den_dynastic_ambition_tooltip: "Have an heir, maintain legitimacy and diplomatic reputation, and cultivate Norwegian goodwill. Receive a claim throne casus belli on Norway."

 mission_den_norways_crown: "Norway's Crown"
 mission_den_norways_crown_desc: "Norway has long been intertwined with Denmark's fate. Bring Norway into our union — by persuasion or by force — and prepare our claim on Sweden."
 mission_den_norways_crown_tooltip: "Bring Norway into union. Receive a claim throne casus belli on Sweden."

 mission_den_bring_sweden_to_heel: "Bring Sweden to Heel"
 mission_den_bring_sweden_to_heel_desc: "Sweden resists Danish leadership. Whether through the manipulation of succession or the force of Danish arms, Sweden must join the union. The North cannot be united without them."
 mission_den_bring_sweden_to_heel_tooltip: "Bring Sweden into union with Denmark. Requires military strength or diplomatic leverage."

 mission_den_ratify_the_kalmar_union: "Ratify the Kalmar Union"
 mission_den_ratify_the_kalmar_union_desc: "With Denmark, Norway, and Sweden under one banner, we formally ratify the Kalmar Union at the Swedish city of Kalmar. Three kingdoms, one crown. Let this be the foundation of Scandinavian greatness."
 mission_den_ratify_the_kalmar_union_tooltip: "Have both Norway and Sweden in union or subjugated, with high legitimacy and stability."

 mission_den_tvillingerigerne: "Tvillingerigerne"
 mission_den_tvillingerigerne_desc: "Sweden is gone. What remains is something older and purer — the bond between Denmark and Norway that predates any Kalmar ambition. Without the weight of Swedish politics, the Twin Kingdoms can become something genuinely powerful: a North Sea monarchy built on shared heritage, shared seas, and shared purpose."
 mission_den_tvillingerigerne_tooltip: "Sweden must no longer exist. With Norway firmly in the union and high opinion, proclaim the Twin Kingdoms and receive a powerful bonus modifier."

 mission_den_promote_scandinavian_unity: "Promote Scandinavian Unity"
 mission_den_promote_scandinavian_unity_desc: "The three kingdoms share blood, faith, and fate. Promote a unified Scandinavian identity — accepting the Norwegian and Swedish cultures, binding the realm through a common Lutheran faith."
 mission_den_promote_scandinavian_unity_tooltip: "Accept Norwegian and Swedish cultures, achieve high religious unity and Danish cultural tradition."

 mission_den_form_scandinavia: "Form the Kingdom of Scandinavia"
 mission_den_form_scandinavia_desc: "The Kalmar Union has proven its worth. Now we forge something greater — a unified Kingdom of Scandinavia, one nation from the North Sea to the Baltic."
 mission_den_form_scandinavia_tooltip: "Own Copenhagen and control 85% of the Scandinavian region."

 mission_den_scandinavian_golden_age: "The Scandinavian Golden Age"
 mission_den_scandinavian_golden_age_desc: "Scandinavia stands as a great power of the world. Let this age be remembered as the golden age of the North — a time of prosperity, strength, and Scandinavian supremacy."
 mission_den_scandinavian_golden_age_tooltip: "As Scandinavia, be a great power with high income and stability."

 mission_den_develop_copenhagen: "Develop Copenhagen"
 mission_den_develop_copenhagen_desc: "Copenhagen is the jewel of the North, but it can be greater. Invest in the city's infrastructure, attract merchants, and build a capital worthy of a great Scandinavian power."
 mission_den_develop_copenhagen_tooltip: "Develop Copenhagen to a high level with key buildings and strong income."

 mission_den_establish_copenhagen_university: "University of Copenhagen"
 mission_den_establish_copenhagen_university_desc: "Founded in 1479, the University of Copenhagen will become the intellectual heart of Scandinavia. Scholars, theologians, and natural philosophers will shape the future of the North."
 mission_den_establish_copenhagen_university_tooltip: "Build a university in Copenhagen with high development and national literacy."

 mission_den_hold_estonian_duchy: "Hold the Estonian Duchy"
 mission_den_hold_estonian_duchy_desc: "Reval — Tallinn — and the Estonian coast have been under Danish rule since 1219. These lands are our foothold in the eastern Baltic. Hold them against all challengers."
 mission_den_hold_estonian_duchy_tooltip: "Own Tallinn and key Estonian locations with sufficient control."

 mission_den_baltic_foothold: "A Baltic Foothold"
 mission_den_baltic_foothold_desc: "Estonia is not merely a foothold — it is the key to Baltic trade and power. Secure all of it and build a navy strong enough to project Danish power across the eastern sea."
 mission_den_baltic_foothold_tooltip: "Own all major Estonian locations with a strong navy and income."

 mission_den_secure_finland: "Secure Finland"
 mission_den_secure_finland_desc: "Finland and the northern territories must be firmly under Scandinavian control. The forests and coastlines of Finland provide manpower, timber, and a buffer against threats from the east."
 mission_den_secure_finland_tooltip: "Control 85% of the Finland area."

 mission_den_take_gotland: "The Sack of Visby"
 mission_den_take_gotland_desc: "Gotland and its fabulously wealthy city of Visby are the prize of the Baltic. Valdemar IV took it in 1361 by force — the Gotlanders fought and died outside the city walls while the burghers of Visby refused to open the gates. We can do the same — or, if Sweden shares our crown, we can simply insist."
 mission_den_take_gotland_tooltip: "Own Visby, Slite, and Hoborg with a battle-hardened army — or demand them outright if Sweden is bound to Denmark by union or subjection."

 mission_den_control_the_sound: "Control the Sound"
 mission_den_control_the_sound_desc: "Whoever controls the Øresund controls the Baltic. With Helsingør and Malmö in our hands and dominance over the Skåne region, no ship passes without our permission."
 mission_den_control_the_sound_tooltip: "Own the Sound chokepoints and dominate the Skaneland area with a strong navy."

 mission_den_oresund_toll: "Establish the Øresund Toll"
 mission_den_oresund_toll_desc: "Every ship that passes through the Sound pays Denmark. The Øresund Toll will become the greatest source of Danish wealth — a tax on the trade of all Europe."
 mission_den_oresund_toll_tooltip: "Own both sides of the Sound with a strong navy and stable income."

 mission_den_baltic_trade_dominance: "Baltic Trade Dominance"
 mission_den_baltic_trade_dominance_desc: "Denmark must dominate the trade of the Baltic. With the Sound toll secured and our merchant fleet growing, we push for full dominance of Baltic commerce."
 mission_den_baltic_trade_dominance_tooltip: "Achieve high merchant power in market and strong income."

 mission_den_dominate_the_north_sea: "Dominate the North Sea"
 mission_den_dominate_the_north_sea_desc: "The North Sea is Denmark's other great highway. With a powerful navy and control of the Scandinavian coastline, no fleet challenges us in these waters."
 mission_den_dominate_the_north_sea_tooltip: "Build a large navy with strong tradition and control 60% of the Scandinavian region."

 mission_den_hanseatic_rivalry: "Subjugate the Hanseatic League"
 mission_den_hanseatic_rivalry_desc: "The Hanseatic League has long dominated northern trade. Their wealth, their arrogance, their stranglehold on our commerce must end. Take Lübeck. Break the Hanse."
 mission_den_hanseatic_rivalry_tooltip: "Achieve dominant merchant power, own Lübeck, and maintain strong income."

 mission_den_reclaim_rugen: "Reclaim Rügen"
 mission_den_reclaim_rugen_desc: "Rügen was Danish for generations before passing to Pomerania upon the death of the last prince in 1325. The island and its strategic position in the Baltic rightfully belong to Denmark. Buy it back — or take it."
 mission_den_reclaim_rugen_tooltip: "Own Rügen by purchase or conquest."

 mission_den_north_atlantic_dominance: "North Atlantic Dominance"
 mission_den_north_atlantic_dominance_desc: "Iceland, the Faroe Islands, and Greenland form a chain stretching into the unknown West. Bind them all to the Danish crown and master the North Atlantic — and if Norway already holds Iceland and Greenland under a crown Denmark shares, there's no need to take anything by force at all."
 mission_den_north_atlantic_dominance_tooltip: "Control Iceland, own Torshavn, and fully settle Greenland — or, if Norway holds any of them and shares a union with Denmark, simply claim what Norway has."

 mission_den_reach_vinland: "Reach Vinland"
 mission_den_reach_vinland_desc: "Leif Erikson — an Icelander, a man of the North — reached Vinland a century before we were born. The Norse sagas speak of forests, wild grapes, and rivers teeming with fish. Follow his wake."
 mission_den_reach_vinland_tooltip: "Establish a foothold in Labrador or Newfoundland."

 mission_den_atlantic_empire: "The Danish Atlantic Empire"
 mission_den_atlantic_empire_desc: "Iceland, Faroe, Greenland, and Vinland — Denmark rules the North Atlantic. No other European power has such reach into the Western Ocean. This is the foundation of a true Atlantic empire."
 mission_den_atlantic_empire_tooltip: "Control all North Atlantic territories and 40% of the Canada region with a strong navy."

 mission_den_danish_colonial_company: "The Danish Colonial Company"
 mission_den_danish_colonial_company_desc: "Where English and Dutch trading companies seek profit, Denmark will build an empire. Establish the Danish Colonial Company to coordinate our overseas ventures and extract maximum wealth from our Atlantic territories."
 mission_den_danish_colonial_company_tooltip: "Dominate the Canada region and Greenland with strong merchant power."

 mission_den_danish_gold_coast: "The Danish Gold Coast"
 mission_den_danish_gold_coast_desc: "The Gold Coast of West Africa is rich in gold, ivory, and trade. Denmark will establish Fort Christiansborg and a chain of trading posts — claiming our share of African wealth."
 mission_den_danish_gold_coast_tooltip: "Own at least 3 Gold Coast locations including Accra with a strong navy."

 mission_den_danish_west_indies: "The Danish West Indies"
 mission_den_danish_west_indies_desc: "The Caribbean islands offer sugar, rum, and trade beyond imagining. Establish Danish colonies in the West Indies and plant our banner in the tropical sun."
 mission_den_danish_west_indies_tooltip: "Own at least 4 Caribbean locations with dominant merchant power."

 mission_den_danish_india: "Danish India and the Nicobar Islands"
 mission_den_danish_india_desc: "Tranquebar on the Coromandel Coast and the Nicobar Islands — Denmark's foothold in the Indian Ocean. Establish our trading posts and our sovereignty over these distant shores."
 mission_den_danish_india_tooltip: "Own the Nicobar Islands and an Indian coastal location with a powerful navy."

 mission_den_reform_the_army: "Reform the Army"
 mission_den_reform_the_army_desc: "The Danish army must be modernized. New tactics, better training, and a professional military tradition will make Denmark's soldiers feared throughout the North."
 mission_den_reform_the_army_tooltip: "Maintain a standing army with growing military tradition."

 mission_den_establish_standing_army: "Establish a Standing Army"
 mission_den_establish_standing_army_desc: "Denmark needs a permanent professional army — not just levies raised in wartime. A standing force that trains year-round, ready at a moment's notice."
 mission_den_establish_standing_army_tooltip: "Maintain a strong army with high tradition and sufficient income."

 mission_den_build_the_fleet: "Build the Fleet"
 mission_den_build_the_fleet_desc: "Denmark is a maritime nation. Our power rests on the sea. Build a fleet worthy of a northern great power — galleys for the Baltic, heavy warships for the North Sea."
 mission_den_build_the_fleet_tooltip: "Build a substantial navy with dockyards to support it."

 mission_den_develop_shipbuilding: "Danish Shipbuilding Excellence"
 mission_den_develop_shipbuilding_desc: "Danish shipwrights are among the finest in Europe. Invest in grand shipyards and develop the techniques that will make Danish ships the envy of the world."
 mission_den_develop_shipbuilding_tooltip: "Maintain a large navy with grand shipyards and high tradition."

 mission_den_the_english_claim: "The English Claim"
 mission_den_the_english_claim_desc: "Canute the Great once ruled England, Denmark, Norway, and much of Sweden — a true North Sea Empire. That legacy has not been forgotten. With our armies strong and our navy supreme, the ancient claim on England can be pressed once more."
 mission_den_the_english_claim_tooltip: "Match England militarily with a strong navy and sufficient prestige. Receive a casus belli."

 mission_den_scottish_alliance: "The Scottish Alliance"
 mission_den_scottish_alliance_desc: "Scotland and Denmark share a common enemy in England. An alliance or deeper bond with Scotland would open a second front against the English and give Denmark a foothold on the British Isles."
 mission_den_scottish_alliance_tooltip: "Secure an alliance or union with Scotland."

 mission_den_restore_the_danelaw: "Restore the Danelaw"
 mission_den_restore_the_danelaw_desc: "York, Lincoln, Norwich — the old Danelaw cities where our ancestors settled and ruled. The Great Heathen Army claimed these lands in 865. It is time to reclaim what was ours."
 mission_den_restore_the_danelaw_tooltip: "Own York, the Northumbrian heartland, and the key Midlands and East Anglian cities."

 mission_den_king_of_england: "King of England"
 mission_den_king_of_england_desc: "London has fallen. England's finest cities fly the Danish banner. Canute's dream — a North Sea Empire spanning England, Denmark, and Norway — is reborn. Let history remember this day."
 mission_den_king_of_england_tooltip: "Own London and York and utterly dominate England militarily."

mission_den_reclaim_the_south: "Reclaim the South"
 mission_den_reclaim_the_south_desc: "The duchies of Schleswig and Holstein are the perennial wound in Denmark's southern flank — half-Danish, half-German, and forever contested. Bring them under firm Danish control."
 mission_den_reclaim_the_south_tooltip: "Own all locations in Denmark area and drive out Schleswig."

 mission_den_integrate_the_duchies: "Integrate the Duchies"
 mission_den_integrate_the_duchies_desc: "Holding the duchies is not enough — they must become Danish in administration and loyalty. Bind Schleswig and Holstein permanently to the crown and make them Danish in every sense."
 mission_den_integrate_the_duchies_tooltip: "Own all major Holstein locations with high stability and legitimacy."

 mission_den_break_imperial_bond: "Break the Imperial Bond"
 mission_den_break_imperial_bond_desc: "Holstein is technically a fief of the Holy Roman Empire — a legal fiction that has plagued Denmark for centuries. Pay the Emperor his due, or simply ignore the Imperial claim. Either way, Holstein must be fully Danish."
 mission_den_break_imperial_bond_tooltip: "Remove Holstein from Imperial jurisdiction with gold, legitimacy, and prestige."

 mission_den_develop_jutland: "Develop Jutland"
 mission_den_develop_jutland_desc: "The Danish heartland — the peninsula of Jutland and the great islands — feeds the kingdom and supplies its soldiers. Invest in these lands and build a strong foundation for Danish power."
 mission_den_develop_jutland_tooltip: "Own and develop key Jutland locations with literacy and income."

 mission_den_danish_agriculture: "The Granary of the North"
 mission_den_danish_agriculture_desc: "Danish wheat is prized across the Baltic and North Sea. Turn the kingdom's fertile fields into a true agricultural engine that funds our ambitions."
 mission_den_danish_agriculture_tooltip: "Achieve high wheat production with strong income."

 # ==================== MODIFIER NAMES ====================
 STATIC_MODIFIER_NAME_danish_recovery: "Danish Recovery"
 STATIC_MODIFIER_DESC_danish_recovery: "The kingdom's finances are stabilizing and royal authority slowly reasserts itself."

 STATIC_MODIFIER_NAME_danish_crown_secure: "The Crown Secured"
 STATIC_MODIFIER_DESC_danish_crown_secure: "The Danish crown rests firmly, its authority unchallengeable by noble or foreign rival."

 STATIC_MODIFIER_NAME_danish_royal_authority: "Royal Authority Strengthened"
 STATIC_MODIFIER_DESC_danish_royal_authority: "The Danish crown stands supreme over the nobility and the church alike."

 STATIC_MODIFIER_NAME_danish_nordic_ambition: "Nordic Ambition"
 STATIC_MODIFIER_DESC_danish_nordic_ambition: "Denmark looks north and sees its destiny — the unification of the Scandinavian kingdoms under Danish leadership."

 STATIC_MODIFIER_NAME_swedish_union_courted: "Sweden Courted"
 STATIC_MODIFIER_DESC_swedish_union_courted: "Danish diplomats and armies have brought Sweden closer to the union."

 STATIC_MODIFIER_NAME_norwegian_union_secured: "Norway Secured"
 STATIC_MODIFIER_DESC_norwegian_union_secured: "Norway is bound to Denmark in union, a loyal partner in Nordic ambition."

 STATIC_MODIFIER_NAME_kalmar_union_tightened: "The Kalmar Union"
 STATIC_MODIFIER_DESC_kalmar_union_tightened: "The Kalmar Union is proclaimed. With Scandinavia united under one crown, integration of subjects proceeds at extraordinary speed — the administrative machinery of three kingdoms works as one."

 STATIC_MODIFIER_NAME_tvillingerigerne: "Tvillingerigerne"
 STATIC_MODIFIER_DESC_tvillingerigerne: "The Twin Kingdoms of Denmark and Norway stand undivided. With Sweden gone from the equation, the Dano-Norwegian bond has hardened into something permanent — a northern power built not on the fragile compromises of the Kalmar Union, but on genuine unity between two peoples of the sea."

 STATIC_MODIFIER_NAME_swedish_bloodbath_aftermath: "Aftermath of the Bloodbath"
 STATIC_MODIFIER_DESC_swedish_bloodbath_aftermath: "The executions in Stockholm have shattered Swedish trust in Danish rule. The nobility seethes, the clergy mourns, and the people rage."

 STATIC_MODIFIER_NAME_bloodbath_infamy: "The Stockholm Bloodbath"
 STATIC_MODIFIER_DESC_bloodbath_infamy: "Christian's massacre of Swedish nobles has horrified Europe. Denmark's reputation lies in ruins."

 STATIC_MODIFIER_NAME_gustav_vasa_uprising: "Gustav Vasa's Uprising"
 STATIC_MODIFIER_DESC_gustav_vasa_uprising: "A young Swedish nobleman rides through Dalarna, raising the banner of Swedish independence. The people follow. The Kalmar Union may never recover."

 STATIC_MODIFIER_NAME_sound_controlled: "The Sound Controlled"
 STATIC_MODIFIER_DESC_sound_controlled: "Denmark commands the Øresund. No fleet passes without our permission."

 STATIC_MODIFIER_NAME_oresund_toll_established: "The Øresund Toll"
 STATIC_MODIFIER_DESC_oresund_toll_established: "Every ship that passes through the Sound pays Denmark. The toll is the lifeblood of Danish wealth."

 STATIC_MODIFIER_NAME_danish_baltic_hegemon: "Baltic Hegemon"
 STATIC_MODIFIER_DESC_danish_baltic_hegemon: "Denmark dominates Baltic trade. Our merchants, our ships, our tolls — the Baltic is a Danish sea."

 STATIC_MODIFIER_NAME_hansa_subjugated: "Hanse Subjugated"
 STATIC_MODIFIER_DESC_hansa_subjugated: "The Hanseatic League has been brought to heel. Danish interests now direct northern trade."

 STATIC_MODIFIER_NAME_north_sea_dominance: "North Sea Dominance"
 STATIC_MODIFIER_DESC_north_sea_dominance: "Denmark's fleet rules the North Sea. No rival navy dares challenge us in these waters."

 STATIC_MODIFIER_NAME_danish_english_pretensions: "Pretensions to the English Throne"
 STATIC_MODIFIER_DESC_danish_english_pretensions: "Denmark revives the memory of Canute's North Sea Empire, pressing its ancient claim on England."

 STATIC_MODIFIER_NAME_danelaw_restored: "The Danelaw Restored"
 STATIC_MODIFIER_DESC_danelaw_restored: "York, Lincoln, and East Anglia fly the Danish banner once more. The memory of the Great Heathen Army is avenged."

 STATIC_MODIFIER_NAME_north_sea_empire_restored: "The North Sea Empire"
 STATIC_MODIFIER_DESC_north_sea_empire_restored: "Canute's dream reborn. Denmark rules England and the North Sea. History will remember this age."

 STATIC_MODIFIER_NAME_north_atlantic_secured: "North Atlantic Secured"
 STATIC_MODIFIER_DESC_north_atlantic_secured: "Iceland, Faroe, and Greenland — the chain of the North Atlantic — are firmly in Danish hands."

 STATIC_MODIFIER_NAME_vinland_reached: "Vinland"
 STATIC_MODIFIER_DESC_vinland_reached: "Denmark has followed Leif Erikson's wake to the shores of a new world."

 STATIC_MODIFIER_NAME_danish_atlantic_presence: "Danish Atlantic Empire"
 STATIC_MODIFIER_DESC_danish_atlantic_presence: "Denmark rules the North Atlantic from Faroe to Vinland."

 STATIC_MODIFIER_NAME_danish_colonial_company: "The Danish Colonial Company"
 STATIC_MODIFIER_DESC_danish_colonial_company: "The Colonial Company coordinates Denmark's overseas empire, extracting wealth from three continents."

 STATIC_MODIFIER_NAME_danish_gold_coast_established: "The Danish Gold Coast"
 STATIC_MODIFIER_DESC_danish_gold_coast_established: "Fort Christiansborg flies the Danish flag over the Gold Coast. African trade flows north to Copenhagen."

 STATIC_MODIFIER_NAME_danish_west_indies_established: "The Danish West Indies"
 STATIC_MODIFIER_DESC_danish_west_indies_established: "Danish plantations on Sint Thomas, Sint Jan and Sint Croix produce raw cane shipped north to Copenhagen's refineries. The islands run on plantation labor, molasses and profit."

 STATIC_MODIFIER_NAME_danish_india_established: "Danish India"
 STATIC_MODIFIER_DESC_danish_india_established: "From the factory at Tranquebar, Danish merchants buy bales of Coromandel cotton and fine cloth, goods that European markets hunger for. The Danes are known here as fairer dealers than the VOC."

 STATIC_MODIFIER_NAME_gotland_seized: "Gotland Seized"
 STATIC_MODIFIER_DESC_gotland_seized: "Visby and Gotland are under Danish control. The heart of Baltic trade beats for Denmark now."

 STATIC_MODIFIER_NAME_rugen_reclaimed: "Rügen Reclaimed"
 STATIC_MODIFIER_DESC_rugen_reclaimed: "The island of Rügen has returned to Danish control after over a century of Pomeranian rule."

STATIC_MODIFIER_NAME_danish_southern_duchies: "Schleswig-Holstein Secured"
 STATIC_MODIFIER_DESC_danish_southern_duchies: "The southern duchies are firmly in Danish hands, providing manpower and a buffer against the Empire."

 STATIC_MODIFIER_NAME_duchies_integrated: "Duchies Integrated"
 STATIC_MODIFIER_DESC_duchies_integrated: "Schleswig and Holstein are fully bound to the Danish crown."

 STATIC_MODIFIER_NAME_jutland_developed: "Jutland Developed"
 STATIC_MODIFIER_DESC_jutland_developed: "The Danish heartland flourishes, its towns and farms supporting the kingdom's growing power."

 STATIC_MODIFIER_NAME_danish_agrarian_economy: "The Granary of the North"
 STATIC_MODIFIER_DESC_danish_agrarian_economy: "Danish wheat feeds the realm and fills the treasury through export."

 STATIC_MODIFIER_NAME_scandinavian_golden_age: "The Scandinavian Golden Age"
 STATIC_MODIFIER_DESC_scandinavian_golden_age: "Scandinavia stands at the height of its power. An age of prosperity, strength, and northern supremacy."

 STATIC_MODIFIER_NAME_danish_military_reforms: "Danish Military Reforms"
 STATIC_MODIFIER_DESC_danish_military_reforms: "The Danish army has been modernized and professionalized."

 STATIC_MODIFIER_NAME_danish_standing_army: "Standing Army"
 STATIC_MODIFIER_DESC_danish_standing_army: "Denmark maintains a permanent professional army, ready at all times."

 STATIC_MODIFIER_NAME_danish_naval_tradition: "Danish Naval Tradition"
 STATIC_MODIFIER_DESC_danish_naval_tradition: "Generations of seafarers have made Denmark's navy among the most feared in the North."

 STATIC_MODIFIER_NAME_danish_shipbuilding_excellence: "Shipbuilding Excellence"
 STATIC_MODIFIER_DESC_danish_shipbuilding_excellence: "Danish shipwrights build the finest vessels in northern Europe."

 STATIC_MODIFIER_NAME_danish_finland_secured: "Finland Secured"
 STATIC_MODIFIER_DESC_danish_finland_secured: "The northern forests and coasts of Finland are firmly under Danish control."

 STATIC_MODIFIER_NAME_danish_estonia_held: "Estonia Held"
 STATIC_MODIFIER_DESC_danish_estonia_held: "Reval and the Estonian coast remain under Danish rule — our eastern Baltic foothold."

 STATIC_MODIFIER_NAME_danish_baltic_foothold: "A Baltic Foothold"
 STATIC_MODIFIER_DESC_danish_baltic_foothold: "Denmark commands the Estonian coast and projects power across the eastern Baltic."

 STATIC_MODIFIER_NAME_copenhagen_university: "University of Copenhagen"
 STATIC_MODIFIER_DESC_copenhagen_university: "The University of Copenhagen draws scholars from across Scandinavia and beyond."

 STATIC_MODIFIER_NAME_danish_lutheran_church: "The Danish Lutheran Church"
 STATIC_MODIFIER_DESC_danish_lutheran_church: "Denmark has embraced the Lutheran Reformation, binding church and crown together."

 STATIC_MODIFIER_NAME_sweden_kept_loyal: "Sweden Kept Loyal"
 STATIC_MODIFIER_DESC_sweden_kept_loyal: "Careful statecraft has kept Sweden within the union, at least for now."

 STATIC_MODIFIER_NAME_nordic_scientific_tradition: "Nordic Scientific Tradition"
 STATIC_MODIFIER_DESC_nordic_scientific_tradition: "The scholars of Scandinavia lead Europe in natural philosophy and the sciences."

 STATIC_MODIFIER_NAME_danish_scottish_pact: "The Danish-Scottish Pact"
 STATIC_MODIFIER_DESC_danish_scottish_pact: "Denmark and Scotland stand together as allies, their merchants and courts bound by mutual interest against England."

 STATIC_MODIFIER_NAME_highland_regiments: "Highland Regiments"
 STATIC_MODIFIER_DESC_highland_regiments: "Scotland — vassal, or fully absorbed into the realm — provides hardened soldiers and levies to the Danish crown."

 # ==================== EVENT TITLES ====================
 denmark_mission_events.1.t: "The Crown Secured"
 denmark_mission_events.1.d: "The Danish crown is secure. The nobles are managed, the capital developed, and our legitimacy restored. Now we must decide how to consolidate this new authority."
 denmark_mission_events.1.a: "Strengthen the Crown's hand."
 denmark_mission_events.1.b: "Reward the loyal nobility."

 denmark_mission_events.2.t: "The Kingdom Recovers"
 denmark_mission_events.2.d: "Denmark's finances are restored and the crown stands on firmer ground. The kingdom breathes again."
 denmark_mission_events.2.a: "Denmark endures."

 denmark_mission_events.3.t: "Nordic Ambitions"
 denmark_mission_events.3.d: "Denmark reaches north. Norway and Sweden watch us carefully."
 denmark_mission_events.3.a: "Offer diplomatic concessions."
 denmark_mission_events.3.b: "Assert Danish dominance."

 denmark_mission_events.4.t: "Norway Joins the Union"
 denmark_mission_events.4.d: "Norway is ours. The question is how we bind them — through trust or through firm control."
 denmark_mission_events.4.a: "Bind Norway to the Crown."
 denmark_mission_events.4.b: "Allow Norway its autonomy."

 denmark_mission_events.5.t: "The Kalmar Union"
 denmark_mission_events.5.d: "Three kingdoms, one crown. Denmark, Norway, and Sweden are united under the Kalmar Union. History will judge whether we can hold it."
 denmark_mission_events.5.a: "The union is proclaimed!"

 denmark_mission_events.8.t: "The Øresund Toll"
 denmark_mission_events.8.d: "The toll booths are built. Every ship pays Denmark. The Sound is ours."
 denmark_mission_events.8.a: "Let the gold flow."
 denmark_mission_events.8.b: "Keep the merchants happy."

 denmark_mission_events.10.t: "Greenland Claimed"
 denmark_mission_events.10.d: "Our ships have charted the ice-bound shores of Greenland and planted the Danish flag. The stepping stone to the North Atlantic is ours."
 denmark_mission_events.10.a: "Establish a colony."
 denmark_mission_events.10.b: "Use it as a naval base."

 denmark_mission_events.13.t: "Army Reforms"
 denmark_mission_events.13.d: "The Danish army has been reorganized and professionalized. Our soldiers are ready."
 denmark_mission_events.13.a: "Train the officer corps."
 denmark_mission_events.13.b: "Fill the ranks."

 denmark_mission_events.14.t: "The English Claim"
 denmark_mission_events.14.d: "Our heralds proclaim Denmark's ancient right to the English crown. Canute's legacy lives."
 denmark_mission_events.14.a: "England will be ours."

 denmark_mission_events.15.t: "The Kingdom of Scandinavia"
 denmark_mission_events.15.d: "Scandinavia is one. The age of division is over."
 denmark_mission_events.15.a: "One kingdom, one people!"
 denmark_mission_events.15.b: "The sea is our strength."

 denmark_mission_events.16.t: "The Golden Age of Scandinavia"
 denmark_mission_events.16.d: "Scandinavia stands at the height of its power. The skalds will sing of this age for a thousand years."
 denmark_mission_events.16.a: "Let this age be remembered."

 denmark_mission_events.17.t: "Sweden in the Union"
 denmark_mission_events.17.d: "Sweden is ours — but Swedish loyalty is earned, not inherited. How do we proceed?"
 denmark_mission_events.17.a: "Rule Sweden with a lighter hand."
 denmark_mission_events.17.b: "Keep Sweden firmly in check."
 denmark_mission_events.17.c: "Let them go — for now."

 denmark_mission_events.18.t: "Estonia Held"
 denmark_mission_events.18.d: "Reval and the Estonian coast remain under Danish control. Our eastern foothold is secure."
 denmark_mission_events.18.a: "Hold firm."
 denmark_mission_events.18.b: "Exploit the trade routes."

 denmark_mission_events.19.t: "The Pearl of the North"
 denmark_mission_events.19.d: "Copenhagen grows into one of the great cities of northern Europe. How shall we direct its continued growth?"
 denmark_mission_events.19.a: "Favor the merchants."
 denmark_mission_events.19.b: "Favor the crown."

 denmark_mission_events.20.t: "A Seat of Learning"
 denmark_mission_events.20.d: "The University of Copenhagen attracts brilliant minds. Theologians and natural philosophers debate the future of knowledge. What shall be the university's calling?"
 denmark_mission_events.20.a: "A pillar of the Reformed Church."
 denmark_mission_events.20.b: "A center of the sciences."

 denmark_mission_events.21.t: "The Duchies in Hand"
 denmark_mission_events.21.d: "Schleswig and Holstein are secured, but their German nobility resists full integration. How do we bind them?"
 denmark_mission_events.21.a: "Bind them to the Crown."
 denmark_mission_events.21.b: "Respect the privileges of the knights."

 denmark_mission_events.22.t: "The Wealth of the Land"
 denmark_mission_events.22.d: "Jutland's farms and pastures produce more than ever. How shall we develop this bounty?"
 denmark_mission_events.22.a: "Export our produce."
 denmark_mission_events.22.b: "Invest in the towns."

 # ==================== KALMAR UNION CHAIN EVENTS ====================

 denmark_mission_events.26.t: "The Stockholm Bloodbath"
 denmark_mission_events.26.d: "It is November. Christian has recaptured Stockholm after years of Swedish resistance. He calls a great celebration — a reconciliation feast, a royal coronation banquet. Three days of feasting. Then, on the third day, the gates of Stockholm are locked.\n\nNinety-two Swedish nobles, bishops, and burghers are dragged into the square and executed. The bodies are piled and burned. Christian calls them heretics. History will call it murder.\n\nSomewhere in the forests of Dalarna, a young nobleman named Gustav Vasa is already riding north. He will not stop."
 denmark_mission_events.26.a: "So it was done."

 denmark_mission_events.27.t: "The Kalmar Union — A Fragile Peace"
 denmark_mission_events.27.d: "Sweden is within the union — but do not mistake submission for loyalty. The Swedish nobles have bent the knee, for now. They will watch Denmark closely.\n\nIf our crown grows weak — our stability shaken, our legitimacy questioned, our treasury drowning in debt, our authority over our own estates crumbling — Sweden will smell it. They have broken free before and they will do so again.\n\nKeep Denmark strong. Keep Sweden watched. The union is only as durable as Danish power."
 denmark_mission_events.27.a: "Sweden will not find us wanting."

 denmark_mission_events.28.t: "Unrest in Sweden"
 denmark_mission_events.28.d: "Reports from Stockholm are troubling. The Swedish nobility grows restless beneath the Danish yoke — whispers of the old days of independence circulate in the great halls of Uppsala and Stockholm. Our grip on the union weakens.\n\nIf Denmark cannot project strength and authority, history suggests the Swedes will test our resolve. They have done it before."
 denmark_mission_events.28.a: "We must not show weakness."

 denmark_mission_events.29.t: "Gustav Vasa Raises His Banner"
 denmark_mission_events.29.d: "The Bloodbath has not gone unanswered. Gustav Vasa — whose father and brother-in-law died in the square at Stockholm — rides through the mining districts of Dalarna. The peasants and miners rally to him. They remember the dead.\n\nThe Kalmar Union faces its greatest crisis. Sweden may yet break free — and this time, it may be permanent."
 denmark_mission_events.29.a: "Gustav Vasa must be stopped."

denmark_mission_events.30.t: "The Purchase of Rügen"
 denmark_mission_events.30.d: "The lord of Rügen is willing to discuss terms. For 500 gold, the island passes to Danish hands without a drop of blood. The alternative is conquest — slower, costlier, and messier."
 denmark_mission_events.30.a: "Pay the 500 gold. Rügen is ours."
 denmark_mission_events.30.b: "We will take it by force instead."

