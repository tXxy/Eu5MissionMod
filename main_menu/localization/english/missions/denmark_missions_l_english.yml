 STATIC_MODIFIER_NAME_holstein_defiant_freedom: "Defiant Freedom"
 STATIC_MODIFIER_DESC_holstein_defiant_freedom: "Holstein stands proud, free from the yoke of the Empire."

STATIC_MODIFIER_NAME_lubeck_danish_entrepot: "Danish Entrepôt"
