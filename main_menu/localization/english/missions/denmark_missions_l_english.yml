 # ==================== COLONIAL MODIFIER NAMES ====================

 STATIC_MODIFIER_NAME_vinland_norse_settlement: "Norse Settlement"
 STATIC_MODIFIER_DESC_vinland_norse_settlement: "Danish colonists follow the old Norse routes, planting permanent settlements in Vinland's forests and coasts."

 STATIC_MODIFIER_NAME_skraeling_trade_pact: "Skræling Trade Pact"
 STATIC_MODIFIER_DESC_skraeling_trade_pact: "A cautious peace has been struck with the native peoples of Vinland. Furs and goods flow both ways along the forest trails."

 STATIC_MODIFIER_NAME_vinland_crown_colony: "Vinland — Crown Colony"
 STATIC_MODIFIER_DESC_vinland_crown_colony: "Vinland is no longer a distant outpost but a Crown Colony, administered directly from Copenhagen."

 STATIC_MODIFIER_NAME_danish_fur_trade: "The Vinland Fur Trade"
 STATIC_MODIFIER_DESC_danish_fur_trade: "Danish merchants grow rich on beaver pelts and furs shipped back across the North Atlantic."

 STATIC_MODIFIER_NAME_christiansborg_fortified: "Fort Christiansborg"
 STATIC_MODIFIER_DESC_christiansborg_fortified: "The walls of Fort Christiansborg rise over Accra. Denmark's presence on the Gold Coast is permanent."

 STATIC_MODIFIER_NAME_gold_coast_trading_rights: "Gold Coast Trading Rights"
 STATIC_MODIFIER_DESC_gold_coast_trading_rights: "Denmark has negotiated preferential trading rights with the local Akan kings, securing a steady flow of gold and ivory."

 STATIC_MODIFIER_NAME_danish_sugar_monopoly: "The Danish Sugar Monopoly"
 STATIC_MODIFIER_DESC_danish_sugar_monopoly: "The crown has established a monopoly over Caribbean sugar — every hogshead must pass through Copenhagen. Planters grumble, but the treasury grows fat on the difference."

 STATIC_MODIFIER_NAME_danish_caribbean_freeport: "Caribbean Freeport"
 STATIC_MODIFIER_DESC_danish_caribbean_freeport: "Sint Thomas is open to all flags — Dutch, English, French, even the Spanish look the other way. What we lose in monopoly we gain in volume. Every ship in the Caribbean knows our harbor."

 STATIC_MODIFIER_NAME_tranquebar_factory: "The Tranquebar Factory"
 STATIC_MODIFIER_DESC_tranquebar_factory: "The factory at Tranquebar — Tharangambadi, the Village of the Singing Waves — trades in Coromandel cotton and fine muslin. Danish missionaries here have also built a printing press, one of the first in India."

 STATIC_MODIFIER_NAME_danish_coromandel_mission: "The Coromandel Mission"
 STATIC_MODIFIER_DESC_danish_coromandel_mission: "Danish missionaries and diplomats have built goodwill along the Coromandel Coast, opening doors for trade and settlement."

 STATIC_MODIFIER_NAME_danish_spice_route: "The Danish Spice Route"
 STATIC_MODIFIER_DESC_danish_spice_route: "Danish ships now sail a continuous arc from Copenhagen to the Coromandel Coast, carrying Indiase stoffen westward and European goods east. The cloth trade has made Denmark a true Indian Ocean power."

 # ==================== COLONIAL EVENTS ====================

 denmark_mission_events.31.t: "First Sight of Vinland"
 denmark_mission_events.31.d: "The ships make landfall on a coast of dark pine and grey rock. The men say they can smell the forests from a mile out. One of the older sailors — a man from Iceland who had heard his grandfather's stories — falls to his knees on the shore.\n\nWe have found it. The land the Norse called Vinland. The captains are of one mind: this ground must be held. The natives watch from the tree line."
 denmark_mission_events.31.a: "Plant a permanent settlement."

 denmark_mission_events.32.t: "The Question of the Skrælings"
 denmark_mission_events.32.d: "They came to the edge of the settlement at dawn — twenty men, some with bows, watching. Our interpreter — a Greenlander who had learned fragments of a similar tongue — made himself known. They did not attack.\n\nFor three days they traded. Furs for iron. Dried fish for cloth. The colonists argue: these people are numerous and know this land better than we ever will. Do we seek their friendship, or do we press ahead with what Denmark needs regardless?"
 denmark_mission_events.32.a: "Press ahead. Denmark needs this land."
 denmark_mission_events.32.b: "Make a formal pact of trade and peace."

 denmark_mission_events.33.t: "The Colonial Council"
 denmark_mission_events.33.d: "The Colonial Company has made Denmark rich, but the question of governance hangs over Vinland like an Atlantic fog. The settlers are Danish, but they are also something new — people shaped by a land that has no memory of Copenhagen, no feudal ties, no ancient obligations.\n\nThe Council debates. Do we govern Vinland as a Crown Colony — direct, controlled, loyal? Or do we grant the company and its investors full authority, letting commerce rule where the crown cannot reach?"
 denmark_mission_events.33.a: "Vinland is a Crown Colony. The King rules here."
 denmark_mission_events.33.b: "Let the Company govern. Commerce will bind them."

 denmark_mission_events.34.t: "Fort Christiansborg"
 denmark_mission_events.34.d: "The fort is built on a rocky outcrop above Accra. Danish engineers have done their work well — the walls are thick, the cannon ports face the sea, and the Danish flag flies where no European banner flew before.\n\nThe local Akan chiefs have watched the construction with interest rather than fear. They see opportunity in the white-walled fort: a powerful new partner, a check on their rivals, a buyer for what the forest and the interior produces. The question is what Denmark does with this opportunity."
 denmark_mission_events.34.a: "Fortify Christiansborg and dominate the coast."
 denmark_mission_events.34.b: "Prioritize trade agreements with the Akan kings."

 denmark_mission_events.36.t: "The Sugar Islands"
 denmark_mission_events.36.d: "The Caribbean smells of cut cane and rain. The Danish islands — bought, taken, or settled — produce sugar in quantities that would have seemed impossible to our grandfathers. Ships load at anchor in turquoise water, their holds filling with hogsheads of raw cane.\n\nCopenhagen's refineries hum. The merchants of the Baltic want Danish sugar. The question now is how to organize the empire of sweetness we have built — as a monopoly crown trade, or as an open port that draws all of Europe's trade to our harbors."
 denmark_mission_events.36.a: "Establish a Danish royal sugar monopoly."
 denmark_mission_events.36.b: "Open a free port. Let all ships pay our fees."

 denmark_mission_events.37.t: "The Hurricane Season"
 denmark_mission_events.37.d: "In August the sky turns the color of old iron and the sea begins to move in long, slow swells that speak of something terrible coming from the east. The colonists know the signs now. The Danish West Indies has survived three hurricanes in fifteen years.\n\nEach time, the question of investment returns. The planters want protection — warehouses, breakwaters, fortified harbors. But rebuilding costs gold that could go to fleet or army. The governor writes to Copenhagen for guidance."
 denmark_mission_events.37.a: "Invest in permanent harbor fortifications."
 denmark_mission_events.37.b: "Build more plantation capacity. Wealth justifies the risk."

 denmark_mission_events.38.t: "Tranquebar"
 denmark_mission_events.38.d: "The Coromandel Coast in June is a wall of heat and color. The fishing boats bring in nets heavy with silver fish. Behind the beach, the town of Tranquebar — Tharangambadi in Tamil, the Village of the Singing Waves — watches the Danish ships arrive with the cautious welcome of a town that has seen many foreign flags.\n\nThe Nayak of Tanjore granted us this ground. The deed was signed, the cannon fired, the fort begun. Our factor writes from the shore: this is the beginning of something extraordinary, or the beginning of a catastrophe. He is not sure which."
 denmark_mission_events.38.a: "Build the factory and fortify Tranquebar."
 denmark_mission_events.38.b: "Send diplomats and missionaries first. Build trust."

 denmark_mission_events.39.t: "The Spice Question"
 denmark_mission_events.39.d: "From Tranquebar our ships reach east: Ceylon, the Malabar Coast, the straits of Malacca. The Spice Islands lie just beyond. The Dutch have fortified Batavia. The English watch us from Madras.\n\nOur admiral sends a dispatch from the Nicobar Islands: we can reach the spice markets directly if we are bold enough. The route is dangerous — monsoons, pirates, rival fleets — but the profits would make Denmark a true power in the Indian Ocean. The question is whether to go further, or to consolidate what we have."
 denmark_mission_events.39.a: "Consolidate Tranquebar. Profit is enough."
 denmark_mission_events.39.b: "Push east. Denmark claims the spice route."

 denmark_mission_events.40.t: "The Danelaw Reborn"
 denmark_mission_events.40.d: "The bells of York toll for a Danish king again. Three centuries after Alfred's heirs drove the last Norse jarls from these shores, Danish banners fly over York, Lincoln, and Norwich once more. The longships did not need to come — the army that took Northumbria marched under Danish colors from the start, and it did not lose.\n\nOld men in the marketplaces mutter about the days of the Danelaw, half-legend now, and cross themselves. Younger men look at the size of the garrison and the discipline of its soldiers, and decide legends are not so important as which lord signs their tax roll. Northumbria is not merely occupied. It is held — by a kingdom that could, if it wished, hold far more.\n\nThe council in Copenhagen asks how this new dominion should be shaped: as a conquest to be exploited and expanded from, or as a realm to be woven permanently into Denmark's own?"
 denmark_mission_events.40.a: "Northumbria is a spearhead. There is more of England left to take."
 denmark_mission_events.40.b: "Northumbria is ours now — govern it as Danish soil, not occupied ground."

 denmark_mission_events.41.t: "King of England"
 denmark_mission_events.41.d: "London has fallen. Not to a raid, not to a Danegeld demand backed by a fleet on the horizon — the city has fallen the way capitals fall, to an army too large and too disciplined to refuse. Winchester and Canterbury followed within the season. East Anglia, the Midlands, and the Home Counties answer to Copenhagen now, and there is no English force left in the field capable of contesting it.\n\nCanute united this crown once, centuries ago, and lost it within a generation. What sits on the English throne today is not a distant king ruling through absent regents — it is the culmination of a war machine that broke Sweden, humbled the Hanse, crossed oceans, and now marches down the length of England unopposed. The scale of what has been assembled to reach this throne room is, by any measure, staggering.\n\nThe question is no longer whether England can be held. It is what kind of monarchy Denmark intends to be, now that it commands two crowns, three seas, and an army that answers to no rival in the North."
 denmark_mission_events.41.a: "Let the coronation at Westminster be remembered — a dynasty, not a conquest."
 denmark_mission_events.41.b: "The crown matters less than the fleets that carried the army here. Build the empire of the sea."

