 STATIC_MODIFIER_NAME_danelaw_reborn_stewards: "Danelaw Reborn: Stewards"
 STATIC_MODIFIER_DESC_danelaw_reborn_stewards: "The old Danelaw is bound into the Danish realm as true crown territory, administered rather than merely occupied."

 STATIC_MODIFIER_NAME_crowned_at_westminster: "Crowned at Westminster"
 STATIC_MODIFIER_DESC_crowned_at_westminster: "A Danish king sits crowned in Westminster. Two kingdoms, one crown, and a dynasty determined to outlast Canute's."

 STATIC_MODIFIER_NAME_north_sea_thalassocracy: "North Sea Thalassocracy"
 STATIC_MODIFIER_DESC_north_sea_thalassocracy: "Denmark's power rests on its fleets as much as its throne. From the Sound to the Channel, the North Sea answers to Copenhagen."

 denmark_mission_events.42.t: "Gotland, by Right of the Crown"
 denmark_mission_events.42.d: "Sweden shares a crown with Denmark now, and a shared crown means shared obligations — Gotland, the Swedish councilors are reminded, sits closer to Copenhagen's interests than Stockholm's. The union does not survive a refusal. Visby, Slite, and Hoborg pass to Danish administration whether Stockholm is pleased about it or not."
 denmark_mission_events.42.a: "The demand is made. Gotland is ours."
