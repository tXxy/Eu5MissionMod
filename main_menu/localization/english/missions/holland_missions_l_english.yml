# === EVENT LOCALIZATION ===
# Note: These are placeholder event names for your mission completion events
# You'll need to create corresponding events in your mod
holland_mission_events.1.t: "Amsterdam Developed"
holland_mission_events.1.d: "Amsterdam has transformed from a small fishing village into a bustling commercial center. Its markets attract traders from across Europe, and its canals fill with ships bearing goods from distant lands."

holland_mission_events.2.t: "Dutch Independence Asserted"
holland_mission_events.2.d: "Holland has broken free from foreign domination and stands as a sovereign state. Our merchants can now trade freely, our ships sail under our own flag, and our destiny is in our own hands."

holland_mission_events.3.t: "Dutch Republic Established"
holland_mission_events.3.d: "The Dutch Republic has been formally established, creating a unique government that balances merchant oligarchy with representative institutions. This innovative system will serve as a model for other nations."

holland_mission_events.4.t: "East India Company Founded"
holland_mission_events.4.d: "The Dutch East India Company (VOC) has been chartered, granting it monopoly rights over Asian trade. This powerful organization will organize our colonial ventures and defend our trading interests."

holland_mission_events.5.t: "Cape Colony Established"
holland_mission_events.5.d: "A settlement has been founded at the Cape of Good Hope, providing a vital resupply point for ships traveling between Europe and Asia. This strategic position secures our sea routes to the East."

holland_mission_events.6.t: "Spice Trade Dominated"
holland_mission_events.6.d: "Dutch control over the Indonesian spice islands is now complete. Nutmeg, cloves, and pepper flow into Amsterdam, making us the world's primary spice supplier and bringing immense wealth."

holland_mission_events.7.t: "Kingdom of the Netherlands"
holland_mission_events.7.d: "All Dutch-speaking territories have been united under a single crown, creating the Kingdom of the Netherlands. Our unified nation now commands greater respect on the European stage."

holland_mission_events.8.t: "Global Trade Network Established"
holland_mission_events.8.d: "Dutch trading posts, colonies, and factories now span the globe. Our ships connect continents, our merchants dominate international commerce, and Amsterdam stands as the world's warehouse."

holland_mission_events.9.t: "Dutch Golden Age Begins"
holland_mission_events.9.d: "The Netherlands has entered a period of unprecedented prosperity and cultural flourishing. Our artists create masterpieces, our scientists make discoveries, our merchants accumulate wealth, and our influence extends across the world."