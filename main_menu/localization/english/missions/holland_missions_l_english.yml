l_english:

# === MISSION PACK HEADER ===
holland_mission_pack: "Holland: The Dutch Republic"
holland_mission_pack_desc: "Guide Holland from a small county to a global trading empire through commerce, naval power, and colonial expansion."
holland_mission_pack_BUTTON_TOOLTIP: "Complete missions to establish Dutch independence, build a colonial empire, and create the world's foremost trading nation."
holland_mission_pack_CRITERIA_DESCRIPTION: "Develop Amsterdam, secure independence, establish trade networks, and build colonies to unlock powerful economic and naval modifiers."

# === PHASE 1: HOLLAND CONSOLIDATION (1337-1450) ===
mission_hol_develop_amsterdam: "Develop Amsterdam"
mission_hol_develop_amsterdam_desc: "Transform Amsterdam from a fishing village into a thriving commercial hub that will become the heart of Dutch prosperity."
mission_hol_develop_amsterdam_tooltip: "Develop Amsterdam and build market infrastructure while maintaining sufficient income."

mission_hol_secure_food_supply: "Secure Food Supply"
mission_hol_secure_food_supply_desc: "Ensure reliable agricultural production and food security for our growing population through control of fertile farmlands."
mission_hol_secure_food_supply_tooltip: "Control multiple locations producing wheat or livestock."

mission_hol_consolidate_holland: "Consolidate Holland"
mission_hol_consolidate_holland_desc: "Bring all territories of the County of Holland under our firm control to establish a solid foundation for future expansion."
mission_hol_consolidate_holland_tooltip: "Achieve control over the Holland area while maintaining stability."

mission_hol_strengthen_burghers: "Strengthen the Burghers"
mission_hol_strengthen_burghers_desc: "Empower the merchant class whose wealth and enterprise will drive Holland's economic growth and eventual independence."
mission_hol_strengthen_burghers_tooltip: "Increase burgher estate power and satisfaction."

# === PHASE 2: LOW COUNTRIES EXPANSION (1450-1550) ===
mission_hol_secure_utrecht: "Secure Utrecht"
mission_hol_secure_utrecht_desc: "Control the strategic Bishopric of Utrecht to expand our influence inland and secure additional resources."
mission_hol_secure_utrecht_tooltip: "Control the location of Utrecht."

mission_hol_expand_into_friesland: "Expand into Friesland"
mission_hol_expand_into_friesland_desc: "Extend Dutch influence into the northern Frisian lands, gaining access to skilled sailors and coastal territories."
mission_hol_expand_into_friesland_tooltip: "Establish presence in the Friesland area."

mission_hol_control_zeeland: "Control Zeeland"
mission_hol_control_zeeland_desc: "Dominate the Zeeland islands to secure our southern flank and establish critical naval bases for maritime expansion."
mission_hol_control_zeeland_tooltip: "Build naval infrastructure in coastal locations."

mission_hol_expand_into_brabant: "Expand into Brabant"
mission_hol_expand_into_brabant_desc: "Extend influence into the wealthy province of Brabant, gaining access to its textile industries and commercial centers."
mission_hol_expand_into_brabant_tooltip: "Establish presence in the Brabant area."

# === PHASE 3: DUTCH INDEPENDENCE (1550-1600) ===
mission_hol_assert_independence: "Assert Independence"
mission_hol_assert_independence_desc: "Break free from foreign overlordship and establish Holland as a sovereign state capable of pursuing its own interests."
mission_hol_assert_independence_tooltip: "Achieve independence from Burgundy, Habsburg, or Castile while maintaining stability and legitimacy."

mission_hol_embrace_protestantism: "Embrace Protestantism"
mission_hol_embrace_protestantism_desc: "Adopt the Reformed faith to strengthen national identity against Catholic overlords and align with other Protestant powers."
mission_hol_embrace_protestantism_tooltip: "Convert to Lutheranism and maintain religious unity."

mission_hol_develop_dutch_navy: "Develop Dutch Navy"
mission_hol_develop_dutch_navy_desc: "Build a powerful fleet capable of protecting our trade routes, challenging maritime rivals, and projecting power overseas."
mission_hol_develop_dutch_navy_tooltip: "Build a substantial navy and develop port infrastructure."

# === PHASE 4: DUTCH REPUBLIC (1581-1650) ===
mission_hol_establish_republic: "Establish the Republic"
mission_hol_establish_republic_desc: "Formalize our republican government structure, balancing merchant oligarchy with representative institutions."
mission_hol_establish_republic_tooltip: "Maintain republican government with strong burgher influence and stability."

mission_hol_promote_tolerance: "Promote Religious Tolerance"
mission_hol_promote_tolerance_desc: "Establish policies of religious tolerance to attract skilled immigrants, prevent internal strife, and foster economic growth."
mission_hol_promote_tolerance_tooltip: "Achieve high religious unity and stability."

mission_hol_develop_baltic_trade: "Develop Baltic Trade"
mission_hol_develop_baltic_trade_desc: "Establish dominant trading networks in the Baltic Sea, controlling the flow of grain, timber, and naval supplies."
mission_hol_develop_baltic_trade_tooltip: "Establish trading presence in the Baltic region with sufficient trade income."

# === PHASE 5: COLONIAL EXPANSION (1600-1700) ===
mission_hol_establish_east_india_company: "Establish East India Company"
mission_hol_establish_east_india_company_desc: "Create the Dutch East India Company (VOC) to organize and monopolize our Asian trade and colonial ventures."
mission_hol_establish_east_india_company_tooltip: "Maintain a substantial navy with high tradition."

mission_hol_colonize_cape: "Colonize the Cape"
mission_hol_colonize_cape_desc: "Establish a settlement at the Cape of Good Hope as a vital resupply point for ships traveling to and from Asia."
mission_hol_colonize_cape_tooltip: "Establish control in the Goringhaikona area."

mission_hol_establish_indonesian_trade: "Establish Indonesian Trade"
mission_hol_establish_indonesian_trade_desc: "Dominate the spice trade by establishing control over key Indonesian islands and their valuable spice production."
mission_hol_establish_indonesian_trade_tooltip: "Establish substantial presence in Indonesia and control spice production."

mission_hol_establish_caribbean_trade: "Establish Caribbean Trade"
mission_hol_establish_caribbean_trade_desc: "Secure lucrative Caribbean possessions for sugar, tobacco, and slave trade profits in the New World."
mission_hol_establish_caribbean_trade_tooltip: "Establish substantial presence in the Caribbean and control tobacco production."

# === PHASE 6: ECONOMIC DEVELOPMENT (1650-1750) ===
mission_hol_develop_banking: "Develop Banking System"
mission_hol_develop_banking_desc: "Establish Amsterdam as Europe's premier financial center with advanced banking, credit, and financial instruments."
mission_hol_develop_banking_tooltip: "Research banking advance and achieve high trade income."

mission_hol_develop_manufacturing: "Develop Manufacturing"
mission_hol_develop_manufacturing_desc: "Expand Dutch textile and tool manufacturing to reduce dependence on imports and create valuable export goods."
mission_hol_develop_manufacturing_tooltip: "Build cloth and tools guilds while producing substantial cloth."

# === PHASE 7: FORM NETHERLANDS (1700+) ===
mission_hol_unite_low_countries: "Unite the Low Countries"
mission_hol_unite_low_countries_desc: "Bring all Dutch-speaking territories under a single administration to create a unified and powerful Netherlands."
mission_hol_unite_low_countries_tooltip: "Achieve control over Friesland and Brabant areas with sufficient legitimacy."

mission_hol_form_netherlands: "Form the Netherlands"
mission_hol_form_netherlands_desc: "Formally establish the Kingdom of the Netherlands, uniting all Dutch territories under a single crown."
mission_hol_form_netherlands_tooltip: "Form the Netherlands tag while maintaining legitimacy and stability."

# === PHASE 8: GLOBAL TRADE EMPIRE (1750-1800) ===
mission_hol_establish_global_trade: "Establish Global Trade Network"
mission_hol_establish_global_trade_desc: "Create a worldwide trading empire connecting our colonies, factories, and trading posts across all continents."
mission_hol_establish_global_trade_tooltip: "Achieve high trade income and develop manufacturing workshops."

mission_hol_counter_british_navy: "Counter British Naval Power"
mission_hol_counter_british_navy_desc: "Build a navy capable of challenging British maritime supremacy and protecting our global trade routes."
mission_hol_counter_british_navy_tooltip: "Maintain a large navy with substantial tradition."

mission_hol_develop_science: "Develop Scientific Tradition"
mission_hol_develop_science_desc: "Foster scientific advancement and education to maintain technological leadership and economic innovation."
mission_hol_develop_science_tooltip: "Achieve high literacy and build universities."

# === PHASE 9: FINAL MISSIONS ===
mission_hol_dutch_golden_age: "Dutch Golden Age"
mission_hol_dutch_golden_age_desc: "Usher in a period of unprecedented prosperity, cultural flourishing, and global influence for the Netherlands."
mission_hol_dutch_golden_age_tooltip: "Achieve great power status with high prestige and stability."

