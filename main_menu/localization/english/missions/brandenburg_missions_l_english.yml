  # ==================== EVENT STRINGS ====================
  brandenburg_missions_events.1.t: "The Hohenzollern Ascent"
  brandenburg_missions_events.1.d: "The March has long suffered under neglect and chaos. The House von Wittelsbach has brought us pain and peril. But the Emperor offers us an alternative with strong Leadership. A competent Advisor of the Emperor, Friedrich von Hohenzollern is suggested to rule our Realm. Do we want to accept him, or will our Dynasty prevail?"
  brandenburg_missions_events.1.a: "Invite the Hohenzollerns to rule."
  brandenburg_missions_events.1.b: "We shall find our own path."
  brandenburg_missions_events.1.a.tt: "Friedrich von Hohenzollern will become the new ruler of Brandenburg."
  brandenburg_missions_events.1.b.tt: "Maintain our current dynasty, though the Emperor may be displeased."

  brandenburg_missions_events.2.t: "Developing the Heartland"
  brandenburg_missions_events.2.d: "With our power consolidated, we must decide how to best stimulate our economy. Shall we focus on the burgeoning towns or the productivity of our fields?"
  brandenburg_missions_events.2.a: "Focus on Urban Growth."
  brandenburg_missions_events.2.b: "Strengthen our Rural Roots."
  brandenburg_missions_events.2.a.tt: "Apply the 'Urban Growth Focus' modifier to our provinces."
  brandenburg_missions_events.2.b.tt: "Apply the 'Rural Productivity Focus' modifier to our provinces."

  brandenburg_missions_events.3.t: "The Residency of the Margrave"
  brandenburg_missions_events.3.d: "While our namesake city has served us well, the burgeoning town of Berlin offers a more central and strategically viable location for our administration. Where shall our court reside?"
  brandenburg_missions_events.3.a: "Berlin shall be our new seat of power."
  brandenburg_missions_events.3.b: "Brandenburg remains the heart of the Mark."
  brandenburg_missions_events.3.a.tt: ""
  brandenburg_missions_events.3.b.tt: ""

  brandenburg_missions_events.4.t: "The Fate of the Teutonic Order"
  brandenburg_missions_events.4.d: "The Teutonic Order is a shadow of its former self. As we look eastward, we must decide how to approach the integration of their lands. Shall we use the pen or the sword?"
  brandenburg_missions_events.4.a: "Seek a diplomatic solution."
  brandenburg_missions_events.4.b: "Subjugate them through force."
  brandenburg_missions_events.4.a.tt: "We pursue a path of peace to set our dynasty on their throne and integrating them diplomatically"
  brandenburg_missions_events.4.b.tt: "Besiege their forts, and subjugate the Duke!"

  brandenburg_missions_events.5.t: "The Hohenzollern Legacy"
  brandenburg_missions_events.5.d: "The House of Hohenzollern has firmly established its roots in Brandenburg. Our rule is unquestioned, and the future of the dynasty looks bright."
  brandenburg_missions_events.5.a: "Long live the House of Hohenzollern!"
  brandenburg_missions_events.5.a.tt: "Long live the House of Hohenzollern!"

  brandenburg_missions_events.6.t: "Access to the Baltic"
  brandenburg_missions_events.6.d: "We have finally secured a port on the Baltic Sea. This opening to the world brings new opportunities for trade and naval power. How shall we utilize this new gateway?"
  brandenburg_missions_events.6.a: "Build a great naval base."
  brandenburg_missions_events.6.b: "Develop the port for trade."
  brandenburg_missions_events.6.a.tt: "Focus on shipbuilding and military prowess"
  brandenburg_missions_events.6.b.tt: "We should accomodate the port for trading and profits"

  brandenburg_missions_events.7.t: "The Mark Secured"
  brandenburg_missions_events.7.d: "Our control over the Mark has increased. The roads are safe again."
  brandenburg_missions_events.7.a: "Make sure to collect the taxes"
  brandenburg_missions_events.7.b: "Now the merchants can trade freely"
  brandenburg_missions_events.7.a.tt: "Increase the control even further"
  brandenburg_missions_events.7.b.tt: "The laws benefit the people after all!"

  brandenburg_missions_events.8.t: "The Oder Mastered"
  brandenburg_missions_events.8.d: "The Oder river flows with our trade and carries our banners. We are the masters of the waterways."
  brandenburg_missions_events.8.a: "Create a harbor for trade and prosperity"
  brandenburg_missions_events.8.b: "Secure our Flank"
  brandenburg_missions_events.8.a.tt: "Make sure the Merchants can cross the river uninhibited"
  brandenburg_missions_events.8.b.tt: "Protect our cities and their inhabitants"

  brandenburg_missions_events.9.t: "Silesian Mines"
  brandenburg_missions_events.9.d: "Exploit the riches of the Silesian mountains"
  brandenburg_missions_events.9.a: "Start digging!"
  brandenburg_missions_events.9.a.tt: "Mine for valuable minerals"

