l_english:

  # ==================== MISSION PACK ====================
  brandenburg_missions: "Brandenburg Missions"
  brandenburg_missions_desc: "Brandenburg was created as the northern March of the Holy Roman Empire, but recently lost more and more of its former importance. Unite the Brandenburgian lands, expand eastward, and forge the mighty Kingdom of Prussia."
  brandenburg_missions_BUTTON_DETAILS: "Strengthen the crown of Brandenburg, expand your territories, and establish the Kingdom of Prussia to unlock powerful modifiers and traditions."
  brandenburg_missions_CRITERIA_DESCRIPTION: "Complete missions to strengthen Brandenburg, form the Kingdom of Prussia and establish dominance in Germany."

