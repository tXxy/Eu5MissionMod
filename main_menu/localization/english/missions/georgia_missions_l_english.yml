#=== MISSION PACK HEADER ===
georgian_missions: "Georgia: The Caucasus Crusaders"
georgian_missions_desc: "Guide Georgia from a fractured kingdom to a united Caucasus power through unification, military defense, religious revival, and cultural preservation."
georgian_missions_BUTTON_TOOLTIP: "Complete missions to unite Georgia, defend against invaders, restore the Orthodox faith, and establish dominance in the Caucasus."
georgian_missions_CRITERIA_DESCRIPTION: "Unite Georgia, build strong defenses, restore Orthodox authority, and expand into the Caucasus to unlock powerful defensive and cultural modifiers."

#==================== PHASE 1: UNIFICATION ====================
mission_geo_unite_georgia: "Unite Georgia"
mission_geo_unite_georgia_desc: "Georgia has long been divided between rival princely houses. By asserting royal authority and bringing all Georgian lands under a single crown, we can present a united front against our many enemies."
mission_geo_unite_georgia_tooltip: "Control 85% of the Georgian area, maintain high stability and legitimacy, and strengthen the Crown Estate."

mission_geo_develop_tbilisi: "Develop Tbilisi"
mission_geo_develop_tbilisi_desc: "Tbilisi, our ancient capital, must be restored to its former glory as the cultural and commercial heart of Georgia. A thriving capital projects power and attracts talent from across the Caucasus."
mission_geo_develop_tbilisi_tooltip: "Develop Tbilisi to 25 development with a marketplace, make it a market center, and achieve high trade income."

mission_geo_strengthen_crown: "Strengthen the Crown"
mission_geo_strengthen_crown_desc: "Georgian nobles have long enjoyed excessive independence. By strengthening the Crown Estate and limiting noble power, we ensure that the King's authority extends to every corner of the realm."
mission_geo_strengthen_crown_tooltip: "Increase Crown Estate power while limiting nobles, with high legitimacy and stability."

mission_geo_settle_at_caspian_sea: "Settle at the Caspian Sea"
mission_geo_settle_at_caspian_sea_desc: "The Caspian Sea offers Georgia access to new trade routes and strategic positions. Establishing a presence at Baku gives us a foothold on this great inland sea."
mission_geo_settle_at_caspian_sea_tooltip: "Secure Baku and build a small fleet to patrol the Caspian."

mission_geo_caspian_sea_dominance: "Caspian Sea Dominance"
mission_geo_caspian_sea_dominance_desc: "With a foothold established, we must now assert our dominance over the Caspian Sea. Controlling its shores and waters secures our eastern flank and opens new opportunities for trade."
mission_geo_caspian_sea_dominance_tooltip: "Control multiple coastal locations around the Caspian and build a substantial fleet."

mission_geo_promote_georgian_culture: "Promote Georgian Culture"
mission_geo_promote_georgian_culture_desc: "Georgian culture is ancient and proud, but it has suffered under foreign domination. By promoting our language, traditions, and arts, we forge a strong national identity that unites all Georgians."
mission_geo_promote_georgian_culture_tooltip: "Achieve high Georgian cultural tradition and cultural majority in your country."

mission_geo_restore_georgian_church: "Restore the Georgian Church"
mission_geo_restore_georgian_church_desc: "The Georgian Orthodox Church is the spiritual foundation of our nation. Restoring monasteries and strengthening the clergy's authority renews our commitment to the Orthodox faith."
mission_geo_restore_georgian_church_tooltip: "Build multiple orthodox monasteries and strengthen the clergy estate."

#==================== PHASE 2: MILITARY DEVELOPMENT ====================
mission_geo_invest_into_the_army: "Invest into the Army"
mission_geo_invest_into_the_army_desc: "Georgia's survival depends on a strong army. By investing in military training, equipment, and recruitment, we prepare to defend our homeland and expand our borders."
mission_geo_invest_into_the_army_tooltip: "Maintain an army at 80% of force limit and secure noble support for military reforms."

mission_geo_defend_the_mountains: "Defend the Mountains"
mission_geo_defend_the_mountains_desc: "The Caucasus Mountains are our greatest natural defense. By building castles and fortifying mountain passes, we create an impenetrable barrier against any invader."
mission_geo_defend_the_mountains_tooltip: "Build multiple castles in mountainous locations and develop their defenses."

mission_geo_train_highlanders: "Train the Highlanders"
mission_geo_train_highlanders_desc: "The mountain people of the Caucasus are fierce warriors. Training these highlanders into disciplined troops gives us elite soldiers who excel in their native terrain."
mission_geo_train_highlanders_tooltip: "Achieve high army tradition and gain elite highlander units."

#==================== PHASE 3: EXPANSION AND RECONQUEST ====================
mission_geo_secure_matrega: "Secure Matrega"
mission_geo_secure_matrega_desc: "Matrega, the ancient capital of Zichia, was once part of the Georgian sphere of influence. Securing this region extends our reach along the Black Sea coast."
mission_geo_secure_matrega_tooltip: "Control a quarter of the Matrega area to secure Georgian influence."

mission_geo_secure_svaneti: "Secure Svaneti"
mission_geo_secure_svaneti_desc: "The Svaneti region, home to the legendary Svans, is a mountainous stronghold that must be brought under Georgian control. Its warriors will strengthen our armies."
mission_geo_secure_svaneti_tooltip: "Secure the location of Arkhyz in Svaneti."

mission_geo_recover_armenia: "Recover Armenia"
mission_geo_recover_armenia_desc: "Armenia, our ancient Christian brother, has suffered under foreign rule. Recovering Armenian lands and liberating Yerevan fulfills our sacred duty to protect our fellow Orthodox Christians."
mission_geo_recover_armenia_tooltip: "Control 60% of Armenia and secure the city of Yerevan."

mission_geo_costa_port_city: "Develop the Port City of Costa"
mission_geo_costa_port_city_desc: "Costa, our gateway to the Black Sea, must be developed into a thriving port. A strong harbor enables trade, naval construction, and projection of power."
mission_geo_costa_port_city_tooltip: "Develop Costa with a wharf to establish a Black Sea port."

mission_geo_black_sea_access: "Black Sea Access"
mission_geo_black_sea_access_desc: "Access to the Black Sea is essential for Georgian prosperity and power. By controlling coastal territories and building a fleet, we open ourselves to trade and naval influence."
mission_geo_black_sea_access_tooltip: "Control multiple coastal locations on the Black Sea and build a substantial fleet."

mission_geo_build_black_sea_fleet: "Build a Black Sea Fleet"
mission_geo_build_black_sea_fleet_desc: "With access to the Black Sea secured, we must now build a fleet capable of defending our interests and projecting power. The Black Sea will become a Georgian lake."
mission_geo_build_black_sea_fleet_tooltip: "Build a large fleet with dry docks and wharves in coastal locations."

#==================== PHASE 4: RELIGIOUS AND CULTURAL REVIVAL ====================
mission_geo_defend_orthodox_faith: "Defend the Orthodox Faith"
mission_geo_defend_orthodox_faith_desc: "Georgia stands as a bastion of Orthodoxy in the Caucasus. By defending our faith against heresy and uniting Orthodox believers, we fulfill our sacred duty."
mission_geo_defend_orthodox_faith_tooltip: "Maintain religious unity and defend Orthodox interests."

mission_geo_restore_monasteries: "Restore the Monasteries"
mission_geo_restore_monasteries_desc: "Georgian monasteries have long been centers of learning and spirituality. Restoring and expanding them renews our cultural and religious traditions."
mission_geo_restore_monasteries_tooltip: "Build multiple monasteries and libraries to revive Georgian religious culture."

mission_geo_preserve_georgian_language: "Preserve the Georgian Language"
mission_geo_preserve_georgian_language_desc: "The Georgian language is a unique treasure of our culture. Preserving and promoting it ensures that our traditions and identity endure for generations."
mission_geo_preserve_georgian_language_tooltip: "Achieve high cultural tradition and influence, with extensive libraries and printing infrastructure."

#==================== PHASE 5: ECONOMIC DEVELOPMENT ====================
mission_geo_develop_agriculture: "Develop Agriculture"
mission_geo_develop_agriculture_desc: "Georgia's fertile soil produces excellent wheat and wine. Investing in agriculture ensures food security and creates a surplus for trade."
mission_geo_develop_agriculture_tooltip: "Produce significant quantities of wheat and wine to support the economy."

mission_geo_secure_food: "Secure Food Supply"
mission_geo_secure_food_desc: "A nation's strength depends on feeding its people. Securing abundant food supplies ensures stability and prosperity."
mission_geo_secure_food_tooltip: "Achieve positive monthly food balance in your markets."

mission_geo_expand_viticulture: "Expand Viticulture"
mission_geo_expand_viticulture_desc: "Georgian wine is renowned for its quality. Expanding our vineyards increases production for export and domestic enjoyment."
mission_geo_expand_viticulture_tooltip: "Control multiple wine-producing locations and achieve high wine production."

mission_geo_establish_trade_network: "Establish Trade Network"
mission_geo_establish_trade_network_desc: "Georgia sits at the crossroads of trade routes between East and West. Establishing a trade network brings wealth, goods, and influence."
mission_geo_establish_trade_network_tooltip: "Achieve high trade income with multiple trades and merchant capacity."

mission_geo_develop_silk_road: "Develop the Silk Road"
mission_geo_develop_silk_road_desc: "The Silk Road passes through Georgia's territory. By developing infrastructure and facilities, we attract merchants and enrich our nation."
mission_geo_develop_silk_road_tooltip: "Establish silk imports and develop market infrastructure to dominate regional trade."

#==================== PHASE 6: CAPSTONE MISSIONS ====================
mission_geo_georgian_golden_age: "Georgian Golden Age"
mission_geo_georgian_golden_age_desc: "Georgia has risen from the ashes of division. United, prosperous, and faithful, we enter a golden age of cultural, economic, and military achievement."
mission_geo_georgian_golden_age_tooltip: "Achieve great power status with stability, trade income, and no active disasters."

mission_geo_caucasus_hegemony: "Caucasus Hegemony"
mission_geo_caucasus_hegemony_desc: "Georgia has become the undisputed hegemon of the Caucasus. Our power, culture, and faith dominate the region, securing our position for generations."
mission_geo_caucasus_hegemony_tooltip: "Achieve great power status and control 75% of the Caucasus region."

#==================== HIDDEN/SUPPORT MISSIONS ====================
mission_geo_defend_against_mongols: "Defend Against the Mongols"
mission_geo_defend_against_mongols_desc: "The Mongols threaten our eastern borders. We must prepare our defenses and mobilize our forces to resist their invasion."
mission_geo_defend_against_mongols_tooltip: "Prepare defenses and mobilize forces to repel the Mongol threat."

mission_geo_unite_caucasian_peoples: "Unite the Caucasian Peoples"
mission_geo_unite_caucasian_peoples_desc: "Georgia has united the peoples of the Caucasus under a single authority. All the nations of the mountains look to us for leadership."
mission_geo_unite_caucasian_peoples_tooltip: "Control 85% of the Caucasus region with multiple subjects and high prestige."

