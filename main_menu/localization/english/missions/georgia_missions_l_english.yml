#==================== EVENT TITLES AND DESCRIPTIONS ====================
#Event 1: Unite Georgia
georgian_mission_events.1.t: "Georgia United"
georgian_mission_events.1.d: "After centuries of division, Georgia is finally united under a single crown. King David IV, the great unifier, has brought the rival princely houses to heel and established his authority over all Georgian lands. The people celebrate in the streets, and the nobles pledge their loyalty to the new order. Our ancient kingdom has been reborn, and a new era of Georgian glory dawns."

#Event 2: Develop Tbilisi
georgian_mission_events.2.t: "Tbilisi Flourishes"
georgian_mission_events.2.d: "Tbilisi, our ancient capital, has been transformed into a thriving center of culture and commerce. Markets bustle with merchants from across the Caucasus, craftsmen produce fine goods, and the city's population swells with new arrivals seeking opportunity. The development of Tbilisi projects Georgian power and attracts talent from far and wide."

#Event 4: Promote Georgian Culture
georgian_mission_events.4.t: "Georgian Culture Revived"
georgian_mission_events.4.d: "Georgian culture, ancient and proud, has been revived through royal patronage and popular enthusiasm. Our language, traditions, and arts flourish as never before. The great poet Shota Rustaveli's works are celebrated, and the Georgian script is studied by scholars throughout the Caucasus. Our cultural renaissance strengthens our national identity and inspires our people."

#Event 6: Defend the Mountains
georgian_mission_events.6.t: "The Mountain Fortresses"
georgian_mission_events.6.d: "The Caucasus Mountains are now lined with Georgian fortresses. Watchtowers guard the passes, garrisons man the walls, and the mountain people are organized into defensive levies. Any invader will find the highlands a deadly obstacle, and the war cry of the Georgian highlander will echo through the gorges."

#Event 7: Secure Matrega
georgian_mission_events.7.t: "Matrega Secured"
georgian_mission_events.7.d: "The ancient capital of Zichia, Matrega, has come under Georgian control. Its strategic position on the Black Sea coast opens new opportunities for trade and expansion, and its people now look to Tbilisi for leadership. Georgian influence extends further along the shores of the Black Sea."

#Event 8: Recover Armenia
georgian_mission_events.8.t: "Armenia Recovered"
georgian_mission_events.8.d: "Armenia, our ancient Christian brother, has been liberated from foreign rule. The cathedral bells of Echmiadzin ring for the first time in years, and the Armenian people welcome Georgian troops as liberators. Together, we shall defend our Orthodox faith against all enemies."

#Event 9: Black Sea Access
georgian_mission_events.9.t: "The Black Sea Opens"
georgian_mission_events.9.d: "Georgia now has secure access to the Black Sea. Our ships sail from Georgian ports, carrying goods and projecting our influence along the coast. Merchants from Constantinople and Trebizond come to trade, and our fleets protect our shores. The Black Sea has become our window to the wider world."

#Event 12: Develop Agriculture
georgian_mission_events.12.t: "Agricultural Prosperity"
georgian_mission_events.12.d: "Georgia's fields are bountiful, producing abundant wheat and wine. Our farmers enjoy peace and prosperity, our granaries are full, and our wine cellars overflow. The surplus from our fields feeds our cities and fuels our trade, making Georgia a land of plenty."

#Event 13: Establish Trade Network
georgian_mission_events.13.t: "A Trade Network Established"
georgian_mission_events.13.d: "Georgia has established itself as a key link in the trade networks that connect East and West. Merchants from Persia, the Levant, and Europe converge on our markets, exchanging goods and ideas. Our position at the crossroads of continents brings wealth and influence to our kingdom."

