STATIC_MODIFIER_DESC_fra_french_economic_boom: "Rapid economic growth boosts production and tax revenues."

STATIC_MODIFIER_NAME_fra_french_wine_trade: "French Wine Trade"
STATIC_MODIFIER_DESC_fra_french_wine_trade: "French wines dominate European markets, enriching the kingdom."

STATIC_MODIFIER_NAME_fra_lyon_silk_industry: "Lyon Silk Industry"
STATIC_MODIFIER_DESC_fra_lyon_silk_industry: "Lyon's silk workshops produce luxury goods sought throughout Europe."

