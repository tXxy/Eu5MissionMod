STATIC_MODIFIER_DESC_ven_lepanto_veterans: "The heroic veterans of Lepanto preserve naval traditions and inspire future generations."

STATIC_MODIFIER_NAME_ven_lepanto_commanders: "Lepanto Commanders"
STATIC_MODIFIER_DESC_ven_lepanto_commanders: "Commanders who fought at Lepanto bring unmatched skill to our navy."

STATIC_MODIFIER_NAME_ven_holy_league_heroes: "Holy League Heroes"
STATIC_MODIFIER_DESC_ven_holy_league_heroes: "Heroes of the Holy League enhance our prestige and diplomatic standing."

STATIC_MODIFIER_NAME_venetian_merchant_fleet: "Venetian Merchant Fleet"
STATIC_MODIFIER_DESC_venetian_merchant_fleet: "Our powerful merchant marine carries Venetian goods to every Mediterranean port."

