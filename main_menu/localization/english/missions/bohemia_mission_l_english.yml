  boh_unlock_mining_law_tt: "Unlocks the [ShowAdvanceName('boh_ius_regale_montanorum')] advance, which allows the #Y Royal Mining Town#! town rights."
  boh_unlock_carolinum_tt: "Unlocks the [ShowAdvanceName('boh_studium_generale')] advance."
  boh_unlock_letter_of_majesty_tt: "Unlocks the [ShowAdvanceName('boh_letter_of_majesty')] advance."
  boh_unlock_six_towns_tt: "Unlocks the #Y League of Six Towns#! town rights."
  boh_ius_regale_montanorum: "Ius Regale Montanorum"
  boh_ius_regale_montanorum_desc: "The mining code of King Wenceslas II regulates the silver mines of Bohemia so well that mining towns across Europe copy it. It allows our mining towns to receive royal mining charters."
  boh_studium_generale: "Studium Generale of Prague"
  boh_studium_generale_desc: "Charles University, the first university north of the Alps, trains the clerics, lawyers and physicians of the kingdom."
  boh_letter_of_majesty: "Letter of Majesty"
  boh_letter_of_majesty_desc: "The crown guarantees freedom of worship to the estates of Bohemia, binding Catholics and Protestants alike to the throne."
  boh_royal_mining_town: "Royal Mining Town"
  boh_royal_mining_town_desc: "This [location|e] is a royal mining town under the Bohemian mining code. Its miners elect their own officials and owe their silver to the crown."
  boh_six_towns_league_rights: "League of Six Towns"
  boh_six_towns_league_rights_desc: "Like Bautzen, Görlitz and Zittau, this [location|e] belongs to a league of free towns that answers only to the Bohemian king."
  boh_karlstejn_castle: "Karlštejn Castle"
  boh_karlstejn_castle_desc: "Built by Charles IV to guard the crown jewels and holy relics of the kingdom, $boh_karlstejn_castle$ is the treasure house of the Bohemian crown."
  boh_karlstejn_castle_why: "$boh_karlstejn_castle$ can only be built by completing a mission."
  boh_charles_bridge: "Charles Bridge"
  boh_charles_bridge_desc: "A great stone bridge over the Vltava links the Old Town and the Lesser Town of Prague, carrying merchants, pilgrims and armies."
  boh_charles_bridge_why: "$boh_charles_bridge$ can only be built by completing a mission."
  boh_italian_court_mint: "The Italian Court"
  boh_italian_court_mint_desc: "Named after the Florentine minters who first worked here, the Italian Court in Kutná Hora strikes the Prague groschen for the whole kingdom."
  boh_italian_court_mint_why: "$boh_italian_court_mint$ can only be built by completing a mission."
  boh_land_tables: "The Land Tables"
  boh_land_tables_desc: "The Zemské desky, kept by the Diet, record every noble estate in the kingdom. The lords gain secure title to their land, and the crown gains a clear view of who owns what."
  bohemia_mission_events.1.t: "The Decree of Kutná Hora"
  bohemia_mission_events.1.d: "The masters of Charles University are divided into four nations, and the three foreign nations always outvote the Czechs. Czech masters led by Jan Hus demand that the king change the votes in their favour. If we agree, many German students and masters will leave Prague."
  bohemia_mission_events.1.a: "Give the Czech nation three votes."
  bohemia_mission_events.1.b: "Keep the university open to all of Christendom."
  bohemia_mission_events.2.t: "The Silver of Kutná Hora"
  bohemia_mission_events.2.d: "The royal mines of Kutná Hora are among the richest in Europe. The royal treasurers want to squeeze every mark of silver from them, while the miners' guilds ask for their old privileges to be confirmed."
  bohemia_mission_events.2.a: "The silver belongs to the crown."
  bohemia_mission_events.2.b: "Confirm the privileges of the free miners."
  bohemia_mission_events.3.t: "The Crown of Saint Wenceslas"
  bohemia_mission_events.3.d: "The holy crown of Saint Wenceslas has been brought from Karlštejn to the cathedral of Saint Vitus. How shall the coronation be celebrated?"
  bohemia_mission_events.3.a: "A coronation the Empire will never forget!"
  bohemia_mission_events.3.b: "A solemn, pious ceremony."
  bohemia_mission_events.4.t: "The Compacts of Basel"
  bohemia_mission_events.4.d: "After long negotiations, the Council of Basel offers a compromise: the Bohemian church may give communion in both kinds. The radicals call it a betrayal, the Catholic lords call it heresy, but most of the kingdom longs for peace."
  bohemia_mission_events.4.a: "Accept the Compacts and make peace."
  bohemia_mission_events.4.b: "No compromise in matters of faith."
