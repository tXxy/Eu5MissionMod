  mission_boh_fortress_of_europe_tooltip: "Make Bohemia an unbreakable fortress."

  mission_boh_great_king: "The Great King"
  mission_boh_great_king_desc: "A king who has united the lands, the army and the estates deserves to be remembered as great."
  mission_boh_great_king_tooltip: "Win lasting renown for the king."

