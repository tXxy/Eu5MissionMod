l_english:
  
  castile_missions: "Iberian Dominance"
  castile_missions_DESCRIPTION: "The path of Castile is not merely to rule over the arid plains of the Meseta, but to forge a unified Spanish identity that shall eventually bestride the world like a Colossus. From the final victory of the Reconquista to the peak of the Golden Age, our destiny is to export the faith, culture, and steel of Iberia to the furthest reaches of the unknown. Whether as the Crown of Castile or a unified Spain, we must secure our European heartland while harvesting the boundless riches of the New World to claim our rightful status as the first true Global Hegemon."
  castile_missions_BUTTON_DETAILS: "Click to view the grand objectives for the unification of Iberia and the establishment of the Spanish Empire."
  castile_missions_BUTTON_TOOLTIP: "\n\n"
  castile_missions_CRITERIA_DESCRIPTION: "Establish Spain as the dominating force across the globe by securing the Iberian Peninsula, dominating European politics, and controlling the vital trade routes of the Atlantic and Pacific Oceans."

  # ==================== MODIFIERS ====================

  STATIC_MODIFIER_NAME_cas_viceroyalty: "Spanish Viceroyalty"
  STATIC_MODIFIER_DESC_cas_viceroyalty: "This country is an elevated colony"

  STATIC_MODIFIER_NAME_cas_we_have_presence_in_guinea: "Presence in Guinea"
  STATIC_MODIFIER_DESC_cas_we_have_presence_in_guinea: "Every Slave Center in Guinea will be more efficient here"

  STATIC_MODIFIER_NAME_cas_iberian_dominance: "Iberian Dominance"
  STATIC_MODIFIER_DESC_cas_iberian_dominance: "Castile has emerged as the foremost military power of Iberia, asserting its dominance through disciplined armies and hard-won battlefield experience."

  STATIC_MODIFIER_NAME_cas_stabilized_the_bloodline: "Stabilized the Bloodline"
  STATIC_MODIFIER_DESC_cas_stabilized_the_bloodline: "We have removed the stains in our bloodline and have now a strong and clear dynastic lineage"

  STATIC_MODIFIER_NAME_cas_royal_authority: "Royal Authority Asserted"
  STATIC_MODIFIER_DESC_cas_royal_authority: "The Crown has strengthened its authority over the realm, reducing internal instability and reinforcing centralized governance."

  STATIC_MODIFIER_NAME_cas_internal_stbility: "Internal Stability"
  STATIC_MODIFIER_DESC_cas_internal_stbility: "Through reforms and firm rule, Castile has curbed internal dissent and limited the excesses of entrenched privileges."

  STATIC_MODIFIER_NAME_cas_order_of_the_band: "Order of the Band"
  STATIC_MODIFIER_DESC_cas_order_of_the_band: "This chivalric order rewards valor in battle, encouraging noble officers to seek glory and honor on the battlefield."

  STATIC_MODIFIER_NAME_cas_santa_hermandad: "Santa Hermandad"
  STATIC_MODIFIER_DESC_cas_santa_hermandad: "A royal police force established to suppress banditry and rebellion, bringing law and order to the Castilian countryside."

  STATIC_MODIFIER_NAME_cas_elaborate_court: "Elaborate Court"
  STATIC_MODIFIER_DESC_cas_elaborate_court: "The splendor of our court ensures the awe of foreign dignitaries and the satisfaction of the nobility."

  STATIC_MODIFIER_NAME_cas_spanish_culture: "Spanish Culture"
  STATIC_MODIFIER_DESC_cas_spanish_culture: "Foster our culture to bring international recognation to our court"

  STATIC_MODIFIER_NAME_cas_university_of_salamanca: "University of Salamanca"
  STATIC_MODIFIER_DESC_cas_university_of_salamanca: "The University of Salamaca is a beacon of knowledge which will help our country grow"

  STATIC_MODIFIER_NAME_cas_spanish_baroque: "Spanish Baroque"
  STATIC_MODIFIER_DESC_cas_spanish_baroque: "The Spanish Baroque, or Churrigueresque, represents the height of artistic and architectural exuberance"

  STATIC_MODIFIER_NAME_cas_clergy_reigned_in: "Clergy Reigned In"
  STATIC_MODIFIER_DESC_cas_clergy_reigned_in: "The power of the clergy has been brought under tighter royal supervision, aligning ecclesiastical interests with those of the Crown."

  STATIC_MODIFIER_NAME_cas_incoporated_military_orders: "Military Orders Incorporated"
  STATIC_MODIFIER_DESC_cas_incoporated_military_orders: "The great military orders of Iberia have been absorbed into royal authority, granting the Crown access to their manpower and resources."

  STATIC_MODIFIER_NAME_cas_patronato_real: "Patronato Real"
  STATIC_MODIFIER_DESC_cas_patronato_real: "Royal control over ecclesiastical appointments ensures loyalty from the Church and integrates it firmly into state administration."

  STATIC_MODIFIER_NAME_cas_corregidores: "Corregidores"
  STATIC_MODIFIER_DESC_cas_corregidores: "Royal officials are appointed to oversee municipalities, enforcing the law and curbing local autonomy in favor of centralized rule."

  STATIC_MODIFIER_NAME_cas_juros_managed: "Juros Managed"
  STATIC_MODIFIER_DESC_cas_juros_managed: "State debt instruments are carefully regulated, stabilizing royal finances and limiting the inflationary impact of borrowing."

  STATIC_MODIFIER_NAME_cas_catastro_of_ensenada: "Catastro of Ensenada"
