# ==================== OTTOMAN MISSION PACK HEADER ====================
ottoman_missions:0 "Ottoman Empire: Rise of the Sultans"
ottoman_missions_desc:0 "Unite the Anatolian heartland, conquer the Balkans, and forge the mightiest empire the world has ever seen under the banner of the Ottoman Sultanate."
ottoman_missions_BUTTON_TOOLTIP:0 "Complete missions to strengthen the Ottoman Empire and establish dominance across three continents."
ottoman_missions_CRITERIA_DESCRIPTION:0 "Consolidate Anatolia, expand into Europe and Asia, and implement sweeping reforms to unlock the full potential of the Ottoman Empire."

# ==================== PHASE 1: FOUNDATIONS MISSIONS ====================
mission_tur_consolidate_anatolia:0 "Consolidate Anatolia"
mission_tur_consolidate_anatolia_desc:0 "Unite the Turkish beyliks under Ottoman rule to establish a strong foundation for our expanding empire."

mission_tur_develop_bursa:0 "Develop Bursa"
mission_tur_develop_bursa_desc:0 "Transform our first capital into a thriving center of trade and culture befitting the Ottoman Sultanate."

mission_tur_establish_timariot_system:0 "Establish the Timariot System"
mission_tur_establish_timariot_system_desc:0 "Organize our feudal military structure with the timar system, rewarding loyal warriors with land grants in exchange for military service."

mission_tur_promote_turkish_culture:0 "Promote Turkish Culture"
mission_tur_promote_turkish_culture_desc:0 "Foster the development of Turkish language, arts, and traditions across our growing realm."

# ==================== PHASE 2: BALKAN EXPANSION MISSIONS ====================
mission_tur_invest_into_the_army:0 "Invest into the Army"
mission_tur_invest_into_the_army_desc:0 "Modernize and expand our military forces to support our ambitions of conquest and glory."

mission_tur_conquer_thrace:0 "Conquer Thrace"
mission_tur_conquer_thrace_desc:0 "Seize the strategic region of Thrace and its jewel, Constantinople, the gateway between East and West."

mission_tur_establish_constantinople:0 "Establish Constantinople"
mission_tur_establish_constantinople_desc:0 "Make the great city of Constantinople the new imperial capital, center of Ottoman power and prestige."

mission_tur_conquer_bulgaria:0 "Conquer Bulgaria"
mission_tur_conquer_bulgaria_desc:0 "Bring the Bulgarian lands under Ottoman control to secure our European frontiers."

mission_tur_conquer_serbia:0 "Conquer Serbia"
mission_tur_conquer_serbia_desc:0 "Subjugate Serbia and incorporate its fierce warriors into our growing empire."

mission_tur_secure_greece:0 "Secure Greece"
mission_tur_secure_greece_desc:0 "Establish Ottoman dominance over the Greek peninsula and the Aegean Sea."

mission_tur_conquer_wallachia:0 "Conquer Wallachia"
mission_tur_conquer_wallachia_desc:0 "Bring the Wallachian principalities under Ottoman suzerainty."

mission_tur_conquer_moldavia:0 "Conquer Moldavia"
mission_tur_conquer_moldavia_desc:0 "Extend Ottoman influence over Moldavia, securing our northern borders."

# ==================== PHASE 3: ANATOLIAN CONSOLIDATION MISSIONS ====================
mission_tur_secure_eastern_anatolia:0 "Secure Eastern Anatolia"
mission_tur_secure_eastern_anatolia_desc:0 "Fortify and integrate the eastern Anatolian territories to protect our heartland."

mission_tur_conquer_the_levant:0 "Conquer the Levant"
mission_tur_conquer_the_levant_desc:0 "Bring the rich lands of the Levant under Ottoman rule, including the holy city of Jerusalem."

mission_tur_guard_the_holy_cities:0 "Guard the Holy Cities"
mission_tur_guard_the_holy_cities_desc:0 "Establish Ottoman protection over Mecca and Medina, becoming the custodian of Islam's most sacred sites."

mission_tur_caliphate_ambitions:0 "Caliphate Ambitions"
mission_tur_caliphate_ambitions_desc:0 "Claim the title of Caliph, becoming the spiritual leader of the Islamic world."

# ==================== PHASE 4: MAMLUK AND EGYPT MISSIONS ====================
mission_tur_secure_syria:0 "Secure Syria"
mission_tur_secure_syria_desc:0 "Fully integrate Syria into the Ottoman realm, securing vital trade routes and strategic positions."

mission_tur_conquer_egypt:0 "Conquer Egypt"
mission_tur_conquer_egypt_desc:0 "Topple the Mamluk Sultanate and claim the riches of Egypt for the Ottoman Empire."

mission_tur_develop_cairo:0 "Develop Cairo"
mission_tur_develop_cairo_desc:0 "Transform Cairo into a flourishing administrative and commercial center of the empire."

# ==================== PHASE 5: RED SEA AND ARABIA MISSIONS ====================
mission_tur_red_sea_presence:0 "Establish Red Sea Presence"
mission_tur_red_sea_presence_desc:0 "Secure Ottoman naval presence in the Red Sea to protect trade routes and holy sites."

mission_tur_control_arabian_trade:0 "Control Arabian Trade"
mission_tur_control_arabian_trade_desc:0 "Dominate the lucrative trade routes of the Arabian Peninsula."

# ==================== PHASE 6: CRIMEA AND CAUCASUS MISSIONS ====================
mission_tur_secure_crimea:0 "Secure Crimea"
mission_tur_secure_crimea_desc:0 "Establish Ottoman suzerainty over Crimea and its strategic ports."

mission_tur_conquer_caucasus:0 "Conquer the Caucasus"
mission_tur_conquer_caucasus_desc:0 "Extend Ottoman control over the mountainous Caucasus region."

# ==================== PHASE 7: MILITARY REFORMS MISSIONS ====================
mission_tur_reform_the_janissaries:0 "Reform the Janissaries"
mission_tur_reform_the_janissaries_desc:0 "Modernize the Janissary corps with new training, discipline, and equipment."

mission_tur_modernize_the_artillery:0 "Modernize the Artillery"
mission_tur_modernize_the_artillery_desc:0 "Develop a modern artillery corps to shatter enemy fortresses and dominate the battlefield."

mission_tur_establish_naval_supremacy:0 "Establish Naval Supremacy"
mission_tur_establish_naval_supremacy_desc:0 "Build a powerful fleet to protect our coasts and project Ottoman power across the seas."

mission_tur_create_sipahi_corps:0 "Create the Sipahi Corps"
mission_tur_create_sipahi_corps_desc:0 "Establish the elite Sipahi cavalry, drawn from the timar-holding nobility."

mission_tur_ottoman_military_tradition:0 "Ottoman Military Tradition"
mission_tur_ottoman_military_tradition_desc:0 "Foster a culture of military excellence that makes Ottoman armies the most feared in the world."

# ==================== PHASE 8: ECONOMIC DEVELOPMENT MISSIONS ====================
mission_tur_develop_agriculture:0 "Develop Agriculture"
mission_tur_develop_agriculture_desc:0 "Maximize agricultural production across the empire to feed our growing population and armies."

mission_tur_establish_trade_networks:0 "Establish Trade Networks"
mission_tur_establish_trade_networks_desc:0 "Build a vast commercial network spanning three continents to enrich the empire."

mission_tur_develop_istanbul:0 "Develop Istanbul"
mission_tur_develop_istanbul_desc:0 "Transform Istanbul into the greatest city in the world, a center of culture, commerce, and imperial power."

mission_tur_develop_manufactories:0 "Develop Manufactories"
mission_tur_develop_manufactories_desc:0 "Establish industrial production centers to supply our growing empire with domestic goods."

mission_tur_control_spice_trade:0 "Control the Spice Trade"
mission_tur_control_spice_trade_desc:0 "Dominate the spice trade routes to bring immense wealth to the Ottoman treasury."

mission_tur_develop_anatolian_trade:0 "Develop Anatolian Trade"
mission_tur_develop_anatolian_trade_desc:0 "Expand the trade networks of Anatolia to connect east and west."

# ==================== PHASE 9: CULTURAL AND RELIGIOUS DEVELOPMENT MISSIONS ====================
mission_tur_promote_ottoman_culture:0 "Promote Ottoman Culture"
mission_tur_promote_ottoman_culture_desc:0 "Foster a unique Ottoman cultural identity that blends Turkic, Islamic, and Byzantine traditions."

mission_tur_establish_universities:0 "Establish Universities"
mission_tur_establish_universities_desc:0 "Create centers of learning across the empire to train scholars, administrators, and scientists."

mission_tur_ottoman_baroque:0 "Ottoman Baroque"
mission_tur_ottoman_baroque_desc:0 "Develop a distinctive Ottoman artistic and architectural style combining traditional Islamic art with European influences."

mission_tur_religious_tolerance:0 "Promote Religious Tolerance"
mission_tur_religious_tolerance_desc:0 "Implement policies of religious tolerance to maintain stability in our diverse empire."

mission_tur_millet_system:0 "The Millet System"
mission_tur_millet_system_desc:0 "Establish the millet system, granting autonomy to religious communities within the empire."

mission_tur_establish_imperial_library:0 "Establish Imperial Library"
mission_tur_establish_imperial_library_desc:0 "Create a magnificent library to collect and preserve the knowledge of all civilizations."

mission_tur_promote_ottoman_architecture:0 "Promote Ottoman Architecture"
mission_tur_promote_ottoman_architecture_desc:0 "Build magnificent mosques, palaces, and public works that showcase Ottoman architectural genius."

# ==================== PHASE 10: ADMINISTRATIVE REFORMS MISSIONS ====================
mission_tur_reform_the_timariots:0 "Reform the Timariots"
mission_tur_reform_the_timariots_desc:0 "Restructure the timar system to improve efficiency and centralize control."

mission_tur_administrative_reform:0 "Administrative Reform"
mission_tur_administrative_reform_desc:0 "Implement sweeping reforms to create a more efficient and centralized imperial administration."

mission_tur_establish_legal_code:0 "Establish Legal Code"
mission_tur_establish_legal_code_desc:0 "Codify Ottoman law to create a unified legal system for our diverse empire."

# ==================== PHASE 11: EUROPEAN CHALLENGES MISSIONS ====================
mission_tur_challenge_habsburgs:0 "Challenge the Habsburgs"
mission_tur_challenge_habsburgs_desc:0 "Confront the Habsburg Empire directly, asserting Ottoman dominance over Central Europe."

mission_tur_conquer_hungary:0 "Conquer Hungary"
mission_tur_conquer_hungary_desc:0 "Seize the Kingdom of Hungary and incorporate it into the Ottoman realm."

mission_tur_rival_russia:0 "Rival Russia"
mission_tur_rival_russia_desc:0 "Challenge Russian expansion and establish Ottoman dominance over the Black Sea region."

mission_tur_black_sea_dominance:0 "Black Sea Dominance"
mission_tur_black_sea_dominance_desc:0 "Establish Ottoman control over the Black Sea, making it a Turkish lake."

# ==================== PHASE 12: ITALIAN AND NORTH AFRICAN MISSIONS ====================
mission_tur_italian_south:0 "Secure Southern Italy"
mission_tur_italian_south_desc:0 "Extend Ottoman power into the Italian peninsula by securing the Kingdom of Naples and Sicily."

mission_tur_italian_north:0 "Secure Northern Italy"
mission_tur_italian_north_desc:0 "Push deeper into Italy, claiming Rome and Milan to cement Ottoman dominance over the peninsula."

mission_tur_north_africa_expansion:0 "Expand into North Africa"
mission_tur_north_africa_expansion_desc:0 "Extend Ottoman control along the North African coast, securing vital Mediterranean ports."

mission_tur_morocco_expansion:0 "Secure Morocco"
mission_tur_morocco_expansion_desc:0 "Extend Ottoman influence to the far shores of North Africa, bringing Morocco into the fold."

# ==================== PHASE 13: PERSIAN AND GULF EXPANSION MISSIONS ====================
mission_tur_persian_gulf_expansion:0 "Expand into the Persian Gulf"
mission_tur_persian_gulf_expansion_desc:0 "Secure Ottoman naval presence in the Persian Gulf to protect trade routes to the East."

mission_tur_indian_ocean_ambitions:0 "Indian Ocean Ambitions"
mission_tur_indian_ocean_ambitions_desc:0 "Project Ottoman naval power into the Indian Ocean, securing trade routes to the Spice Islands and beyond."

# ==================== PHASE 14: CAPSTONE MISSIONS ====================
mission_tur_ottoman_golden_age:0 "Ottoman Golden Age"
mission_tur_ottoman_golden_age_desc:0 "Usher in a golden age of Ottoman power, prosperity, and cultural achievement."

mission_tur_persian_challenge:0 "The Persian Challenge"
mission_tur_persian_challenge_desc:0 "Confront the Safavid Empire and assert Ottoman dominance over the Middle East."

mission_tur_conquer_mesopotamia:0 "Conquer Mesopotamia"
mission_tur_conquer_mesopotamia_desc:0 "Bring the ancient lands of Mesopotamia under Ottoman rule."

mission_tur_mehmeds_dream:0 "Mehmed's Dream"
mission_tur_mehmeds_dream_desc:0 "Realize Sultan Mehmed the Conqueror's dream of uniting the Roman and Ottoman empires."

mission_tur_selim_the_grims_legacy:0 "Selim the Grim's Legacy"
mission_tur_selim_the_grims_legacy_desc:0 "Continue the conquests of Sultan Selim I, expanding Ottoman power across the Islamic world."

