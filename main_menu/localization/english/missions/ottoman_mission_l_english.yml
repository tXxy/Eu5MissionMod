# ==================== OTTOMAN EVENT LOCALIZATION ====================

# === EVENT 1: CONSOLIDATE ANATOLIA ===
ottoman_mission_events.1.t:0 "Consolidation of Anatolia"
ottoman_mission_events.1.d:0 "The Turkish beyliks have been united under Ottoman rule. Our ancestors' dream of a unified Anatolia is now a reality, with the Sultan's authority extending from the Aegean to the eastern mountains. The consolidation of these lands provides a strong foundation for the empire's future expansion, but we must now decide how to best integrate these diverse territories."
ottoman_mission_events.1.a:0 "Integrate them fully into our realm"
ottoman_mission_events.1.b:0 "Focus on economic development"

# === EVENT 2: ESTABLISH DEVSHIRME ===
ottoman_mission_events.2.t:0 "The Devshirme System"
ottoman_mission_events.2.d:0 "We have formally instituted the devshirme, the levy of Christian children who will be trained as soldiers and administrators. This system provides a steady stream of loyal, capable recruits for the Janissary corps and the imperial bureaucracy. However, its implementation has raised concerns among our Christian subjects and the clergy, who view it as an infringement on their communities."
ottoman_mission_events.2.a:0 "Implement the system fully"
ottoman_mission_events.2.b:0 "Proceed cautiously"

# === EVENT 3: CONQUER THRACE ===
ottoman_mission_events.3.t:0 "The Fall of Constantinople"
ottoman_mission_events.3.d:0 "The great city of Constantinople has fallen to our armies. The capital of the Eastern Roman Empire, which has stood for over a thousand years, is now the jewel of the Ottoman crown. This momentous victory establishes our empire as the heir to Rome's legacy and opens the gates to European expansion."
ottoman_mission_events.3.a:0 "Make it our new capital"
ottoman_mission_events.3.b:0 "Sack the city for its riches"

# === EVENT 4: ESTABLISH CONSTANTINOPLE ===
ottoman_mission_events.4.t:0 "The Imperial Capital"
ottoman_mission_events.4.d:0 "Constantinople has been transformed into a worthy capital for our empire. The great cathedral of Hagia Sophia has been converted into a magnificent mosque, new palaces rise along the Golden Horn, and the city's walls have been strengthened. Our new capital will be the center of a world-spanning empire."
ottoman_mission_events.4.a:0 "Build a city of imperial grandeur"
ottoman_mission_events.4.b:0 "Focus on administration"

# === EVENT 5: CONQUER THE LEVANT ===
ottoman_mission_events.5.t:0 "The Levant Conquered"
ottoman_mission_events.5.d:0 "The holy lands of the Levant are now under Ottoman control. Jerusalem, Damascus, and Aleppo have submitted to our rule, bringing the birthplace of three great faiths under the Sultan's protection. The conquest of these lands brings immense religious prestige and opens new opportunities for trade."
ottoman_mission_events.5.a:0 "Protect the holy sites"
ottoman_mission_events.5.b:0 "Fortify our new territories"

# === EVENT 6: GUARD THE HOLY CITIES ===
ottoman_mission_events.6.t:0 "Custodian of the Holy Cities"
ottoman_mission_events.6.d:0 "The cities of Mecca and Medina are now under our protection. As the new Custodian of the Two Holy Mosques, we hold the spiritual center of the Islamic world. This sacred trust brings immense religious prestige and responsibility, as the Islamic community looks to us for leadership and protection."
ottoman_mission_events.6.a:0 "Fulfill our duty to protect the pilgrimage"
ottoman_mission_events.6.b:0 "Leverage our religious authority"

# === EVENT 7: CALIPHATE AMBITIONS ===
ottoman_mission_events.7.t:0 "The Ottoman Caliphate"
ottoman_mission_events.7.d:0 "With the transfer of the Caliphate to Ottoman hands, we now claim spiritual leadership of all Muslims. This title, held by the Abbasids for centuries and now passed to our dynasty, confers unparalleled prestige and authority across the Islamic world. The Caliphate will now be the spiritual foundation of our empire."
ottoman_mission_events.7.a:0 "Embrace the title of Caliph"
ottoman_mission_events.7.b:0 "Focus on political authority"

# === EVENT 8: CONQUER EGYPT ===
ottoman_mission_events.8.t:0 "The Conquest of Egypt"
ottoman_mission_events.8.d:0 "Egypt, the ancient land of Pharaohs and home to the great city of Cairo, has fallen to the Ottoman Empire. The Mamluk Sultanate, which once rivaled our power, has been destroyed. Egypt's grain wealth, trade routes, and strategic position make it one of the crown jewels of our empire."
ottoman_mission_events.8.a:0 "Rule from Cairo directly"
ottoman_mission_events.8.b:0 "Exploit Egypt's trade potential"

# === EVENT 9: REFORM THE JANISSARIES ===
ottoman_mission_events.9.t:0 "Janissary Reforms"
ottoman_mission_events.9.d:0 "The Janissary corps, once the pride of the Ottoman army, has become increasingly powerful and resistant to change. We must reform this institution to restore its discipline and effectiveness while ensuring its continued loyalty to the Sultan."
ottoman_mission_events.9.a:0 "Modernize the corps"
ottoman_mission_events.9.b:0 "Restore discipline through training"

# === EVENT 10: MODERNIZE THE ARTILLERY ===
ottoman_mission_events.10.t:0 "Artillery Modernization"
ottoman_mission_events.10.d:0 "Gunpowder technology continues to advance rapidly, and we must keep pace. Our artillery has already proven decisive in sieges, but new innovations in cannon design and production could make our forces truly unstoppable. We must invest in modernizing our artillery corps."
ottoman_mission_events.10.a:0 "Develop new artillery technology"
ottoman_mission_events.10.b:0 "Build dedicated workshops"

# === EVENT 11: CREATE SIPAHI CORPS ===
ottoman_mission_events.11.t:0 "The Sipahi Corps"
ottoman_mission_events.11.d:0 "The Sipahi, our feudal cavalry, form the backbone of our mounted forces. These warriors, granted lands in exchange for military service, represent the traditional martial nobility of the empire. We must ensure their loyalty and effectiveness to maintain our military superiority."
ottoman_mission_events.11.a:0 "Form elite Sipahi regiments"
ottoman_mission_events.11.b:0 "Expand their land grants"

# === EVENT 12: OTTOMAN MILITARY TRADITION ===
ottoman_mission_events.12.t:0 "Ottoman Military Tradition"
ottoman_mission_events.12.d:0 "The Ottoman military has become the most feared in the world. Our armies combine discipline, innovation, and a warrior tradition stretching back to our nomadic ancestors. This reputation alone gives us an advantage over our enemies, but we must continue to cultivate our martial excellence."
ottoman_mission_events.12.a:0 "Develop a great admiral for our fleet"
ottoman_mission_events.12.b:0 "Focus on comprehensive military reform"

# === EVENT 13: CONTROL SPICE TRADE ===
ottoman_mission_events.13.t:0 "The Spice Trade"
ottoman_mission_events.13.d:0 "The spice trade, which brings exotic goods from the East, is essential to European economies. By controlling the land routes and establishing our presence in the Indian Ocean, we can dominate this lucrative commerce. Spices will flow through our ports, enriching the empire and making us indispensable to Europe."
ottoman_mission_events.13.a:0 "Establish a monopoly on spices"
ottoman_mission_events.13.b:0 "Expand trade networks into the Indian Ocean"

# === EVENT 14: RELIGIOUS TOLERANCE ===
ottoman_mission_events.14.t:0 "Religious Tolerance"
ottoman_mission_events.14.d:0 "Our empire encompasses many faiths and peoples. While Islam is the state religion, our Christian and Jewish subjects contribute to our prosperity. A policy of tolerance maintains stability and encourages immigration, while also demonstrating that we are not the brutal conquerors that our enemies claim."
ottoman_mission_events.14.a:0 "Formalize religious tolerance"
ottoman_mission_events.14.b:0 "Encourage religious diversity"

# === EVENT 15: MILLET SYSTEM ===
ottoman_mission_events.15.t:0 "The Millet System"
ottoman_mission_events.15.d:0 "We have established the millet system, granting religious communities autonomy in their internal affairs. This system has proven effective in maintaining stability among our diverse population and ensuring loyalty to the empire. Through the millet system, we govern not by assimilation, but by accommodation."
ottoman_mission_events.15.a:0 "Implement the millet system"
ottoman_mission_events.15.b:0 "Consolidate the millet system"

# === EVENT 16: ADMINISTRATIVE REFORM ===
ottoman_mission_events.16.t:0 "Administrative Reform"
ottoman_mission_events.16.d:0 "The empire has grown too large and diverse to be governed by traditional methods alone. We must reform our administration, creating more efficient government, standardizing laws, and centralizing authority. These reforms will strengthen our ability to govern a vast, multi-ethnic empire."
ottoman_mission_events.16.a:0 "Centralize authority"
ottoman_mission_events.16.b:0 "Reform the bureaucracy"

# === EVENT 17: CHALLENGE HABSBURGS ===
ottoman_mission_events.17.t:0 "The Habsburg Challenge"
ottoman_mission_events.17.d:0 "The Habsburg Empire seeks to block our expansion into Europe. They claim to be the defenders of Christendom, but their ambitions are no less imperial than our own. We must confront them directly, demonstrating that Ottoman power extends into the heart of Europe."
ottoman_mission_events.17.a:0 "Challenge them militarily"
ottoman_mission_events.17.b:0 "Use diplomacy to isolate them"

# === EVENT 18: CONQUER HUNGARY ===
ottoman_mission_events.18.t:0 "Hungary Conquered"
ottoman_mission_events.18.d:0 "Hungary, the kingdom that once blocked our advance into Europe, has fallen to our armies. The great city of Buda is now part of the empire, and the Hungarian nobility has submitted to Ottoman rule. This victory establishes our presence in Central Europe and opens the way to further expansion."
ottoman_mission_events.18.a:0 "Integrate Hungary directly"
ottoman_mission_events.18.b:0 "Rule through vassal lords"

# === EVENT 19: OTTOMAN GOLDEN AGE ===
ottoman_mission_events.19.t:0 "The Ottoman Golden Age"
ottoman_mission_events.19.d:0 "We stand at the peak of Ottoman power and achievement. Our empire stretches from the Danube to the Red Sea, from the Persian frontier to the Mediterranean coast. Our armies are invincible, our treasury is overflowing, and our culture flourishes. This is the Ottoman Golden Age."
ottoman_mission_events.19.a:0 "Celebrate our achievements"
ottoman_mission_events.19.b:0 "Invest in the future"

# === EVENT 20: SULEYMAN'S LEGACY ===
ottoman_mission_events.20.t:0 "Süleyman's Legacy"
ottoman_mission_events.20.d:0 "The legacy of Süleyman the Magnificent lives on in our empire. His legal code, his administrative reforms, and his conquests have shaped the Ottoman Empire into the greatest power of the age. We must continue his work, ensuring that the empire he built endures for generations."
ottoman_mission_events.20.a:0 "Honor the Lawgiver"
ottoman_mission_events.20.b:0 "Continue his reforms"

# === EVENT 21: ROME AMBITIONS ===
ottoman_mission_events.21.t:0 "The Fall of Rome"
ottoman_mission_events.21.d:0 "The Eternal City has fallen to our forces. Rome, the ancient heart of Christendom, now flies the crescent banner. This achievement fulfills the dream of Sultan Mehmed the Conqueror and establishes the Ottoman Empire as the true successor to the Roman legacy. The Pope has fled, and the Christian world is in chaos."
ottoman_mission_events.21.a:0 "Claim the Roman legacy"
ottoman_mission_events.21.b:0 "Rule Rome with discretion"

# === OPTIONAL FLAVOR EVENTS ===
ottoman_mission_events.22.t:0 "The Siege of Vienna"
ottoman_mission_events.22.d:0 "The great city of Vienna has fallen to our armies. The key to Habsburg power in Europe, Vienna's fall opens the way for Ottoman expansion deep into Central Europe. Christendom trembles at our approach, and even the Holy Roman Emperor fears our power."
ottoman_mission_events.22.a:0 "Consolidate our victory"

ottoman_mission_events.23.t:0 "Selim's Legacy"
ottoman_mission_events.23.d:0 "The conquests of Sultan Selim I continue to shape our empire. His campaigns in the east established Ottoman dominance over the Islamic world, setting the stage for our expansion in every direction. We must continue his work, bringing new lands and peoples under our rule."
ottoman_mission_events.23.a:0 "Continue the expansion"
ottoman_mission_events.23.b:0 "Consolidate eastern gains"

ottoman_mission_events.24.t:0 "Mehmed's Dream"
ottoman_mission_events.24.d:0 "The dream of Sultan Mehmed the Conqueror has been fulfilled. He dreamed of a single empire ruling from the Adriatic to the Indus, from the Danube to the Nile. We have achieved even more, bringing the Eternal City itself under our rule. The legacy of the Conqueror lives on."
ottoman_mission_events.24.a:0 "Fulfill the imperial vision"
ottoman_mission_events.24.b:0 "Build on our heritage"

