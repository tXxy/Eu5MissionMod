# === EVENT 1: CONSOLIDATE ANATOLIA ===
ottoman_mission_events.1.t:0 "Consolidation of Anatolia"
ottoman_mission_events.1.d:0 "The Turkish beyliks have been united under Ottoman rule. Our ancestors' dream of a unified Anatolia is now a reality, with the Sultan's authority extending from the Aegean to the eastern mountains. The consolidation of these lands provides a strong foundation for the empire's future expansion, but we must now decide how to best integrate these diverse territories."
ottoman_mission_events.1.a:0 "Integrate them fully into our realm"
ottoman_mission_events.1.b:0 "Focus on economic development"

# === EVENT 3: CONQUER THRACE ===
ottoman_mission_events.3.t:0 "The Fall of Constantinople"
ottoman_mission_events.3.d:0 "The great city of Constantinople has fallen to our armies. The capital of the Eastern Roman Empire, which has stood for over a thousand years, is now the jewel of the Ottoman crown. This momentous victory establishes our empire as the heir to Rome's legacy and opens the gates to European expansion."
ottoman_mission_events.3.a:0 "Make it our new capital"
ottoman_mission_events.3.b:0 "Sack the city for its riches"

# === EVENT 5: CONQUER THE LEVANT ===
ottoman_mission_events.5.t:0 "The Levant Conquered"
ottoman_mission_events.5.d:0 "The holy lands of the Levant are now under Ottoman control. Jerusalem, Damascus, and Aleppo have submitted to our rule, bringing the birthplace of three great faiths under the Sultan's protection. The conquest of these lands brings immense religious prestige and opens new opportunities for trade."
ottoman_mission_events.5.a:0 "Protect the holy sites"
ottoman_mission_events.5.b:0 "Fortify our new territories"

# === EVENT 6: GUARD THE HOLY CITIES ===
ottoman_mission_events.6.t:0 "Custodian of the Holy Cities"
ottoman_mission_events.6.d:0 "The cities of Mecca and Medina are now under our protection. As the new Custodian of the Two Holy Mosques, we hold the spiritual center of the Islamic world. This sacred trust brings immense religious prestige and responsibility, as the Islamic community looks to us for leadership and protection."
ottoman_mission_events.6.a:0 "Fulfill our duty to protect the pilgrimage"
ottoman_mission_events.6.b:0 "Leverage our religious authority"

# === EVENT 7: CALIPHATE AMBITIONS ===
ottoman_mission_events.7.t:0 "The Ottoman Caliphate"
ottoman_mission_events.7.d:0 "With the transfer of the Caliphate to Ottoman hands, we now claim spiritual leadership of all Muslims. This title, held by the Abbasids for centuries and now passed to our dynasty, confers unparalleled prestige and authority across the Islamic world. The Caliphate will now be the spiritual foundation of our empire."
ottoman_mission_events.7.a:0 "Embrace the title of Caliph"
ottoman_mission_events.7.b:0 "Focus on political authority"

# === EVENT 8: CONQUER EGYPT ===
ottoman_mission_events.8.t:0 "The Conquest of Egypt"
ottoman_mission_events.8.d:0 "Egypt, the ancient land of Pharaohs and home to the great city of Cairo, has fallen to the Ottoman Empire. The Mamluk Sultanate, which once rivaled our power, has been destroyed. Egypt's grain wealth, trade routes, and strategic position make it one of the crown jewels of our empire."
ottoman_mission_events.8.a:0 "Rule from Cairo directly"
ottoman_mission_events.8.b:0 "Exploit Egypt's trade potential"

# === EVENT 9: REFORM THE JANISSARIES ===
ottoman_mission_events.9.t:0 "Janissary Reforms"
ottoman_mission_events.9.d:0 "The Janissary corps, once the pride of the Ottoman army, has become increasingly powerful and resistant to change. We must reform this institution to restore its discipline and effectiveness while ensuring its continued loyalty to the Sultan."
ottoman_mission_events.9.a:0 "Modernize the corps"
ottoman_mission_events.9.b:0 "Restore discipline through training"

# === EVENT 16: ADMINISTRATIVE REFORM ===
ottoman_mission_events.16.t:0 "Administrative Reform"
ottoman_mission_events.16.d:0 "The empire has grown too large and diverse to be governed by traditional methods alone. We must reform our administration, creating more efficient government, standardizing laws, and centralizing authority. These reforms will strengthen our ability to govern a vast, multi-ethnic empire."
ottoman_mission_events.16.a:0 "Centralize authority"
ottoman_mission_events.16.b:0 "Reform the bureaucracy"

# === EVENT 18: CONQUER HUNGARY ===
ottoman_mission_events.18.t:0 "Hungary Conquered"
ottoman_mission_events.18.d:0 "Hungary, the kingdom that once blocked our advance into Europe, has fallen to our armies. The great city of Buda is now part of the empire, and the Hungarian nobility has submitted to Ottoman rule. This victory establishes our presence in Central Europe and opens the way to further expansion."
ottoman_mission_events.18.a:0 "Integrate Hungary directly"
ottoman_mission_events.18.b:0 "Rule through vassal lords"

# ==================== EVENT TOOLTIPS ====================
ottoman_mission_events.1.a.tt:0 "Integrate Anatolia fully into the empire, establishing permanent control and legitimacy."
ottoman_mission_events.1.b.tt:0 "Focus on economic development, enriching the new territories and integrating them gradually."

ottoman_mission_events.3.a.tt:0 "Transform Constantinople into our imperial capital, the center of a new world empire."
ottoman_mission_events.3.b.tt:0 "Take the city's wealth for ourselves, filling the treasury and rewarding our soldiers."

ottoman_mission_events.5.a.tt:0 "Protect the holy sites of Jerusalem, establishing our role as guardian of the Holy Land."
ottoman_mission_events.5.b.tt:0 "Fortify our new territories, ensuring permanent control over the Levant."

ottoman_mission_events.6.a.tt:0 "Accept the sacred duty of protecting the pilgrimage to Mecca and Medina."
ottoman_mission_events.6.b.tt:0 "Use our religious authority to strengthen our political position in the Islamic world."

ottoman_mission_events.7.a.tt:0 "Embrace the Caliphate fully, establishing Ottoman spiritual leadership."
ottoman_mission_events.7.b.tt:0 "Focus on political authority while maintaining religious legitimacy."

ottoman_mission_events.8.a.tt:0 "Rule Egypt directly from Cairo, integrating it fully into the empire."
ottoman_mission_events.8.b.tt:0 "Exploit Egypt's trade potential, connecting our markets to Africa and the Indian Ocean."

ottoman_mission_events.9.a.tt:0 "Modernize the Janissary corps with new training and equipment."
ottoman_mission_events.9.b.tt:0 "Restore discipline and tradition to the Janissaries through rigorous training."

ottoman_mission_events.16.a.tt:0 "Centralize authority under the Sultan, creating a more efficient administration."
ottoman_mission_events.16.b.tt:0 "Reform the bureaucracy from the ground up, creating a professional civil service."

ottoman_mission_events.18.a.tt:0 "Integrate Hungary directly into the empire as a new province."
ottoman_mission_events.18.b.tt:0 "Rule through Hungarian nobles, maintaining local traditions while securing their loyalty."

