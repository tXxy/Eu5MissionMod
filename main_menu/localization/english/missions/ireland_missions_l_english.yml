l_english:
 irish_mission_pack: "The Gaelic Clans"
 irish_mission_pack_BUTTON_TOOLTIP:0 "Complete missions to unite the Gaelic clans, break English influence, and forge Ireland into a dominant power across the British Isles."
 irish_mission_pack_CRITERIA_DESCRIPTION:0 "Unite Ireland under a single Gaelic ruler, challenge the powers of Britain, and establish Irish dominance from the Atlantic to the North Sea."

 mission_threaten_the_pale: "Threaten the Pale"
 mission_threaten_the_pale_desc: "We must establish a position strong enough to threaten the foreign enclave at Pale."

 mission_rival_the_pale: "Rival the Pale"
 mission_rival_the_pale_desc: "Our strength must grow until we can stand as an equal to Pale and challenge its rule."

 mission_secure_the_clan: "Secure the Clan"
 mission_secure_the_clan_desc: "Before we can rise above the other clans of Ireland, we must first bring order to our own lands. Our rule must be secure, our authority respected, and our revenues strong enough to sustain greater ambitions."

 mission_prove_our_strength: "Prove Our Strength"
 mission_prove_our_strength_desc: "If we are to lead the clans of Ireland, we must first establish clear dominance in one part of the island. Only by proving our strength in war can we challenge rival powers and prepare for greater conquests."

 mission_cultivate_foreign_relations: "Cultivate Foreign Relations"
 mission_cultivate_foreign_relations_desc: "We must strengthen our relations with foreign powers and ensure we are recognized as a valuable partner."

 mission_secure_foreign_support: "Secure Foreign Support"
 mission_secure_foreign_support_desc: "By securing the backing of one of the great foreign powers, we can strengthen our position in Ireland and prepare for the final struggle against the Pale."

 mission_break_the_pale: "Break the Pale"
 mission_break_the_pale_desc: "The Pale has long stood as a symbol of foreign domination in Ireland. Whether it is subdued beneath our rule or erased entirely, its fall will clear the way for our claim over the rest of the island."

 mission_unite_ireland: "Unite Ireland"
 mission_unite_ireland_desc: "All of Ireland must be brought under our direct rule, so that the island may finally prosper as one realm."

 mission_reassert_royal_authority: "Reassert Royal Authority"
 mission_reassert_royal_authority_desc: "The wars of unification have left Ireland fractured and unsettled. Order must be restored, debts repaid, and the authority of the Crown enforced across the realm before true stability can return."

 mission_irish_catholicism: "Irish Catholicism"
 mission_irish_catholicism_desc: "With cathedrals raised across the realm and the favor of the Papacy secured, we must decide how the Catholic character of Ireland will shape the kingdom."

 mission_appeal_to_the_holy_see: "Appeal to the Holy See"
 mission_appeal_to_the_holy_see_desc: "With England looming across the sea, we must turn to Rome for protection. If the Holy Father recognizes our cause, Ireland may yet stand secure beneath the shield of the Church."

 mission_forge_a_gaelic_realm: "Forge a Gaelic Realm"
 mission_forge_a_gaelic_realm_desc: "With royal authority restored and the realm brought to order, we must now shape Ireland into a unified Gaelic state. Through culture, governance, and diplomacy, our kingdom shall stand as a coherent and enduring power."

 mission_fate_of_mann: "The Fate of Mann"
 mission_fate_of_mann_desc: "The Isle of Mann stands between Ireland and Britain. Its future must be decided—whether as a subject under our rule or as an independent buffer shielding us from foreign powers."

 mission_seat_of_the_gaelic_world: "Seat of the Gaelic World"
 mission_seat_of_the_gaelic_world_desc: "With the Crown secure, the island ordered, and Mann brought into our sphere, Ireland now stands ready to define the future of the Gaelic world."

 mission_the_english_question: "The English Question"
 mission_the_english_question_desc: "With Ireland united, we must now decide how to deal with England and its influence over the islands around us. The choice we make here will define the character of our realm for generations."

 # ==================== CONQUEST BRANCH ====================

 mission_fortify_the_coast: "Fortify the Coast"
 mission_fortify_the_coast_desc: "If England is to be challenged, Ireland must first be secured against invasion. Fortifications along our vulnerable shores will prepare us for the struggle ahead."

 mission_ready_for_war: "Ready for War"
 mission_ready_for_war_desc: "Our coasts are fortified and our strength has grown. The time has come to prepare for offensive war against the powers that dominate Britain."
 mission_ready_for_war_tooltip: "Has: Anti-English Policy modifier | Strength §45%§! vs GBR/ENG, or stronger than SCO/WLS, or none exist | Rewards: Ready for War modifier (20yr), CB vs ENG/GBR (75yr), CB vs SCO & WLS (50yr)"

 ire_dominant_irish_culture_america_tt: "At least 1 location in the Americas has Irish as its dominant culture"
 ire_cathedral_in_america_tt: "At least 3 locations in the Americas have a Cathedral"
 ire_gaspe_owned_tt: "Own Gaspé (Canada)"

 rfw_strength_vs_gbr_tt: "If England does not exist, reach 45%% relative strength vs Great Britain"
 rfw_strength_vs_sco_tt: "Reach equal or greater strength vs Scotland"
 rfw_strength_vs_wls_tt: "Reach 150%% relative strength vs Wales"
 rfw_strength_vs_eng_tt: "Reach 60%% relative strength vs England"

 mission_conquer_scotland: "Conquer Scotland"
 mission_conquer_scotland_desc: "The northern kingdom must be brought to heel if Ireland is to dominate the archipelago."

 mission_conquer_wales: "Conquer Wales"
 mission_conquer_wales_desc: "Wales lies exposed between England and the Irish Sea. Its subjugation will weaken our enemies and strengthen our hold over Britain."

 mission_break_english_influence: "Break English Influence"
 mission_break_english_influence_desc: "England's power has long shaped the fate of these islands. By seizing land from its heartlands, we may finally shatter its influence."

 mission_master_of_the_british_isles: "Master of the British Isles"
 mission_master_of_the_british_isles_desc: "With Scotland subdued, Wales conquered, and England broken, Ireland may now claim mastery over the whole of Britain."

 # ==================== DIPLOMATIC BRANCH ====================

 mission_pale_integration: "Integration of the Pale"
 mission_pale_integration_desc: "The Pale has long existed as a foreign enclave on Irish soil. Rather than crush it entirely, we may absorb its population and institutions into our realm, turning a symbol of division into a foundation for unity."

 mission_anglo_irish_trade: "Anglo-Irish Trade"
 mission_anglo_irish_trade_desc: "With the Pale integrated and peace secured across the Irish Sea, we must now bind our economies together. Trade flowing between Dublin and the English ports will enrich both realms and cement our influence over the relationship."

 mission_senior_partner: "The Senior Partner"
 mission_senior_partner_desc: "Through diplomacy, trade, and patient strength, Ireland has grown to rival and surpass England in power. The question is no longer whether we are equals, but what we shall demand of that equality."

 # ==================== COLONIAL BRANCH ====================

 mission_across_the_western_ocean: "Across the Western Ocean"
 mission_across_the_western_ocean_desc: "Beyond the western horizon lies a vast and unknown world. By charting a course across the ocean, we prepare the way for Irish settlement in distant lands."

 mission_irish_settlement_in_america: "An Irish Settlement in America"
 mission_irish_settlement_in_america_desc: "Having crossed the western ocean, we must now establish a permanent foothold in the lands beyond, securing a place for Irish settlers in the New World."

 mission_fruits_of_the_new_world: "Fruits of the New World"
 mission_fruits_of_the_new_world_desc: "The lands beyond the western ocean yield strange and valuable crops. By securing these resources, we lay the foundations of a new Atlantic economy."

 mission_new_dublin: "New Dublin"
 mission_new_dublin_desc: "Our foothold across the western ocean must become more than a distant outpost. By reshaping New York in the image of our capital, we plant the prestige and ambition of Ireland in the New World."

 mission_atlantic_trade: "Atlantic Trade"
 mission_atlantic_trade_desc: "With settlements across the ocean and new crops flowing into our lands, we must now establish a thriving trade network that binds Ireland to the riches of the Atlantic world."

 mission_harvests_of_the_atlantic: "Harvests of the Atlantic"
 mission_harvests_of_the_atlantic_desc: "What began as exploration and distant settlement must now culminate in mastery. By dominating the production of Atlantic crops, Ireland may transform overseas expansion into enduring prosperity."

 # ==================== TALL / DUBLIN BRANCH ====================

 mission_the_heart_of_ireland: "The Heart of Ireland"
 mission_the_heart_of_ireland_desc: "With the realm secured, we must now turn inward and cultivate the prosperity of Ireland itself. A stable and flourishing heartland will sustain every future ambition."

 mission_expand_dublin: "Expand Dublin"
 mission_expand_dublin_desc: "Dublin must grow into a capital worthy of a rising Irish state. Its markets, workshops, and civic institutions must reflect the ambitions of the realm."

 mission_the_revenue_of_the_realm: "The Revenue of the Realm"
 mission_the_revenue_of_the_realm_desc: "Order and prosperity must be converted into steady and reliable revenue. A wealthy capital and disciplined treasury will allow Ireland to grow rich without depending on conquest."

 mission_a_prosperous_kingdom: "A Prosperous Kingdom"
 mission_a_prosperous_kingdom_desc: "With Dublin flourishing and the revenues of the realm secured, prosperity may now spread across Ireland itself. A wealthy and orderly kingdom shall be our proudest achievement."

 mission_the_black_stuff: "The Black Stuff"
 mission_the_black_stuff_desc: "A thriving brewing tradition will enrich our towns and satisfy our people. What begins in the workshop may become one of the defining products of Ireland."

 mission_a_thriving_pub_life: "A Thriving Pub Life"
 mission_a_thriving_pub_life_desc: "The taverns and alehouses of Ireland are more than places of drink. They are the beating heart of urban sociability, good humor, and common contentment."

 mission_eire_go_brach: "Éire go Brách"
 mission_eire_go_brach_desc: "From fractured clans to a united kingdom and beyond, Ireland now stands as the dominant power of the British Isles and the Atlantic world."

 # ==================== EVENTS ====================

 irish_mission_events.1.t: "How Shall We Defeat the Pale?"
 irish_mission_events.1.d: "The Pale now lies within our reach, but the path ahead is not yet fixed. We may harden our warriors for the coming struggle, or strengthen the realm before pressing further."
 irish_mission_events.1.a: "Prepare our warriors for war."
 irish_mission_events.1.b: "Stabilize and enrich the realm first."

 irish_mission_events.2.t: "The Capital of Ireland"
 irish_mission_events.2.d: "With Ireland now united, the question of our capital must be settled. Dublin stands as the island's foremost city, yet our traditional seat of power still carries weight."
 irish_mission_events.2.a: "Dublin shall be the capital of Ireland."
 irish_mission_events.2.b: "Our current capital shall remain."

 irish_mission_events.3.t: "The Catholic Realm"
 irish_mission_events.3.d: "With our churches raised and Rome looking kindly upon us, we must now decide how the Catholic character of Ireland will shape the kingdom."
 irish_mission_events.3.a: "Empower the Clergy"
 irish_mission_events.3.b: "Patronize Catholic Learning"
 irish_mission_events.3.c: "Bind the Nobility to Rome"

 irish_mission_events.4.t: "The English Question"
 irish_mission_events.4.d: "Ireland stands united. The Pale is broken and England's grip on our island has weakened. Yet the question of England itself remains. Do we take the fight to them, tear down their power over these islands by force—or do we seek a more calculated path, binding them to us through peace, trade, and growing dominance?"
 irish_mission_events.4.a: "Drive them out. Ireland shall be master of the British Isles."
 irish_mission_events.4.b: "Make peace. Ireland shall grow rich and powerful through trade and diplomacy."

 irish_mission_events.7.t: "The Fate of Mann"
 irish_mission_events.7.d: "Mann lies at the crossroads of our ambitions. Shall we bring it under our rule, or allow it to remain independent as a buffer between us and our enemies?"
 irish_mission_events.7.a: "Bring Mann under our rule."
 irish_mission_events.7.b: "Let Mann stand as a buffer."

 irish_mission_events.8.t: "The Seat of the Gaelic World"
 irish_mission_events.8.d: "Ireland now stands secure and ascendant. Yet what shall define our place in the Gaelic world: orderly prosperity, mastery of the western seas, or dominion over Atlantic trade?"
 irish_mission_events.8.a: "Let Ireland prosper under ordered rule."
 irish_mission_events.8.b: "Let Ireland command the western seas."
 irish_mission_events.8.c: "Let Ireland become the market of the western seas."

 irish_mission_events.9.t: "The Feast of Saint Patrick"
 irish_mission_events.9.d: "Across Ireland, bells ring and churches fill as the faithful gather to honor Saint Patrick, patron of the island and symbol of its enduring Christian heritage. Yet such a feast may serve more than devotion alone. It may strengthen the faith, nourish learning, or become a celebration embraced by all the realm."
 irish_mission_events.9.a: "Let the feast deepen the faith of the realm."
 irish_mission_events.9.b: "Let the feast inspire learning and culture."
 irish_mission_events.9.c: "Let the feast become a celebration for all Ireland."

 irish_mission_events.10.t: "The Famine of 1740"
 irish_mission_events.10.d: "A bitter frost and failed harvests have brought devastation to Ireland. Hunger spreads through the countryside, trade falters, revenues collapse, and the people suffer terribly. There is no easy answer now, only survival."
 irish_mission_events.10.a: "Ireland must endure the famine."


