l_english:

 # ============================================================================
 # MISSION PACK NAME
 # ============================================================================

 norway_mission_pack: "The Kingdom of Norway"
 norway_mission_pack_desc: "Guide Norway from a fractured, debt-ridden kingdom under the shadow of Copenhagen and Stockholm to a true power of the North — master of the fish-rich seas from Bergen to Lofoten, heir to the Varangian legacy, and, if the Crown dares, founder of a Norse colony in Vinland itself."
 norway_mission_pack_BUTTON_TOOLTIP: "Complete missions to restore the Norwegian Crown, master the North Sea fish and timber trade, reclaim the Norse Atlantic heritage, decide Norway's place among Denmark and Sweden, settle Vinland, and forge a Norse Renaissance."
 norway_mission_pack_CRITERIA_DESCRIPTION: "Restore the Crown, secure the Atlantic islands and Vinland, settle the Nordic Question with Denmark or Sweden — or neither — and choose the realm's faith to unlock powerful modifiers and bring about a new Norse Renaissance."

 # ============================================================================
 # MISSION NAMES & DESCRIPTIONS
 # ============================================================================

 # BRANCH 1: CROWN

 mission_nor_black_death_recovery: "Rebuild After the Plague"
 mission_nor_black_death_recovery_desc: "The Black Death struck Norway harder than almost anywhere else in Europe — whole valleys emptied, farms abandoned, entire bloodlines of the old nobility extinguished. Now that the pestilence has finally passed, the long work of rebuilding can begin."
 mission_nor_black_death_recovery_tooltip: "Requires the Black Death to have run its course, alongside solid overall development and a recovering peasantry."

 mission_nor_restore_the_crown: "Restore the Norwegian Crown"
 mission_nor_restore_the_crown_desc: "Norway has endured long decades of foreign dominance and internal weakness. Before we can look outward — to the sea, to the islands, to the world beyond — we must first stand firm on our own ground. Pay the debts, stabilise the realm, and remind the world that Norway endures."

 mission_nor_develop_oslo: "Develop Oslo"
 mission_nor_develop_oslo_desc: "Oslo sits at the heart of Norway — a natural harbour, a crossroads of trade, and the seat of royal power. A strong capital means a strong kingdom. Build it, and they will come."

 mission_nor_oslo_capital_of_the_north: "Oslo, Capital of the North"
 mission_nor_oslo_capital_of_the_north_desc: "Scholars, merchants, and clerks now fill Oslo's halls. A university teaches the sons of Norway's nobility and burghers alike. Oslo is no longer merely the king's seat — it is a true capital, the equal of any in northern Europe."

 mission_nor_oslo_market_dominance: "The Market of the North"
 mission_nor_oslo_market_dominance_desc: "A capital is only as strong as the market at its heart. Oslo's merchants now command real weight at the trading tables, and the surrounding countryside feeds the city with a surplus most capitals would envy."
 mission_nor_oslo_market_dominance_tooltip: "Requires strong Norwegian merchant power in Oslo's market and a healthy food surplus somewhere in the country's markets."

 mission_nor_kongsberg_silver: "Silver of Kongsberg"
 mission_nor_kongsberg_silver_desc: "In the hills west of Oslo, veins of silver run richer than anywhere else in the north. A mine at Kongsberg could fill the treasury for generations — if it is worked properly, and worked hard."
 mission_nor_kongsberg_silver_tooltip: "Requires a developed mine at Kongsberg and a healthy silver output."

 # BRANCH 2: FISH ECONOMY

 mission_nor_bergen_trade: "Bergen — Queen of the North"
 mission_nor_bergen_trade_desc: "Bergen is Norway's great city and one of the richest ports in northern Europe. The cod trade fills its warehouses and its harbour teems with ships from a dozen nations. We must ensure that this wealth flows to Norwegian hands — not foreign ones."

 mission_nor_timber_trade: "The Norwegian Timber Trade"
 mission_nor_timber_trade_desc: "Norwegian oak and pine feed the shipyards of half of Europe — the Dutch alone buy entire forests' worth every year. A properly organized timber trade turns our woodlands into one of the kingdom's most reliable sources of wealth."
 mission_nor_timber_trade_tooltip: "Requires substantial lumber production, strong trade income, and wharves in multiple locations."

 # BRANCH 3: NORSE HERITAGE

 mission_nor_norse_seafarers: "The Legacy of the Sea Kings"
 mission_nor_norse_seafarers_desc: "Norway's ancestors did not merely sail the northern seas — they mastered them. The blood of the sea kings runs in Norwegian veins still. Let us honour that inheritance: build the fleet, train the sailors, and remind the world what Norwegian oak and Norwegian courage can do."

 mission_nor_varangian_legacy: "The Varangian Legacy"
 mission_nor_varangian_legacy_desc: "Long before there was a Norway to speak of, Norse warriors served as the Emperor of Constantinople's own household guard — the feared and fabulously paid Varangians. Harald Hardrada himself commanded them before he ever wore a Norwegian crown. That legacy of Norsemen fighting — and winning — far from home is not history. It is a standing invitation."
 mission_nor_varangian_legacy_tooltip: "Requires a credible, sizeable navy and army, and that Byzantium — if it still exists — doesn't see Norwegian adventurers as a threat."

 mission_nor_claim_the_isles: "The Kingdom of the Isles"
 mission_nor_claim_the_isles_desc: "The Isle of Man and the Hebrides once answered together to Norse kings as the old Kingdom of the Isles — a maritime realm stitched from Skye down to the Irish Sea, ruled from Man for two centuries. That claim was never truly renounced, only forgotten. It is time someone remembered all of it."
 mission_nor_claim_the_isles_tooltip: "Requires that Man or the Hebrides are not already Norwegian, plus a capable navy. Reward: a casus belli on whichever of the two is still held by someone else."

 mission_nor_treaty_of_perth: "The Treaty of Perth Revisited"
 mission_nor_treaty_of_perth_desc: "In 1266, a defeated Norway signed away Man and the Hebrides to Scotland at Perth, ending two centuries of Norse rule over the Kingdom of the Isles for a lump sum of silver and a yearly annuity. That treaty was a settlement of weakness, not of right. A stronger Norway owes it no further loyalty."
 mission_nor_treaty_of_perth_tooltip: "Requires a substantial army and navy, and that Scotland — if it still exists — is not clearly stronger than Norway. Reward: a casus belli on Scotland itself."

 mission_nor_avenge_stamford_bridge: "Avenge Stamford Bridge"
 mission_nor_avenge_stamford_bridge_desc: "In 1066, Harald Hardrada — Varangian commander turned King of Norway — landed in England to press his claim to its throne. He very nearly took it. Then, at a bridge near York, Harold Godwinson's army caught him unprepared, and the last great Viking king of Norway died on English soil, weeks before a Norman duke finished what he started. Norway has never formally let that claim go. Perhaps it shouldn't."
 mission_nor_avenge_stamford_bridge_tooltip: "Requires a substantial, veteran army and navy. Reward: a casus belli on England's throne."

 mission_nor_blood_of_the_north: "The Blood of the North"
 mission_nor_blood_of_the_north_desc: "Norse blood did not only found kingdoms in Scandinavia. Rollo's Northmen carved out Normandy from the corpse of West Francia; two generations later, the Hauteville brothers rode out of the same Norman stock to conquer Naples and Sicily. Wherever Norsemen went, they made kings of themselves. There is no reason that tradition should be finished."
 mission_nor_blood_of_the_north_tooltip: "Requires diplomatic standing, a real navy, and that at least one of the two claims — Normandy or Naples — is actually pressable. Choose a claim on Normandy or on Naples."

 mission_nor_secure_the_faeroes: "Secure the Faeroe Islands"
 mission_nor_secure_the_faeroes_desc: "The Faeroes are already ours — but ownership is not the same as mastery. Tórshavn needs proper wharves and fishing villages before these islands contribute what they are capable of. Develop them, and the sea lanes north become Norwegian arteries."

 mission_nor_secure_iceland: "Secure Iceland"
 mission_nor_secure_iceland_desc: "Iceland is a Norwegian subject already — but a lightly-developed one. Its cold waters teem with cod and its coasts have barely been touched. Get three proper fishing settlements established and a real trade flowing, and Iceland stops being a distant outpost and becomes the richest cod ground in the Norwegian realm."
 mission_nor_secure_iceland_tooltip: "Requires three developed fishing villages in Iceland and a healthy trade income. Reward: the Icelandic Cod Boom — a lasting increase to Norwegian fish output."

 mission_nor_finnmark_frontier: "The Finnmark Frontier"
 mission_nor_finnmark_frontier_desc: "Beyond the North Cape lies Finnmark — a land of reindeer, midnight sun, and the Sami people who have called it home since long before any Norwegian king laid claim to it. A Crown that commands the wider Finnish lands to the east has both the standing and the reach to bind the far north to Oslo through trade and mutual advantage, not conquest — and its wealth in fur and fish will follow."
 mission_nor_finnmark_frontier_tooltip: "Requires owning, or holding as a subject or sub-subject, at least 75% of Finland."

 mission_nor_treaty_of_novgorod: "The Treaty of Novgorod"
 mission_nor_treaty_of_novgorod_desc: "Where Norwegian Finnmark meets the lands claimed in the east, the border has never been a hard line — more a shared taxing-ground, worked out between two powers who would rather trade with the Sami than fight each other over them. Novgorod may not be the power it once was, and whoever holds that frontier now — Novgorod still, or one of its ambitious neighbours — will have to reckon with Norway all the same. Whether that reckoning comes as a formal treaty between friends or a claim pressed from a position of strength is Oslo's to decide."
 mission_nor_treaty_of_novgorod_tooltip: "Requires a shared border with whichever of Novgorod, Muscovy, or Russia currently exists, and reasonable diplomatic standing — or none of the three existing at all. Then either an alliance with that power, or full military parity with it. Reward depends on which: if Norway is at least as strong, a casus belli to seize the border territory outright; otherwise, a lasting diplomatic and trade accord with it. If no successor state remains, Norway simply holds the frontier by default."

 nor_novgorod_none_exist_tt: "None of Novgorod, Muscovy, or Russia exist anymore"
 nor_novgorod_border_and_strength_tt: "Norway borders whichever of Novgorod, Muscovy, or Russia currently exists, and is either allied with them or a match for their strength"

 mission_nor_reclaim_orkney_shetland: "Guard the Northern Isles"
 mission_nor_reclaim_orkney_shetland_desc: "Orkney and Shetland are Norse by name, Norse by blood, and Norwegian by the Crown's own hand — but a lightly-defended possession this close to Scotland is an invitation. Raise coastal forts on both isles and make Norway's watch on the Scottish frontier one nobody dares to test."
 mission_nor_reclaim_orkney_shetland_tooltip: "Requires coastal forts on Shetland and Orkney with reasonable development. Reward: the Northern Isles Bastion modifier on both islands."

 mission_nor_secure_greenland: "Secure Greenland"
 mission_nor_secure_greenland_desc: "Norway already holds a foothold in Greenland, but it is fragile — a few scattered settlements clinging to the southern coast. To use Greenland as a true stepping stone westward, those settlements must grow. Develop them, consolidate control, and the path to Vinland opens."

 # BRANCH 4: VINLAND

 mission_nor_establish_vinland: "Establish Vinland"
 mission_nor_establish_vinland_desc: "Leif Erikson sailed west from Greenland five centuries ago and found a land of forest and meadow — Vinland, the sagas call it. The Norse were there once and let it slip away. This time we build something that endures — a colony, a claim, a Norwegian presence in the New World before anyone else thought to look."
 mission_nor_establish_vinland_tooltip: "Requires owning developed territory in Labrador or Newfoundland."

 mission_nor_new_norway: "New Norway"
 mission_nor_new_norway_desc: "West of Vinland's coast, a great river cuts deep into the continent — wide enough for ships, lined with furs and timber beyond counting. What began as a handful of fishing camps at its mouth has become something else entirely: a string of settlements stretching along the river and its coast, trading, growing, and answering to Oslo rather than to any local chief or foreign crown. It is not the old Vinland of the sagas anymore. It is New Norway."
 mission_nor_new_norway_tooltip: "Requires a well-developed Stadacona, control of Tadoussac, Essipit, Mingan, and Pessamit, and solid trade income."

 mission_nor_a_fjord_in_india: "A Fjord in India"
 mission_nor_a_fjord_in_india_desc: "Nobody in Oslo can quite explain how this happened. Somewhere between a storm-blown trading voyage, a Danish sailor's boast that Norway 'could never manage what Denmark has built in the Indies,' and a captain too stubborn to sail home empty-handed, Norway now holds a scrap of the Nicobar Islands. It makes no strategic sense whatsoever. The spice profits are real, though, and so is the bragging rights over Copenhagen."
 mission_nor_a_fjord_in_india_tooltip: "Requires control of the Nicobar Islands and a real navy. Purely for prestige — and pettiness."

 mission_nor_new_fjordland: "New Fjordland"
 mission_nor_new_fjordland_desc: "On the far side of the world, on the southern coast of a green and mountainous island, Norwegian captains found something uncanny: sheer-walled sounds cut by ice into the same kind of rock, in the same kind of shapes, as the coast they left behind. The locals have their own name for it. The Norwegians who settled there did not care. It is, they insist, simply the other Fjordland."
 mission_nor_new_fjordland_tooltip: "Requires control of Motupohue, Waihopai, and Rakiura, and a real navy. Purely for prestige — and the sheer novelty of it."

 # ============================================================================
 # CAPSTONE: THE NORSE RENAISSANCE
 # MODIFIER NAMES & DESCRIPTIONS
 # ============================================================================

 STATIC_MODIFIER_NAME_norwegian_crown_restored: "The Norwegian Crown Restored"
 STATIC_MODIFIER_DESC_norwegian_crown_restored: "The Crown of Norway stands on its own foundation once more. Stability, legitimacy, and the foundations of an independent realm."

 STATIC_MODIFIER_NAME_norwegian_noble_concessions: "Noble Concessions"
 STATIC_MODIFIER_DESC_norwegian_noble_concessions: "The Crown has bought noble support with real influence rather than empty words. The great houses hold more sway at court."

 STATIC_MODIFIER_NAME_norwegian_repopulation: "Norway Rebuilt"
 STATIC_MODIFIER_DESC_norwegian_repopulation: "Abandoned farms are worked again and empty valleys fill with new families. The kingdom recovers from the plague's long shadow."

 STATIC_MODIFIER_NAME_norwegian_riksrad: "The Council of the Realm"
 STATIC_MODIFIER_DESC_norwegian_riksrad: "The Riksråd speaks with a confident, independent voice in the affairs of the union — a check on Copenhagen's ambitions."

 STATIC_MODIFIER_NAME_crown_appointed_council: "A Crown-Appointed Council"
 STATIC_MODIFIER_DESC_crown_appointed_council: "The Riksråd's seats answer to the Crown first and the great families second. It makes for a more obedient council — and occasionally a resentful one."

 STATIC_MODIFIER_NAME_noble_dominated_council: "A Council of Great Families"
 STATIC_MODIFIER_DESC_noble_dominated_council: "The old noble houses hold the Riksråd's seats by right of blood and land. Their support is real, and so is the price of keeping it."

 STATIC_MODIFIER_NAME_norwegian_silver_wealth: "The Silver of Kongsberg"
 STATIC_MODIFIER_DESC_norwegian_silver_wealth: "Kongsberg's mines pour silver into the royal treasury, funding the Crown's ambitions for generations to come."

 STATIC_MODIFIER_NAME_oslo_capital_of_the_north: "Oslo, Capital of the North"
 STATIC_MODIFIER_DESC_oslo_capital_of_the_north: "Oslo has grown into a true capital — a seat of learning, trade, and government fit for a kingdom with ambitions beyond its own fjords."

 STATIC_MODIFIER_NAME_icelandic_cod_boom: "The Icelandic Cod Boom"
 STATIC_MODIFIER_DESC_icelandic_cod_boom: "Icelandic waters yield more fish than ever, feeding both the island and the wider Norwegian realm."

 STATIC_MODIFIER_NAME_bergen_fish_trade: "Bergen Trade Hub"
 STATIC_MODIFIER_DESC_bergen_fish_trade: "Bergen's fish trade flows through Norwegian hands. The cod and herring of the North Sea fill Norwegian coffers."

 STATIC_MODIFIER_NAME_oslo_market_dominance: "The Market of the North"
 STATIC_MODIFIER_DESC_oslo_market_dominance: "Oslo's market is the undisputed commercial heart of Norway, drawing merchants and goods from across the realm and beyond."

 STATIC_MODIFIER_NAME_norse_seafarers: "Legacy of the Sea Kings"
 STATIC_MODIFIER_DESC_norse_seafarers: "Norway has reclaimed its maritime heritage. The old knowledge of the sea runs strong in Norwegian veins."

 STATIC_MODIFIER_NAME_iceland_secured: "Iceland Secured"
 STATIC_MODIFIER_DESC_iceland_secured: "Iceland is firmly Norwegian. Its harbour, its fisheries, and its people stand behind the Crown."

 STATIC_MODIFIER_NAME_atlantic_north_secured: "Master of the Northern Atlantic"
 STATIC_MODIFIER_DESC_atlantic_north_secured: "From the Faeroes to Iceland to Greenland, Norway commands the northern sea lanes. The Atlantic is a Norwegian lake."

 STATIC_MODIFIER_NAME_finnmark_fur_trade: "The Finnmark Fur Trade"
 STATIC_MODIFIER_DESC_finnmark_fur_trade: "Sami traders bring furs south from Finnmark in ever greater numbers, enriching the northern reaches of the realm."

 STATIC_MODIFIER_NAME_norwegian_timber_trade: "The Norwegian Timber Trade"
 STATIC_MODIFIER_DESC_norwegian_timber_trade: "Norwegian oak and pine ship out by the fleet-load, feeding shipyards across the North Sea and the Baltic."

 STATIC_MODIFIER_NAME_northern_isles_bastion: "Northern Isles Bastion"
 STATIC_MODIFIER_DESC_northern_isles_bastion: "Coastal forts and watchful garrisons guard Orkney and Shetland. No Scottish fleet lands here uninvited."

 STATIC_MODIFIER_NAME_vinland_colony_established: "Vinland — The Norse New World"
 STATIC_MODIFIER_DESC_vinland_colony_established: "A Norwegian colony stands in Vinland. What the sagas recorded, Norwegian hands have rebuilt. The New World has a Norse name."

 STATIC_MODIFIER_NAME_saint_lawrence_colony: "The Saint Lawrence Colony"
 STATIC_MODIFIER_DESC_saint_lawrence_colony: "Norwegian settlements now line the great river west of Vinland, trading furs and timber with the peoples of the interior."

 STATIC_MODIFIER_NAME_new_norway: "New Norway"
 STATIC_MODIFIER_DESC_new_norway: "A genuine colonial power has taken root in the New World — New Norway, stretching from Vinland's shore deep along the great river."

 STATIC_MODIFIER_NAME_little_norway_in_india: "A Fjord in India"
 STATIC_MODIFIER_DESC_little_norway_in_india: "A small, improbable, and entirely real Norwegian trading post sits in the Nicobar Islands, to the mild irritation of Copenhagen."

 STATIC_MODIFIER_NAME_little_norway_in_new_fjordland: "New Fjordland"
 STATIC_MODIFIER_DESC_little_norway_in_new_fjordland: "A Norwegian settlement clings to the fjord-carved coast of a distant southern island, fishing waters that look almost exactly like home."

 STATIC_MODIFIER_NAME_bergen_trade_hub: "Bergen Trade Hub"
 STATIC_MODIFIER_DESC_bergen_trade_hub: "Bergen is the undisputed centre of North Sea trade, its quays filled with cod, herring, and timber."

 STATIC_MODIFIER_NAME_kongsberg_silver_rush: "The Kongsberg Silver Rush"
 STATIC_MODIFIER_DESC_kongsberg_silver_rush: "Miners flock to Kongsberg from across the realm, drawn by veins of silver richer than anywhere else in the north."

 STATIC_MODIFIER_NAME_norse_vinland_settlement: "Norse Vinland Settlement"
 STATIC_MODIFIER_DESC_norse_vinland_settlement: "A thriving Norse settlement in Vinland. The colonists grow strong on the land's rich resources."

 # ============================================================================
 # EVENT TITLES & DESCRIPTIONS
 # ============================================================================

 norway_mission_events.1.t: "The Crown of Norway"
 norway_mission_events.1.d: "The realm is stable, the debts are paid, and Norway stands on its own. But a crown without the right backing is a crown that wobbles. Who do we rely on?"

 norway_mission_events.13.t: "Vinland Shall Endure"
 norway_mission_events.13.d: "The first Norse colony in Vinland lasted barely a decade before it was abandoned. Ours will not. We have the ships, the settlers, and the will. This time, Norway plants a flag in the New World that stays planted."

