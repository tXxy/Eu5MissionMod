 bakken_amusement_park: "Bakken"
 bakken_amusement_park_desc: "Dyrehavsbakken — 'the hill in the deer park' — has drawn crowds to its healing spring, its performers, and its food-stalls since 1583. Formally established as a pleasure ground, it is the oldest operating amusement park in the world."
