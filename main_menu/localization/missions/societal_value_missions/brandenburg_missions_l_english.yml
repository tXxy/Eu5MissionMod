# brandenburg_mission_pack_desc: "A comprehensive mission tree charting the rise of Brandenburg from a minor German principality to the mighty Kingdom of Prussia, establishing military dominance in Northern Europe."
# brandenburg_mission_pack_BUTTON_TOOLTIP:0 "Complete missions to transform Brandenburg into the Kingdom of Prussia."
