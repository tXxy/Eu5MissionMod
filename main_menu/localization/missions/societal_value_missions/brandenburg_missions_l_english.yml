# brandenburg_mission_events.1.t: "Securing the Mark of Brandenburg"
# brandenburg_mission_events.1.d: "The Mark of Brandenburg is now firmly under our control. The various local lords have submitted to Hohenzollern authority, and our administration reaches every corner of the territory. With our homeland secured, we must decide how to consolidate our rule and invest our resources for future growth."
# brandenburg_mission_events.1.a: "Focus on Noble Loyalty"
# brandenburg_mission_events.1.b: "Focus on Economic Development"
# brandenburg_mission_events.1.a.tt: "Strengthen ties with the Brandenburg nobility by granting privileges and building castles, securing their loyalty for generations to come."
# brandenburg_mission_events.1.b.tt: "Invest in economic development throughout Brandenburg, improving prosperity and generating immediate wealth for future projects."

# brandenburg_mission_events.2.t: "Developing Berlin"
# brandenburg_mission_events.2.d: "Berlin is transforming from a provincial town into a proper capital. New buildings rise along the Spree, merchants flock to its markets, and the court begins to attract artists and scholars. We must decide how to guide Berlin's growth to best serve our strategic interests."
# brandenburg_mission_events.2.a: "Develop as Trade Capital"
# brandenburg_mission_events.2.b: "Develop as Cultural Capital"
# brandenburg_mission_events.2.a.tt: "Focus on commercial development, expanding Berlin's markets and trade connections to make it the economic heart of Northern Germany."
# brandenburg_mission_events.2.b.tt: "Focus on cultural development, building libraries and attracting scholars to make Berlin a center of learning and refinement."

# brandenburg_mission_events.3.t: "Securing the Oder River"
# brandenburg_mission_events.3.d: "Control of the Oder River gives us command over a vital trade artery connecting Silesia to the Baltic. The river's banks are now dotted with our fortifications and trading posts. We must decide how to maximize the strategic advantages of this important waterway."
# brandenburg_mission_events.3.a: "Focus on River Trade"
# brandenburg_mission_events.3.b: "Focus on Strategic Control"
# brandenburg_mission_events.3.a.tt: "Develop river docks and trade facilities along the Oder to maximize commercial benefits and generate wealth from transit trade."
# brandenburg_mission_events.3.b.tt: "Fortify key crossing points and establish military control to secure the Oder as a defensive barrier and strategic asset."

# brandenburg_mission_events.4.t: "Joining the Holy Roman Empire"
# brandenburg_mission_events.4.d: "Brandenburg is now formally incorporated into the Holy Roman Empire. As imperial princes, we gain both privileges and responsibilities within the complex political structure of Germany. We must decide how to approach imperial politics and position ourselves for influence."
# brandenburg_mission_events.4.a: "Focus on Imperial Networking"
# brandenburg_mission_events.4.b: "Focus on Regional Influence"
# brandenburg_mission_events.4.a.tt: "Build relationships with the Emperor and other imperial princes, establishing Brandenburg as a loyal and influential member of the imperial system."
# brandenburg_mission_events.4.b.tt: "Assert regional dominance and prepare to challenge imperial authority when necessary to advance Brandenburg's interests."

# brandenburg_mission_events.5.t: "Securing Electoral Support"
# brandenburg_mission_events.5.d: "Our electoral dignity gives us a voice in choosing the Holy Roman Emperor. Other electors watch us with interest, some seeing potential alliance, others potential rivalry. We must carefully cultivate relationships to secure our electoral influence."
# brandenburg_mission_events.5.a: "Appoint an Electoral Diplomat"
# brandenburg_mission_events.5.b: "Use Economic Influence"
# brandenburg_mission_events.5.a.tt: "Appoint a skilled diplomat to build alliances with other electors, securing their support for Brandenburg's interests in imperial elections."
# brandenburg_mission_events.5.b.tt: "Use our economic resources to influence other electors through loans and gifts, building a network of economic dependency."

# brandenburg_mission_events.6.t: "Securing the Altmark"
# brandenburg_mission_events.6.d: "The Altmark region is now fully integrated into Brandenburg. Its towns and farmlands add to our strength, while its strategic position strengthens our western frontier. We must decide how to integrate this new territory most effectively."
# brandenburg_mission_events.6.a: "Focus on Military Integration"
# brandenburg_mission_events.6.b: "Focus on Cultural Integration"
# brandenburg_mission_events.6.a.tt: "Build barracks and military infrastructure in the Altmark, integrating its manpower directly into the Brandenburg army."
# brandenburg_mission_events.6.b.tt: "Promote Brandenburgisch culture and language in the Altmark, ensuring its population becomes loyal Brandenburgers."

# brandenburg_mission_events.7.t: "Securing Baltic Access"
# brandenburg_mission_events.7.d: "With ports on the Baltic Sea, Brandenburg becomes a maritime power. The Baltic trade routes are now open to us, offering wealth and strategic opportunities. We must decide how to develop our new maritime capabilities."
# brandenburg_mission_events.7.a: "Focus on Naval Development"
# brandenburg_mission_events.7.b: "Focus on Trade"
# brandenburg_mission_events.7.a.tt: "Build naval bases and shipyards to develop a Baltic fleet capable of protecting our interests and projecting power at sea."
# brandenburg_mission_events.7.b.tt: "Develop Baltic ports as commercial hubs, focusing on trade infrastructure to maximize revenue from maritime commerce."

# brandenburg_mission_events.8.t: "Embracing the Reformation"
# brandenburg_mission_events.8.d: "The Protestant Reformation sweeps through Germany, challenging centuries of Catholic authority. As religious tensions rise, we must decide how Brandenburg will position itself in this new religious landscape."
# brandenburg_mission_events.8.a: "Establish a Lutheran State Church"
# brandenburg_mission_events.8.b: "Adopt Reformed Protestantism"
# brandenburg_mission_events.8.a.tt: "Establish Lutheranism as the state religion, gaining control over church affairs and aligning with the majority of German Protestants."
# brandenburg_mission_events.8.b.tt: "Adopt Reformed Protestantism, emphasizing its compatibility with commercial interests and administrative efficiency."

# brandenburg_mission_events.9.t: "Acquiring East Prussia"
# brandenburg_mission_events.9.d: "East Prussia is now under our control. These rich lands with their distinct Prussian culture and Baltic ports significantly expand our power base. We must decide how to integrate this valuable new territory."
# brandenburg_mission_events.9.a: "Focus on Military Integration"
# brandenburg_mission_events.9.b: "Focus on Cultural Integration"
# brandenburg_mission_events.9.a.tt: "Fortify East Prussia as a military bulwark against eastern threats, integrating its resources directly into our military system."
# brandenburg_mission_events.9.b.tt: "Promote cultural integration, respecting Prussian traditions while gradually aligning East Prussia with Brandenburg's administration."

# brandenburg_mission_events.10.t: "Establishing the Prussian Kingdom"
# brandenburg_mission_events.10.d: "The time has come to claim royal dignity. Brandenburg-Prussia stands strong enough to declare itself a kingdom, elevating our status to equal Europe's oldest monarchies. We must decide how to approach this momentous transition."
# brandenburg_mission_events.10.a: "Proclaim a Prussian King"
# brandenburg_mission_events.10.b: "Seek Diplomatic Recognition"
# brandenburg_mission_events.10.a.tt: "Crown a Hohenzollern monarch with full royal ceremony, establishing strong centralized authority from the start."
# brandenburg_mission_events.10.b.tt: "Carefully seek recognition from other European powers, building diplomatic support for our new royal status."

# brandenburg_mission_events.11.t: "Establishing Prussian Military Tradition"
# brandenburg_mission_events.11.d: "Prussia's military reputation is becoming legendary. Our discipline, training, and effectiveness set new standards in European warfare. We must decide how to institutionalize this military excellence for future generations."
# brandenburg_mission_events.11.a: "Develop Professional Officer Corps"
# brandenburg_mission_events.11.b: "Implement Mass Conscription"
# brandenburg_mission_events.11.a.tt: "Establish military academies and develop a professional officer corps to maintain Prussia's qualitative military edge."
# brandenburg_mission_events.11.b.tt: "Implement systematic conscription to create Europe's largest standing army while maintaining Prussian discipline."

