# # ============================================================================
# # PHASE 1: BRANDENBURG CONSOLIDATION
# # ============================================================================

# mission_bra_secure_the_mark: "Secure the Mark"
# mission_bra_secure_the_mark_desc: "The Mark of Brandenburg is our ancestral homeland. We must secure complete control over the Brandenburg area to establish a solid foundation for future expansion and consolidation of Hohenzollern rule."
# mission_bra_secure_the_mark_tooltip: "Control at least 85% of the Brandenburg area and maintain stable governance."

# mission_bra_develop_berlin: "Develop Berlin"
# mission_bra_develop_berlin_desc: "Berlin, our capital, must grow into a proper city worthy of a rising power. Invest in its development and commercial infrastructure to make it the economic and administrative center of our realm."
# mission_bra_develop_berlin_tooltip: "Develop Berlin to at least 25 development and establish commercial infrastructure."

# mission_bra_strengthen_hohenzollern_rule: "Strengthen Hohenzollern Rule"
# mission_bra_strengthen_hohenzollern_desc: "The Hohenzollern dynasty must consolidate its authority over the Brandenburg nobility. Strengthen the crown's power while managing noble privileges to ensure stable governance."
# mission_bra_strengthen_hohenzollern_tooltip: "Increase crown estate power to 30% while keeping noble influence under control."

# mission_bra_secure_oder_river: "Secure the Oder River"
# mission_bra_secure_oder_river_desc: "The Oder River is a vital trade and transportation artery. Securing control over its banks will give us economic advantages and strategic depth in our eastern territories."
# mission_bra_secure_oder_river_tooltip: "Control the locations of Lebus and Guben."

# mission_bra_promote_german_settlement: "Promote German Settlement"
# mission_bra_promote_german_settlement_desc: "The Brandenburgisch culture is the foundation of our identity. Encourage German settlement and cultural dominance throughout our core territories to strengthen our demographic base."
# mission_bra_promote_german_settlement_tooltip: "Increase Brandenburgisch cultural tradition and ensure cultural dominance in Brandenburg."

# # ============================================================================
# # PHASE 2: IMPERIAL POLITICS
# # ============================================================================

# mission_bra_join_holy_roman_empire: "Join the Holy Roman Empire"
# mission_bra_join_holy_roman_empire_desc: "As a German principality, our future lies within the Holy Roman Empire. Secure membership to gain imperial protection, participate in imperial politics, and increase our diplomatic standing."
# mission_bra_join_holy_roman_empire_tooltip: "Become a member of the Holy Roman Empire with sufficient diplomatic reputation."

# mission_bra_increase_imperial_influence: "Increase Imperial Influence"
# mission_bra_increase_imperial_influence_desc: "Within the Empire, influence is power. Build relationships with other imperial princes and increase our standing in imperial affairs to secure our position and future ambitions."
# mission_bra_increase_imperial_influence_tooltip: "Achieve significant imperial influence and maintain good relations with imperial neighbors."

# mission_bra_secure_electoral_support: "Secure Electoral Support"
# mission_bra_secure_electoral_support_desc: "The Electoral dignity is the highest honor within the Empire. Secure the support of other electors and position ourselves for potential imperial election or at least significant influence in imperial succession."
# mission_bra_secure_electoral_support_tooltip: "Maintain electoral status while building prestige and imperial standing."

# mission_bra_counter_saxon_influence: "Counter Saxon Influence"
# mission_bra_counter_saxon_influence_desc: "The Saxons have long been our rivals in Northern Germany. Counter their influence and demonstrate our military superiority to establish Brandenburg as the dominant power in the region."
# mission_bra_counter_saxon_influence_tooltip: "Achieve military superiority over Saxony while maintaining a strong army."

# mission_bra_establish_imperial_alliances: "Establish Imperial Alliances"
# mission_bra_establish_imperial_alliances_desc: "Alliances within the Empire are essential for security and influence. Forge strong bonds with other imperial princes to create a network of support for our ambitions."
# mission_bra_establish_imperial_alliances_tooltip: "Form alliances with at least two imperial neighbors and maintain diplomatic reputation."

# # ============================================================================
# # PHASE 3: REGIONAL EXPANSION
# # ============================================================================

# mission_bra_develop_brandenburg_army: "Develop Brandenburg Army"
# mission_bra_develop_brandenburg_army_desc: "A strong army is the foundation of our power. Build a professional military force capable of defending our territories and projecting power beyond our borders."
# mission_bra_develop_brandenburg_army_tooltip: "Maintain a large, well-supported army ready for expansion."

# mission_bra_secure_altmark: "Secure the Altmark"
# mission_bra_secure_altmark_desc: "The Altmark region is historically part of Brandenburg's sphere of influence. Secure control over this territory to complete our domination of the Elbe basin and strengthen our western frontier."
# mission_bra_secure_altmark_tooltip: "Control at least 80% of the Altmark area."

# mission_bra_expand_into_pomerania: "Expand into Pomerania"
# mission_bra_expand_into_pomerania_desc: "Pomerania offers access to the Baltic Sea and valuable coastal territories. Expand our influence into this region to secure maritime access and additional resources."
# mission_bra_expand_into_pomerania_tooltip: "Control at least 60% of the Pomerania area."

# mission_bra_secure_baltic_access: "Secure Baltic Access"
# mission_bra_secure_baltic_access_desc: "The Baltic Sea is a vital trade route and strategic waterway. Secure permanent access to the Baltic by controlling key ports and coastal territories."
# mission_bra_secure_baltic_access_tooltip: "Control Stettin and Stralsund while developing naval infrastructure."

# mission_bra_challenge_teutonic_order: "Challenge the Teutonic Order"
# mission_bra_challenge_teutonic_order_desc: "The Teutonic Order controls valuable Prussian territories to our east. Challenge their dominance and position ourselves to eventually acquire these lands for the Hohenzollern dynasty."
# mission_bra_challenge_teutonic_order_tooltip: "Achieve military superiority over the Teutonic Order and build army tradition."

# # ============================================================================
# # PHASE 4: ECONOMIC DEVELOPMENT
# # ============================================================================

# mission_bra_develop_brandenburg_economy: "Develop Brandenburg Economy"
# mission_bra_develop_brandenburg_economy_desc: "Economic strength is essential for sustaining our military and administrative ambitions. Develop our territories, promote trade, and build commercial infrastructure to generate wealth."
# mission_bra_develop_brandenburg_economy_tooltip: "Achieve significant economic development and commercial infrastructure."

# mission_bra_establish_grain_trade: "Establish Grain Trade"
# mission_bra_establish_grain_trade_desc: "Brandenburg's fertile lands produce abundant grain. Establish control over the grain trade to generate wealth and secure food supplies for our growing population."
# mission_bra_establish_grain_trade_tooltip: "Control significant wheat production and market influence."

# mission_bra_develop_iron_mining: "Develop Iron Mining"
# mission_bra_develop_iron_mining_desc: "Iron is essential for weapons, tools, and industry. Develop our iron mining capabilities to support military production and economic growth."
# mission_bra_develop_iron_mining_tooltip: "Control iron resources and develop tool production facilities."

# mission_bra_improve_infrastructure: "Improve Infrastructure"
# mission_bra_improve_infrastructure_desc: "Good roads, bridges, and communications are vital for administration, trade, and military movement. Invest in infrastructure to improve connectivity throughout our territories."
# mission_bra_improve_infrastructure_tooltip: "Build road and bridge networks and establish communication systems."

# # ============================================================================
# # PHASE 5: REFORMATION AND RELIGIOUS CONFLICT
# # ============================================================================

# mission_bra_embrace_protestant_reformation: "Embrace Protestant Reformation"
# mission_bra_embrace_protestant_reformation_desc: "The Protestant Reformation offers an opportunity to break from papal authority and strengthen state control over religion. Embrace reform to align with growing Protestant movements in Germany."
# mission_bra_embrace_protestant_reformation_tooltip: "Adopt a Protestant faith while maintaining religious unity."

# mission_bra_establish_lutheran_church: "Establish Lutheran Church"
# mission_bra_establish_lutheran_church_desc: "Martin Luther's teachings resonate throughout Germany. Establish a state Lutheran church to consolidate religious authority under the crown and promote Protestant unity."
# mission_bra_establish_lutheran_church_tooltip: "Adopt Lutheranism and build Protestant churches throughout your territories."

# mission_bra_defend_protestant_interests: "Defend Protestant Interests"
# mission_bra_defend_protestant_interests_desc: "As a leading Protestant power, we must defend the reformed faith against Catholic aggression. Build military strength to protect Protestant interests in Germany and beyond."
# mission_bra_defend_protestant_interests_tooltip: "Maintain strong military tradition and readiness against Catholic rivals."

# mission_bra_promote_religious_tolerance: "Promote Religious Tolerance"
# mission_bra_promote_religious_tolerance_desc: "While committed to Protestantism, pragmatic governance requires tolerance to maintain stability. Promote religious tolerance to reduce internal conflicts and improve relations with Catholic neighbors."
# mission_bra_promote_religious_tolerance_tooltip: "Achieve high religious unity and stable relations with Catholic neighbors."

# # ============================================================================
# # PHASE 6: MILITARY REFORMS
# # ============================================================================

# mission_bra_reform_brandenburg_army: "Reform Brandenburg Army"
# mission_bra_reform_brandenburg_army_desc: "Modern warfare requires modern armies. Implement military reforms to create a more professional, disciplined, and effective fighting force capable of competing with Europe's best."
# mission_bra_reform_brandenburg_army_tooltip: "Achieve high army tradition and build military infrastructure."

# mission_bra_establish_standing_army: "Establish Standing Army"
# mission_bra_establish_standing_army_desc: "A permanent standing army gives us constant readiness and professional soldiers. Establish a professional military force that doesn't rely on seasonal levies or mercenaries."
# mission_bra_establish_standing_army_tooltip: "Maintain a large standing army with sufficient funding."

# mission_bra_develop_artillery_corps: "Develop Artillery Corps"
# mission_bra_develop_artillery_corps_desc: "Artillery is becoming increasingly decisive in warfare. Develop a professional artillery corps with modern cannons and trained crews to dominate siege warfare and battlefield engagements."
# mission_bra_develop_artillery_corps_tooltip: "Control copper resources and build cannon production facilities."

# mission_bra_fortify_brandenburg: "Fortify Brandenburg"
# mission_bra_fortify_brandenburg_desc: "Strong defenses are essential for security. Fortify our key territories with modern fortifications to deter aggression and protect our heartland from invasion."
# mission_bra_fortify_brandenburg_tooltip: "Build extensive fortifications throughout your territories."

# # ============================================================================
# # PHASE 7: PRUSSIAN AMBITIONS
# # ============================================================================

# mission_bra_acquire_east_prussia: "Acquire East Prussia"
# mission_bra_acquire_east_prussia_desc: "The Prussian lands to our east are rich and strategically valuable. Acquire control over East Prussia to expand our territory and lay claim to the Prussian name and heritage."
# mission_bra_acquire_east_prussia_tooltip: "Control most of East Prussia including Königsberg."

# mission_bra_integrate_prussian_culture: "Integrate Prussian Culture"
# mission_bra_integrate_prussian_culture_desc: "The Prussian people have a distinct culture and identity. Integrate Prussian culture into our realm to strengthen our demographic base and claim legitimacy over Prussian lands."
# mission_bra_integrate_prussian_culture_tooltip: "Accept Prussian culture and ensure its dominance in East Prussia."

# mission_bra_secure_duchy_of_prussia: "Secure Duchy of Prussia"
# mission_bra_secure_duchy_of_prussia_desc: "The Duchy of Prussia represents formal sovereignty over Prussian lands. Secure complete control and recognition of our rule over Prussia to establish a firm foundation for future royal ambitions."
# mission_bra_secure_duchy_of_prussia_tooltip: "Control virtually all of East Prussia with high prestige and legitimacy."

# mission_bra_develop_prussian_economy: "Develop Prussian Economy"
# mission_bra_develop_prussian_economy_desc: "Prussian lands offer unique economic opportunities, particularly the valuable amber trade. Develop the Prussian economy to generate wealth and integrate it fully into our realm."
# mission_bra_develop_prussian_economy_tooltip: "Develop East Prussian territories and control amber production."

# # ============================================================================
# # PHASE 8: FORM PRUSSIA
# # ============================================================================

# mission_bra_unify_brandenburg_prussia: "Unify Brandenburg-Prussia"
# mission_bra_unify_brandenburg_prussia_desc: "Brandenburg and Prussia are now united under Hohenzollern rule. Formalize this union to create a single, powerful state stretching from the Rhine to the Memel."
# mission_bra_unify_brandenburg_prussia_tooltip: "Control virtually all of Brandenburg and East Prussia with high military prestige."

# mission_bra_establish_prussian_kingdom: "Establish Prussian Kingdom"
# mission_bra_establish_prussian_kingdom_desc: "The time has come to claim royal dignity. Establish the Kingdom of Prussia, elevating our status from an electorate to a sovereign kingdom and taking our place among Europe's monarchies."
# mission_bra_establish_prussian_kingdom_tooltip: "Achieve exceptional prestige, legitimacy, and development to form Prussia."

# mission_bra_form_kingdom_of_prussia: "Form Kingdom of Prussia"
# mission_bra_form_kingdom_of_prussia_desc: "The Kingdom of Prussia is now a reality. Consolidate our royal authority and establish Prussia as a major European power with ambitions for German leadership."
# mission_bra_form_kingdom_of_prussia_tooltip: "Successfully form the Kingdom of Prussia and achieve royal rank."

# # ============================================================================
# # PHASE 9: PRUSSIAN MILITARY TRADITION
# # ============================================================================

# mission_bra_establish_prussian_army_tradition: "Establish Prussian Army Tradition"
# mission_bra_establish_prussian_army_tradition_desc: "Prussia's military must become the envy of Europe. Establish a renowned military tradition based on discipline, training, and effectiveness that will define Prussian power for generations."
# mission_bra_establish_prussian_army_tradition_tooltip: "Achieve exceptional army tradition and build military academies."

# mission_bra_develop_prussian_infantry: "Develop Prussian Infantry"
# mission_bra_develop_prussian_infantry_desc: "Prussian infantry must become the finest in Europe. Develop superior training, tactics, and equipment to create infantry that can defeat any opponent on the battlefield."
# mission_bra_develop_prussian_infantry_tooltip: "Build extensive barracks and maintain a large, modern army."

# mission_bra_modernize_prussian_artillery: "Modernize Prussian Artillery"
# mission_bra_modernize_prussian_artillery_desc: "Modern artillery is essential for siege warfare and battlefield dominance. Modernize our artillery corps with the latest technology and industrial production capabilities."
# mission_bra_modernize_prussian_artillery_tooltip: "Control iron and copper resources and build advanced cannon workshops."

# mission_bra_establish_general_staff: "Establish General Staff"
# mission_bra_establish_general_staff_desc: "A professional general staff system ensures coordinated planning and efficient command. Establish a Prussian general staff to institutionalize military excellence and strategic thinking."
# mission_bra_establish_general_staff_tooltip: "Research general staff advance and build a war college."

# # ============================================================================
# # PHASE 10: GERMAN LEADERSHIP
# # ============================================================================

# mission_bra_establish_german_hegemony: "Establish German Hegemony"
# mission_bra_establish_german_hegemony_desc: "Prussia must become the dominant power in Germany. Establish hegemony over Northern Germany to position ourselves as the natural leader of the German people."
# mission_bra_establish_german_hegemony_tooltip: "Achieve great power status and control most of Northern Germany."

# mission_bra_challenge_austrian_leadership: "Challenge Austrian Leadership"
# mission_bra_challenge_austrian_leadership_desc: "The Habsburgs have long claimed leadership of Germany. Challenge Austrian dominance and demonstrate that Prussia is now the true leading power in German affairs."
# mission_bra_challenge_austrian_leadership_tooltip: "Achieve military superiority over Austria with high prestige."

# mission_bra_unify_north_germany: "Unify North Germany"
# mission_bra_unify_north_germany_desc: "Northern Germany should be united under Prussian leadership. Unify the North German states to create a powerful bloc that can challenge any European power."
# mission_bra_unify_north_germany_tooltip: "Control most of Northern Germany with a massive army."

# mission_bra_promote_prussian_culture: "Promote Prussian Culture"
# mission_bra_promote_prussian_culture_desc: "Prussian culture represents discipline, efficiency, and enlightenment. Promote Prussian cultural values throughout our realm to strengthen national identity and cohesion."
# mission_bra_promote_prussian_culture_tooltip: "Develop high Prussian cultural tradition and educational infrastructure."

# # ============================================================================
# # PHASE 11: ENLIGHTENMENT AND REFORMS
# # ============================================================================

# mission_bra_embrace_enlightenment: "Embrace Enlightenment"
# mission_bra_embrace_enlightenment_desc: "Enlightenment ideas offer new approaches to governance, education, and society. Embrace enlightened principles to modernize our state and strengthen our intellectual foundations."
# mission_bra_embrace_enlightenment_tooltip: "Adopt Enlightenment institution and develop educational infrastructure."

# mission_bra_reform_prussian_bureaucracy: "Reform Prussian Bureaucracy"
# mission_bra_reform_prussian_bureaucracy_desc: "An efficient bureaucracy is essential for modern statehood. Reform our administrative systems to create the most efficient and effective government in Europe."
# mission_bra_reform_prussian_bureaucracy_tooltip: "Strengthen crown and burgher estates while improving literacy and stability."

# mission_bra_develop_prussian_education: "Develop Prussian Education"
# mission_bra_develop_prussian_education_desc: "Education is the foundation of progress. Develop a comprehensive Prussian education system to produce skilled administrators, officers, and citizens for our modern state."
# mission_bra_develop_prussian_education_tooltip: "Achieve high literacy rates and build extensive educational infrastructure."

# # ============================================================================
# # PHASE 12: FINAL ULTIMATE MISSIONS
# # ============================================================================

# mission_bra_prussian_military_supremacy: "Prussian Military Supremacy"
# mission_bra_prussian_military_supremacy_desc: "Prussia's military must become unquestionably supreme in Europe. Achieve such overwhelming military dominance that no power can challenge Prussian arms on the continent."
# mission_bra_prussian_military_supremacy_tooltip: "Achieve absolute military dominance in Germany with massive army tradition."

# mission_bra_prussian_golden_age: "Prussian Golden Age"
# mission_bra_prussian_golden_age_desc: "Prussia stands at the pinnacle of power, culture, and achievement. This is our golden age - a time when Prussian discipline, efficiency, and military prowess define European politics and set the standard for modern statehood."
# mission_bra_prussian_golden_age_tooltip: "Achieve hegemonic status with control over key German regions and exceptional development."

