l_english:

# === MISSION PACK HEADER ===
sweden_mission_pack_test: "Sweden: The Lion of the North"
sweden_mission_pack_test_desc: "Guide Sweden from independence to empire through military reforms, religious transformation, and Baltic dominance."
sweden_mission_pack_test_BUTTON_TOOLTIP: "Complete missions to transform Sweden into a great power and establish Scandinavian hegemony."
sweden_mission_pack_test_CRITERIA_DESCRIPTION: "Secure independence, reform the military, dominate the Baltic, and lead the Protestant cause to unlock powerful modifiers and traditions."

# === PHASE 1: SWEDISH INDEPENDENCE & CONSOLIDATION ===
mission_secure_swedish_crown: "Secure the Swedish Crown"
mission_secure_swedish_crown_desc: "Establish a stable, independent Swedish monarchy free from foreign domination to guide our nation to greatness."
mission_secure_swedish_crown_tooltip: "Maintain stability and legitimacy while being independent from Denmark."

mission_consolidate_svealand: "Consolidate Svealand"
mission_consolidate_svealand_desc: "Secure firm control over the Swedish heartland to establish a strong base for expansion and national development."
mission_consolidate_svealand_tooltip: "Achieve near-complete control of the Svealand region."

mission_unite_gotaland: "Unite Götaland"
mission_unite_gotaland_desc: "Bring the southern lands under Swedish rule and gain the support of the local nobility for a unified kingdom."
mission_unite_gotaland_tooltip: "Control Götaland region and maintain noble satisfaction."

mission_develop_stockholm: "Develop Stockholm"
mission_develop_stockholm_desc: "Transform our capital into a prosperous trading center and administrative hub worthy of a rising power."
mission_develop_stockholm_tooltip: "Develop Stockholm into a developed capital with commercial infrastructure."

mission_strengthen_royal_authority: "Strengthen Royal Authority"
mission_strengthen_royal_authority_desc: "Consolidate power in the crown to reduce noble influence and establish a strong centralized state."
mission_strengthen_royal_authority_tooltip: "Increase crown estate power while limiting noble influence."

# === PHASE 2: MILITARY REFORMS & ARMY DEVELOPMENT ===
mission_reform_swedish_army: "Reform the Swedish Army"
mission_reform_swedish_army_desc: "Modernize and professionalize our military to compete with European great powers through comprehensive reforms."
mission_reform_swedish_army_tooltip: "Maintain a strong army, crown estate power, and army tradition."

mission_swedish_establish_standing_army: "Establish Standing Army"
mission_swedish_establish_standing_army_desc: "Create a professional standing army independent of seasonal levies to ensure constant military readiness."
mission_swedish_establish_standing_army_tooltip: "Maintain a substantial army with high tradition and crown control."

mission_develop_artillery_corps: "Develop Artillery Corps"
mission_develop_artillery_corps_desc: "Build a formidable artillery corps using Swedish copper and iron to dominate sieges and battlefield engagements."
mission_develop_artillery_corps_tooltip: "Control copper and iron resources and build cannon production facilities."

mission_implement_indelta_system: "Implement the Indelta System"
mission_implement_indelta_system_desc: "Establish a regional recruitment system where specific farms support specific regiments for reliable manpower."
mission_implement_indelta_system_tooltip: "Maintain sufficient manpower reserves and crown estate influence."

mission_establish_caroleans: "Establish the Caroleans"
mission_establish_caroleans_desc: "Create an elite professional army known for discipline, ferocity, and innovative tactics on the battlefield."
mission_establish_caroleans_tooltip: "Achieve high army tradition and build military infrastructure."

# === PHASE 3: NAVAL DEVELOPMENT ===
mission_build_swedish_navy: "Build Swedish Navy"
mission_build_swedish_navy_desc: "Construct a powerful Baltic fleet to protect our coasts, secure trade routes, and project naval power."
mission_build_swedish_navy_tooltip: "Build a substantial navy and develop port infrastructure."

mission_develop_shipbuilding_industry: "Develop Shipbuilding Industry"
mission_develop_shipbuilding_industry_desc: "Establish superior shipbuilding capabilities using Swedish timber to create a formidable naval force."
mission_develop_shipbuilding_industry_tooltip: "Control timber resources and build shipyards."

mission_establish_modern_navy: "Establish Modern Navy"
mission_establish_modern_navy_desc: "Create a technologically advanced navy with dry docks, modern ships, and professional sailors."
mission_establish_modern_navy_tooltip: "Maintain a large navy with advanced infrastructure."

# === PHASE 4: SCANDINAVIAN UNIFICATION PATH ===
mission_challenge_danish_hegemony: "Challenge Danish Hegemony"
mission_challenge_danish_hegemony_desc: "Assert Swedish dominance in Scandinavia by challenging traditional Danish leadership of the region."
mission_challenge_danish_hegemony_tooltip: "Rival Denmark and achieve military superiority."

mission_secure_skane: "Secure Skåne"
mission_secure_skane_desc: "Claim the fertile southern provinces to strengthen our agricultural base and control the Øresund strait."
mission_secure_skane_tooltip: "Control the Skåne region including Malmö."

mission_control_over_norway: "Control Norway"
mission_control_over_norway_desc: "Establish control over Norway to secure its strategic Atlantic position and resources."
mission_control_over_norway_tooltip: "Control Norwegian territories and reduce Danish influence."

mission_subjugate_norway: "Subjugate Norway"
mission_subjugate_norway_desc: "Bring Norway under Swedish influence to control its resources, ports, and strategic Atlantic position."
mission_subjugate_norway_tooltip: "Reduce Norwegian territory and control Oslo."

mission_break_kalmar_union: "Break the Kalmar Union"
mission_break_kalmar_union_desc: "Shatter Danish-dominated Scandinavian unity and establish Swedish leadership of the Nordic region."
mission_break_kalmar_union_tooltip: "End Danish sovereignty and control Copenhagen."

mission_promote_scandinavian_unity: "Promote Scandinavian Unity"
mission_promote_scandinavian_unity_desc: "Foster cultural and political integration of Scandinavian peoples under Swedish leadership."
mission_promote_scandinavian_unity_tooltip: "Accept Danish and Norwegian cultures while promoting Swedish tradition."

mission_form_scandinavian_kingdom: "Form Scandinavian Kingdom"
mission_form_scandinavian_kingdom_desc: "Unite the Nordic peoples into a single powerful kingdom under the Swedish crown."
mission_form_scandinavian_kingdom_tooltip: "Control Scandinavian capitals and achieve high prestige."

# === PHASE 5: BALTIC DOMINANCE ===
mission_secure_baltic_coast: "Secure Baltic Coast"
mission_secure_baltic_coast_desc: "Control the entire Baltic coastline to dominate regional trade and secure our maritime frontiers."
mission_secure_baltic_coast_tooltip: "Control numerous Baltic coastal locations with a substantial navy."

mission_secure_finland: "Secure Finland"
mission_secure_finland_desc: "Firmly establish Swedish control over Finland as an eastern buffer and source of resources and manpower."
mission_secure_finland_tooltip: "Control Finland and Norrland regions."

mission_expand_into_baltics: "Expand into the Baltics"
mission_expand_into_baltics_desc: "Extend Swedish influence into the eastern Baltic provinces to control trade cities and strategic positions."
mission_expand_into_baltics_tooltip: "Gain territory in the eastern Baltic region including Riga."

mission_dominate_baltic_sea: "Dominate the Baltic Sea"
mission_dominate_baltic_sea_desc: "Establish complete naval supremacy in the Baltic Sea, making it a Swedish-controlled maritime domain."
mission_dominate_baltic_sea_tooltip: "Achieve naval supremacy with high tradition and control Baltic region."

# === PHASE 6: ECONOMIC DEVELOPMENT ===
mission_develop_lumber_industry: "Develop Lumber Industry"
mission_develop_lumber_industry_desc: "Exploit Sweden's vast forests for timber production to support shipbuilding and export industries."
mission_develop_lumber_industry_tooltip: "Control timber resources and develop lumber production."

mission_develop_mining_industry: "Develop Mining Industry"
mission_develop_mining_industry_desc: "Expand copper and iron mining operations to create Europe's premier metal production center."
mission_develop_mining_industry_tooltip: "Develop copper and iron production to target levels."

mission_establish_iron_exports: "Establish Iron Exports"
mission_establish_iron_exports_desc: "Monopolize the export of high-quality Swedish iron to make Europe's arms industries dependent on our resources."
mission_establish_iron_exports_tooltip: "Dominate the iron trade and maintain burgher satisfaction."

mission_establish_baltic_trade_league: "Establish Baltic Trade League"
mission_establish_baltic_trade_league_desc: "Create a Swedish-dominated trade network controlling commerce throughout the Baltic region."
mission_establish_baltic_trade_league_tooltip: "Develop trade infrastructure and dominate Stockholm market."

# === PHASE 7: RELIGIOUS REFORMATION ===
mission_embrace_reformation: "Embrace the Reformation"
mission_embrace_reformation_desc: "Adopt Lutheranism to establish a national church independent of Rome and align with Protestant Europe."
mission_embrace_reformation_tooltip: "Adopt Lutheranism and maintain religious unity."

mission_establish_state_church: "Establish State Church"
mission_establish_state_church_desc: "Create the Church of Sweden as a Lutheran institution under royal control to strengthen the state."
mission_establish_state_church_tooltip: "Build Protestant churches and achieve high religious unity."

mission_protestant_leadership: "Protestant Leadership"
mission_protestant_leadership_desc: "Position Sweden as the leading defender and promoter of the Protestant cause in Europe."
mission_protestant_leadership_tooltip: "Form alliances with Protestant nations and maintain high prestige."

# === PHASE 8: CULTURAL & EDUCATIONAL DEVELOPMENT ===
mission_promote_swedish_culture: "Promote Swedish Culture"
mission_promote_swedish_culture_desc: "Foster a strong national identity through promotion of Swedish language, customs, and traditions."
mission_promote_swedish_culture_tooltip: "Establish Swedish cultural dominance and build cultural infrastructure."

mission_establish_uppsala_university: "Establish Uppsala University"
mission_establish_uppsala_university_desc: "Create a prestigious center of learning to advance knowledge and train future leaders."
mission_establish_uppsala_university_tooltip: "Develop Uppsala with a university and achieve literacy."

mission_promote_nordic_science: "Promote Nordic Science"
mission_promote_nordic_science_desc: "Establish Scandinavia as a center of scientific innovation and technological advancement."
mission_promote_nordic_science_tooltip: "Build multiple universities and achieve high literacy rates."

mission_establish_swedish_academy: "Establish Swedish Academy of Sciences"
mission_establish_swedish_academy_desc: "Create a premier scientific institution to lead European research and innovation."
mission_establish_swedish_academy_tooltip: "Achieve high literacy and cultural tradition with academies."

# === PHASE 9: CONTINENTAL INTERVENTION ===
mission_intervene_in_germany: "Intervene in Germany"
mission_intervene_in_germany_desc: "Project Swedish power into the German states to gain influence, territory, and continental prestige."
mission_intervene_in_germany_tooltip: "Establish a foothold in Germany with high army tradition and prestige."

mission_counter_russian_expansion: "Counter Russian Expansion"
mission_counter_russian_expansion_desc: "Contain Russian westward expansion to protect Swedish interests in the Baltic region."
mission_counter_russian_expansion_tooltip: "Rival Russia and achieve military parity."

mission_secure_ingria: "Secure Ingria"
mission_secure_ingria_desc: "Establish control over the Ingrian territories to secure our eastern frontier and Baltic access."
mission_secure_ingria_tooltip: "Control Ingria region including Saint Petersburg."

# === PHASE 10: SCANDINAVIAN EMPIRE DEVELOPMENT ===
mission_consolidate_scandinavian_empire: "Consolidate Scandinavian Empire"
mission_consolidate_scandinavian_empire_desc: "Strengthen and integrate the Scandinavian realm into a cohesive and powerful empire."
mission_consolidate_scandinavian_empire_tooltip: "As Scandinavia, achieve great power status with strong control."

mission_promote_scandinavian_culture: "Promote Scandinavian Culture"
mission_promote_scandinavian_culture_desc: "Develop a unified Scandinavian cultural identity that transcends individual Nordic traditions."
mission_promote_scandinavian_culture_tooltip: "Promote Swedish culture while accepting other Scandinavian cultures."

mission_develop_scandinavian_economy: "Develop Scandinavian Economy"
mission_develop_scandinavian_economy_desc: "Integrate Nordic economies into a single powerful economic bloc dominating northern Europe."
mission_develop_scandinavian_economy_tooltip: "Achieve high production in key resources and income."

mission_establish_scandinavian_navy: "Establish Scandinavian Navy"
mission_establish_scandinavian_navy_desc: "Create a unified Scandinavian naval force supreme in northern European waters."
mission_establish_scandinavian_navy_tooltip: "Maintain a massive navy with high tradition."

# === PHASE 11: GREAT POWER STATUS ===
mission_swedish_empire: "Swedish Empire"
mission_swedish_empire_desc: "Establish Sweden as a recognized European great power through military might and strategic expansion."
mission_swedish_empire_tooltip: "Achieve great power status with high prestige and development."

mission_scandinavian_hegemony: "Scandinavian Hegemony"
mission_scandinavian_hegemony_desc: "Establish complete Scandinavian dominance over northern Europe as an undisputed hegemon."
mission_scandinavian_hegemony_tooltip: "As Scandinavia, achieve hegemon status with control of northern seas."

# === PHASE 12: FINAL ULTIMATE MISSIONS ===
mission_northern_great_power: "Northern Great Power"
mission_northern_great_power_desc: "Position Sweden/Scandinavia as the preeminent power of northern Europe through comprehensive superiority."
mission_northern_great_power_tooltip: "Achieve hegemon status with military, economic, and cultural supremacy."

mission_scandinavian_golden_age: "Scandinavian Golden Age"
mission_scandinavian_golden_age_desc: "Usher in an era of unprecedented prosperity, cultural flourishing, and political dominance for Scandinavia."
mission_scandinavian_golden_age_tooltip: "As Scandinavia, achieve complete unification with exceptional development."

