# === EVENT LOCALIZATION ===
# Event 1: Securing the Swedish Crown
sweden_mission_events.1.t: "The Swedish Crown Secured"
sweden_mission_events.1.d: "With independence achieved and the monarchy stabilized, Sweden stands ready to chart its own course. The nobility's support is crucial, but the extent of their influence must be carefully managed."
sweden_mission_events.1.a: "Reward Supportive Nobility"
sweden_mission_events.1.b: "Strengthen Royal Authority"
sweden_mission_events.1.a.tt: "Increase noble satisfaction and move toward aristocratic governance"
sweden_mission_events.1.b.tt: "Gain legitimacy and strengthen crown estate power"

# Event 2: Uniting Götaland
sweden_mission_events.2.t: "Götaland United"
sweden_mission_events.2.d: "The integration of Götaland into the Swedish realm is complete. The southern provinces now contribute their resources and manpower to the strength of the unified kingdom. We must decide how best to integrate these new territories."
sweden_mission_events.2.a: "Focus on Economic Integration"
sweden_mission_events.2.b: "Focus on Cultural Integration"
sweden_mission_events.2.a.tt: "Develop Götaland economically with prosperity and development bonuses"
sweden_mission_events.2.b.tt: "Strengthen Swedish cultural tradition and accelerate integration"

# Event 3: Developing Stockholm
sweden_mission_events.3.t: "Stockholm Developed"
sweden_mission_events.3.d: "Our capital has flourished into a true royal city. Stockholm's markets bustle with trade, its buildings reflect our growing wealth, and its strategic position on the Baltic makes it a natural hub for commerce and administration."
sweden_mission_events.3.a: "Develop as Trade Hub"
sweden_mission_events.3.b: "Develop as Cultural Capital"
sweden_mission_events.3.a.tt: "Increase Stockholm's development and prosperity with trade power"
sweden_mission_events.3.b.tt: "Develop cultural infrastructure and gain research progress"

# Event 4: Implementing Indelta System
sweden_mission_events.4.t: "The Indelta System"
sweden_mission_events.4.d: "The Indelta system has been successfully implemented, providing us with a reliable source of trained soldiers. Each regiment is now supported by specific farms, ensuring a steady flow of manpower. We must decide the emphasis of our military development."
sweden_mission_events.4.a: "Quality Focus - Professional Soldiers"
sweden_mission_events.4.b: "Quantity Focus - Mass Conscription"
sweden_mission_events.4.a.tt: "Gain army tradition and move toward quality-focused military"
sweden_mission_events.4.b.tt: "Gain substantial manpower and peasant satisfaction"

# Event 5: Establishing Caroleans
sweden_mission_events.5.t: "The Caroleans Established"
sweden_mission_events.5.d: "The elite Carolean army now stands ready as the pride of Swedish military might. These professional soldiers, trained in innovative tactics and fierce discipline, will strike fear into our enemies across Europe."
sweden_mission_events.5.a: "Recruit Elite Commander"
sweden_mission_events.5.b: "Recruit Elite Units"
sweden_mission_events.5.a.tt: "Gain a skilled Carolean commander character"
sweden_mission_events.5.b.tt: "Gain Carolean units, army tradition, and prestige"

# Event 6: Developing Shipbuilding Industry
sweden_mission_events.6.t: "Shipbuilding Industry Developed"
sweden_mission_events.6.d: "Our shipbuilding capabilities have advanced dramatically, with new techniques and infrastructure making Swedish ships among the finest in Europe. Our naval power grows with each vessel launched from our yards."
sweden_mission_events.6.a: "Develop Naval Infrastructure"
sweden_mission_events.6.b: "Focus on Crew Training"
sweden_mission_events.6.a.tt: "Build wharves in coastal locations"
sweden_mission_events.6.b.tt: "Gain navy tradition, sailors, and move toward naval focus"

# Event 7: Securing Skåne
sweden_mission_events.7.t: "Skåne Secured"
sweden_mission_events.7.d: "The fertile provinces of Skåne are now firmly under Swedish control. This strategic region controls the Øresund strait and provides valuable agricultural land. We must decide how to secure and integrate this new territory."
sweden_mission_events.7.a: "Fortify the Border"
sweden_mission_events.7.b: "Cultural Integration"
sweden_mission_events.7.a.tt: "Fortify Malmö and gain army tradition"
sweden_mission_events.7.b.tt: "Accelerate integration and cultural conversion in Skåne"

# Event 8: Subjugating Norway
sweden_mission_events.8.t: "Norway Subjugated"
sweden_mission_events.8.d: "Norway now answers to the Swedish crown. This gives us control of valuable Atlantic ports, timber resources, and strategic territory. The integration of this new subject requires careful planning."
sweden_mission_events.8.a: "Union Focus"
sweden_mission_events.8.b: "Resource Extraction Focus"
sweden_mission_events.8.a.tt: "Develop Kalmar and improve subject relations"
sweden_mission_events.8.b.tt: "Develop timber resources and gain economic benefits"

# Event 9: Breaking the Kalmar Union
sweden_mission_events.9.t: "Kalmar Union Broken"
sweden_mission_events.9.d: "The Danish-dominated Kalmar Union has been shattered, and Swedish leadership of Scandinavia is now established. This historic shift changes the balance of power in Northern Europe and opens new opportunities for Swedish expansion."
sweden_mission_events.9.a: "Assert Swedish Hegemony"
sweden_mission_events.9.b: "Diplomatic Settlement"
sweden_mission_events.9.a.tt: "Gain prestige, legitimacy, and move toward centralization"
sweden_mission_events.9.b.tt: "Gain diplomatic reputation and improve relations with neighbors"

# Event 10: Securing Finland
sweden_mission_events.10.t: "Finland Secured"
sweden_mission_events.10.d: "Complete control over Finland has been established, providing Sweden with a secure eastern frontier and valuable resources. This vast territory requires development and fortification against potential threats from the east."
sweden_mission_events.10.a: "Military Frontier Focus"
sweden_mission_events.10.b: "Economic Development Focus"
sweden_mission_events.10.a.tt: "Gain manpower and build fortifications in Finland"
sweden_mission_events.10.b.tt: "Develop timber resources and gain economic benefits"

# Event 11: Developing Mining Industry
sweden_mission_events.11.t: "Mining Industry Boom"
sweden_mission_events.11.d: "Swedish mining operations have expanded dramatically, with new techniques and infrastructure making our copper and iron production the envy of Europe. The wealth from these resources flows into our treasury, funding our ambitions."
sweden_mission_events.11.a: "Copper Mining Focus"
sweden_mission_events.11.b: "Iron Mining Focus"
sweden_mission_events.11.a.tt: "Develop copper mines with prosperity and building bonuses"
sweden_mission_events.11.b.tt: "Increase iron production capacity and burgher satisfaction"

# Event 12: Embracing the Reformation
sweden_mission_events.12.t: "The Swedish Reformation"
sweden_mission_events.12.d: "Sweden has officially embraced Protestantism, breaking with Rome and establishing a national church. This religious transformation has profound implications for our state, society, and international relations."
sweden_mission_events.12.a: "Lutheran State Church"
sweden_mission_events.12.b: "Reformed Church Focus"
sweden_mission_events.12.a.tt: "Adopt Lutheranism with stability and legitimacy bonuses"
sweden_mission_events.12.b.tt: "Adopt Reformed faith with research and burgher benefits"

# Event 13: Securing Finland (from mission)
sweden_mission_events.13.t: "Finnish Territories Consolidated"
sweden_mission_events.13.d: "Our control over Finland is now complete and secure. The eastern frontier is fortified, and Finnish resources are fully integrated into the Swedish economy. This vast territory provides both defensive depth and economic opportunity."

# Event 14: Dominating Baltic Sea
sweden_mission_events.14.t: "Baltic Sea Dominated"
sweden_mission_events.14.d: "The Baltic Sea is now effectively a Swedish lake. Our fleets patrol these waters unchallenged, our ports dominate regional trade, and our naval supremacy secures our northern borders for generations to come."

# Event 15: Developing Mining Industry (from mission)
sweden_mission_events.15.t: "Mining Industry Expanded"
sweden_mission_events.15.d: "Swedish mining has reached industrial scale, with deep mines and advanced smelting techniques producing unprecedented quantities of copper and iron. This mineral wealth forms the foundation of our economic power."

# Event 16: Establishing Baltic Trade League
sweden_mission_events.16.t: "Baltic Trade League Established"
sweden_mission_events.16.d: "The Swedish-dominated Baltic Trade League now controls commerce throughout the region. Merchants from across Northern Europe must now deal through our ports, bringing immense wealth to the Swedish treasury."

# Event 17: Embracing Reformation (from mission)
sweden_mission_events.17.t: "Reformation Fully Embraced"
sweden_mission_events.17.d: "The Lutheran faith is now firmly established throughout Sweden. The Church of Sweden operates independently from Rome, strengthening royal authority and creating a distinct Swedish religious identity."

# Event 18: Protestant Leadership
sweden_mission_events.18.t: "Protestant Leadership Assumed"
sweden_mission_events.18.d: "Sweden has emerged as the leading defender of the Protestant cause in Europe. Other reformed nations look to us for guidance, protection, and leadership against Catholic powers."

# Event 19: Establishing Uppsala University
sweden_mission_events.19.t: "Uppsala University Founded"
sweden_mission_events.19.d: "The University of Uppsala has been established as a center of learning and scholarship. This institution will train future generations of Swedish leaders, scientists, and theologians, spreading knowledge throughout our realm."

# Event 20: Promoting Nordic Science
sweden_mission_events.20.t: "Nordic Scientific Advancement"
sweden_mission_events.20.d: "Swedish and Scandinavian science has advanced to the forefront of European knowledge. Our researchers make breakthroughs in multiple fields, giving us technological advantages over our rivals."

# Event 21: Intervening in Germany
sweden_mission_events.21.t: "Intervention in Germany"
sweden_mission_events.21.d: "Our armies have marched into Germany, establishing a Swedish presence in the heart of Europe. This intervention brings opportunities for expansion but also risks entanglement in complex continental conflicts."

# Event 22: Consolidating Scandinavian Empire
sweden_mission_events.22.t: "Scandinavian Empire Consolidated"
sweden_mission_events.22.d: "The Scandinavian realm has been fully integrated and strengthened. Our united kingdom stands as a major European power, with coordinated policies, shared defense, and integrated economies."

# Event 23: Developing Scandinavian Economy
sweden_mission_events.23.t: "Scandinavian Economic Union"
sweden_mission_events.23.d: "The Nordic economies have been integrated into a single powerful bloc. Swedish industry, Norwegian shipping, and Danish trade combine to create an economic powerhouse dominating northern Europe."

# Event 24: Swedish Empire Achievement
sweden_mission_events.24.t: "The Swedish Empire"
sweden_mission_events.24.d: "Sweden has risen from a regional power to a true empire. Our territories span the Baltic, our armies are feared, our navy commands northern waters, and our influence extends across Europe. We stand among the great powers of the continent."

# Event 25: Scandinavian Hegemony
sweden_mission_events.25.t: "Scandinavian Hegemony"
sweden_mission_events.25.d: "Scandinavia now stands as the undisputed hegemon of northern Europe. Our control of the Baltic and North Seas, our unified military might, and our economic dominance establish our preeminence in the region."

# Event 26: Northern Great Power
sweden_mission_events.26.t: "Northern Great Power"
sweden_mission_events.26.d: "Sweden/Scandinavia has achieved comprehensive superiority as the preeminent power of northern Europe. Our military, economic, cultural, and diplomatic dominance is recognized across the continent."

# Event 27: Scandinavian Golden Age
sweden_mission_events.27.t: "Scandinavian Golden Age"
sweden_mission_events.27.d: "An unprecedented era of prosperity, cultural flourishing, and political dominance has begun for Scandinavia. Our united realm enjoys peace, wealth, and influence unmatched in our history, with achievements in every field that will be remembered for generations."

