 # Mission Descriptions
 mission_secure_the_throne_desc: "Our throne must be secured and our rule legitimized before we can embark on greater ambitions. A stable monarchy is the foundation of a great empire."
 mission_complete_portuguese_reconquista_desc: "The Reconquista defined our nation's birth. Now we must complete the task by securing all Portuguese lands and driving out any remaining Moorish influence."
 mission_consolidate_the_kingdom_desc: "With our territory secured, we must now consolidate our rule, strengthen our administration, and ensure Portuguese culture dominates throughout our realm."
 mission_develop_portuguese_navy_desc: "Our future lies across the seas. We must build a powerful navy that can protect our shores, project our power, and carry our explorers to distant lands."
 mission_establish_sagres_school_desc: "Under the patronage of Prince Henry, we shall establish a center of navigation and cartography at Sagres to advance our maritime knowledge and exploration capabilities."
 mission_discover_madeira_desc: "The Atlantic holds many secrets. Let us dispatch expeditions to discover and claim the Madeira archipelago, our first stepping stone into the open ocean."
 mission_discover_azores_desc: "Further into the Atlantic lie the Azores islands. Their discovery will extend our reach and provide vital bases for future exploration and trade."
 mission_conquer_ceuta_desc: "The strategic city of Ceuta in North Africa will serve as our gateway to the Mediterranean and our first foothold on the African continent."
 mission_establish_west_african_trade_desc: "The West African coast holds great wealth in gold and trade opportunities. Let us establish trading posts and secure this lucrative commerce."
 mission_control_gold_coast_desc: "The Gold Coast is the heart of African trade. By establishing firm control here, we can dominate the flow of gold and other precious commodities."
 mission_round_the_cape_desc: "The route around Africa to the Indian Ocean represents the greatest maritime challenge of our age. Success will open the sea road to the riches of Asia."
 mission_establish_goa_desc: "India's wealth in spices, textiles, and gems is legendary. Establishing a stronghold at Goa will give us access to these treasures and a base for Asian operations."
 mission_control_spice_trade_desc: "The spice trade from the East Indies is the most valuable commerce in the world. We must secure dominance over these precious commodities."
 mission_establish_macau_desc: "China represents the ultimate prize in Eastern trade. Establishing a settlement at Macau will give us access to the vast Chinese market and its luxury goods."
 mission_discover_brazil_desc: "Reports suggest a vast land lies across the southern Atlantic. Discovering and claiming this territory could provide immense resources and strategic advantage."
 mission_colonize_brazil_desc: "The land of Brazil offers boundless opportunities for colonization, resource extraction, and the establishment of a New World Portuguese domain."
 mission_develop_brazilian_trade_desc: "Brazil's resources - especially brazilwood, sugar, and eventually gold - can fuel our economy for generations. We must develop this trade to its full potential."
 mission_build_global_empire_desc: "From Lisbon to Goa, from Brazil to Macau, our empire spans the globe. Now we must consolidate our holdings and ensure Portuguese dominance worldwide."
 mission_portuguese_golden_age_desc: "Our empire stands at its zenith, with wealth flowing from every corner of the world. This is Portugal's Golden Age, a time of unprecedented prosperity and power."
 
