 # Event Descriptions
 portugal_mission_events.1.d: "The throne is secure, but how shall we consolidate our power and ensure stable rule for generations to come?"
 portugal_mission_events.2.d: "The Reconquista is complete! Our territory is secured, but the methods we employed have shaped our military and diplomatic character."
 portugal_mission_events.3.d: "Our navy grows stronger, but we face choices about its future development and the direction of our maritime ambitions."
 portugal_mission_events.4.d: "The Sagres School attracts the finest navigators and cartographers of our age. Their work will shape Portugal's future across the seas."
 portugal_mission_events.5.d: "Madeira has been discovered! This lush archipelago offers both strategic position and agricultural potential. How shall we develop it?"
 portugal_mission_events.6.d: "Ceuta is ours! This strategic city gives us a foothold in Africa, but also brings new responsibilities and opportunities."
 portugal_mission_events.7.d: "West African trade routes are opening before us, offering gold, ivory, and other precious commodities. How shall we approach this new commerce?"
 portugal_mission_events.8.d: "Our ships have rounded the Cape of Good Hope! The sea route to India is open, but navigating these new waters presents challenges."
 portugal_mission_events.9.d: "Goa is established as our Indian headquarters. This rich territory offers immense wealth but requires careful administration."
 portugal_mission_events.10.d: "A vast new land has been discovered across the Atlantic! Brazil offers untold resources and colonization opportunities."
 portugal_mission_events.11.d: "Our empire spans the globe, with possessions on four continents. The management of this vast domain requires strategic decisions."
 
