l_english:

# ========== MISSION PACK ==========

portugal_mission_pack: "Portuguese Maritime Empire"
portugal_mission_pack_desc: "Lead Portugal to become a global maritime power through exploration, trade, and colonization."

# ========== MISSION TITLES AND DESCRIPTIONS ==========

mission_secure_portuguese_borders: "Secure Portuguese Borders"
mission_secure_portuguese_borders_desc: "Consolidate control over Portuguese territory and establish a stable foundation for future expansion."

mission_develop_lisbon: "Develop Lisbon"
mission_develop_lisbon_desc: "Transform Lisbon into a major commercial hub and strengthen our economic base."

mission_strengthen_monarchy: "Strengthen the Monarchy"
mission_strengthen_monarchy_desc: "Consolidate royal power and establish the Avis dynasty as the legitimate rulers of Portugal."

mission_build_portuguese_navy: "Build the Portuguese Navy"
mission_build_portuguese_navy_desc: "Construct a powerful navy capable of projecting Portuguese power across the seas."

mission_explore_african_coast: "Explore the African Coast"
mission_explore_african_coast_desc: "Venture south along the African coast, discovering new lands and trade opportunities."

mission_establish_trading_posts: "Establish Trading Posts"
mission_establish_trading_posts_desc: "Create a network of trading posts along the African coast to control valuable trade routes."

mission_ceuta_expedition: "Expedition to Ceuta"
mission_ceuta_expedition_desc: "Launch a military expedition to capture the strategic Moroccan city of Ceuta."

mission_secure_moroccan_coast: "Secure the Moroccan Coast"
mission_secure_moroccan_coast_desc: "Establish Portuguese control over key positions along the North African coast."

mission_discover_azores: "Discover the Azores"
mission_discover_azores_desc: "Explore and claim the Atlantic islands, establishing bases for future exploration."

mission_colonize_madeira: "Colonize Madeira"
mission_colonize_madeira_desc: "Establish permanent settlements on the Atlantic islands to support our maritime empire."

mission_develop_port_wine: "Develop Port Wine Production"
mission_develop_port_wine_desc: "Expand wine production in the Douro Valley, creating a valuable export commodity."

mission_establish_fishing_industry: "Establish Fishing Industry"
mission_establish_fishing_industry_desc: "Develop Portugal's fishing industry to support population growth and trade."

mission_english_alliance: "Forge English Alliance"
mission_english_alliance_desc: "Secure a lasting alliance with England to counter Castilian influence."

mission_counter_castilian_influence: "Counter Castilian Influence"
mission_counter_castilian_influence_desc: "Assert Portuguese independence and resist domination by our Iberian neighbors."

mission_route_to_indies: "Find the Route to the Indies"
mission_route_to_indies_desc: "Discover a sea route to India, bypassing traditional overland trade routes."

mission_portuguese_empire: "Establish Portuguese Global Empire"
mission_portuguese_empire_desc: "Create a worldwide empire spanning multiple continents through exploration and colonization."

# ========== EVENT TITLES AND DESCRIPTIONS ==========

portugal_mission_events.1.t: "Consolidating Portuguese Power"
portugal_mission_events.1.d: "With our borders secured, we must decide how to focus our development efforts. Should we invest in infrastructure and economic growth, or strengthen our military capabilities?"

portugal_mission_events.2.t: "The Age of Exploration"
portugal_mission_events.2.d: "Our ships have begun exploring the African coast. How should we approach this new era of discovery? Should we focus on pure exploration and mapping, or prioritize establishing trade networks?"

portugal_mission_events.3.t: "Atlantic Discoveries"
portugal_mission_events.3.d: "The discovery of Atlantic islands opens new possibilities. Should we focus on establishing agricultural settlements, or develop these islands as naval bases for future exploration?"

portugal_mission_events.10.t: "The Moroccan Campaign"
portugal_mission_events.10.d: "Our expedition to North Africa has succeeded. How should we approach our presence in Morocco? Should we embrace crusading zeal against the Moors, or focus on strategic fortifications?"

portugal_mission_events.11.t: "The Route to India"
portugal_mission_events.11.d: "We have discovered the sea route to India! This monumental achievement opens incredible opportunities. Should we focus on establishing a spice trade monopoly, or build naval supremacy to protect our new route?"

portugal_mission_events.12.t: "A Global Empire"
portugal_mission_events.12.d: "Portugal now spans multiple continents. How should we govern our global empire? Should we establish strong imperial administration, or focus on maintaining our global trade network?"

# ========== EVENT OPTIONS ==========

portugal_mission_events.1.a: "Focus on Infrastructure"
portugal_mission_events.1.b: "Strengthen Military"

portugal_mission_events.2.a: "Exploration Focus"
portugal_mission_events.2.b: "Trade Focus"

portugal_mission_events.3.a: "Agricultural Settlement"
portugal_mission_events.3.b: "Naval Bases"

portugal_mission_events.10.a: "Crusading Zeal"
portugal_mission_events.10.b: "Strategic Fortifications"

portugal_mission_events.11.a: "Spice Trade Monopoly"
portugal_mission_events.11.b: "Naval Supremacy"

portugal_mission_events.12.a: "Imperial Administration"
portugal_mission_events.12.b: "Global Trade Network"

