# === MISSING EVENT LOCALIZATION ===
polish_mission_events.1.t:0 "Consolidation of the Polish Heartland"
polish_mission_events.1.d:0 "While the heart of Poland is not yet unified, we enjoy a moment of stability. But this moment of stability is merely a foundation. Great potential lies within these lands, but the coming centuries will test our strength—military, diplomatic, and economic. We must prepare for the challenges of expansion and securing our future position."
polish_mission_events.1.a:0 "Begin laying the economic groundwork for our future greatness."
polish_mission_events.1.b:0 "Focus on strengthening the Crown and balancing the influential Estates."

polish_mission_events.2.t:0 "Development of Kraków"
polish_mission_events.2.d:0 "Our capital city of Kraków has flourished under royal patronage. The burghers have invested heavily in the city's infrastructure, and scholars from across Europe are drawn to our growing cultural centers. How shall we continue Kraków's development?"
polish_mission_events.2.a:0 "Invest in Urban Development"
polish_mission_events.2.b:0 "Promote Cultural Excellence"

polish_mission_events.3.t:0 "Strengthening the Szlachta"
polish_mission_events.3.d:0 "The Polish nobility have proven instrumental in our recent successes. Their military service and political support have strengthened the crown, but they now seek greater privileges in return. How should we manage our relationship with the szlachta?"
polish_mission_events.3.a:0 "We can not grant them to much power!"
polish_mission_events.3.b:0 "Expand Noble Privileges"

polish_mission_events.4.t:0 "Securing Silesia"
polish_mission_events.4.d:0 "The rich lands of Silesia are now firmly under Polish control. The region's mines and fertile fields will significantly boost our economy, while its population provides valuable manpower. How shall we integrate these new territories?"
polish_mission_events.4.a:0 "Focus on Integration"
polish_mission_events.4.b:0 "Promote Economic Development"

polish_mission_events.7.t:0 "Baltic Trade Expansion"
polish_mission_events.7.d:0 "Our access to the Baltic Sea has opened new trade opportunities. Merchants from across Europe seek Polish grain, timber, and other goods. How should we develop our Baltic trade networks?"
polish_mission_events.7.a:0 "Expand Trade Networks"
polish_mission_events.7.b:0 "Develop Port Infrastructure"

polish_mission_events.9.t:0 "Securing the Eastern Marches"
polish_mission_events.9.d:0 "Our eastern territories in Volhynia have been secured, providing a buffer against eastern threats. These lands offer ample manpower and strategic defensive positions. How shall we manage our new eastern frontier?"
polish_mission_events.9.a:0 "Secure the Marches"
polish_mission_events.9.b:0 "Strengthen Border Defenses"

polish_mission_events.11.t:0 "Multicultural Integration"
polish_mission_events.11.d:0 "The integration of diverse cultures within our borders presents both challenges and opportunities. The Ruthenian people bring valuable traditions and skills, but their assimilation requires careful management. What approach should we take?"
polish_mission_events.11.a:0 "Promote Multicultural Harmony"
polish_mission_events.11.b:0 "Encourage Religious Tolerance"

polish_mission_events.13.t:0 "Jagiellonian Dynastic Ties"
polish_mission_events.13.d:0 "The marriage between our royal houses has created powerful dynastic bonds with Lithuania. This union strengthens both our legitimacy and our international standing. How shall we leverage these new family connections?"
polish_mission_events.13.a:0 "Strengthen Dynastic Claims"
polish_mission_events.13.b:0 "Enhance Military Alliance"

polish_mission_events.14.t:0 "Forging the Commonwealth"
polish_mission_events.14.d:0 "The Union of Lublin stands ready to be finalized, creating the Polish-Lithuanian Commonwealth. This historic union will create one of Europe's largest and most powerful states. How shall we structure this new political entity?"
polish_mission_events.14.a:0 "Establish the Commonwealth"
polish_mission_events.14.b:0 "Strengthen the Military Union"

polish_mission_events.15.t:0 "Agricultural Development"
polish_mission_events.15.d:0 "Poland's fertile lands have the potential to become Europe's breadbasket. With proper investment and innovation, our agricultural output could feed nations. How should we develop our rural economy?"
polish_mission_events.15.a:0 "Focus on Agricultural Growth"
polish_mission_events.15.b:0 "Invest in Rural Development"

polish_mission_events.16.t:0 "Grain Trade Dominance"
polish_mission_events.16.d:0 "Our grain exports have made us essential to European food supplies. Control of this trade brings immense wealth and influence. How should we manage our growing grain trade empire?"
polish_mission_events.16.a:0 "Expand Trade Networks"
polish_mission_events.16.b:0 "Develop Trade Infrastructure"

polish_mission_events.17.t:0 "Baltic Marine Development"
polish_mission_events.17.d:0 "Our Baltic ports have become vital hubs for European trade. With proper investment, we could dominate Baltic commerce and project naval power throughout the region. How shall we develop our maritime capabilities?"
polish_mission_events.17.a:0 "Develop Naval Power"
polish_mission_events.17.b:0 "Expand Port Facilities"

polish_mission_events.21.t:0 "Army Reform Progress"
polish_mission_events.21.d:0 "Our military reforms are showing promising results. The army is becoming more professional and effective, though further changes are needed to maintain our edge against emerging threats. How should we continue our military modernization?"
polish_mission_events.21.a:0 "Continue Army Reforms"
polish_mission_events.21.b:0 "Focus on Modernization"

polish_mission_events.22.t:0 "Eastern Fortification Network"
polish_mission_events.22.d:0 "The construction of fortifications along our eastern border is underway. These defenses will protect our heartland from invasion and make any attacker pay dearly for every mile advanced. How should we complete our defensive network?"
polish_mission_events.22.a:0 "Build Fortification Network"
polish_mission_events.22.b:0 "Implement Border Defense System"

polish_mission_events.23.t:0 "Artillery Development"
polish_mission_events.23.d:0 "Modern artillery is becoming increasingly important on the battlefield. Our foundries have the capability to produce powerful cannons that could give us a decisive advantage in sieges and field battles. How should we develop our artillery capabilities?"
polish_mission_events.23.a:0 "Develop Artillery Technology"
polish_mission_events.23.b:0 "Create Modern Artillery Corps"

polish_mission_events.24.t:0 "Cultural Promotion"
polish_mission_events.24.d:0 "Polish culture is flourishing, with artists, writers, and scholars producing works that rival those of any European nation. Royal patronage could elevate our cultural achievements to unprecedented heights. How should we support our cultural development?"
polish_mission_events.24.a:0 "Promote Cultural Excellence"
polish_mission_events.24.b:0 "Strengthen National Identity"

polish_mission_events.25.t:0 "Academic Excellence"
polish_mission_events.25.d:0 "Our universities are attracting scholars from across Europe, and Polish thinkers are making significant contributions to science and philosophy. With proper support, we could create centers of learning that shape European thought for generations. How should we advance our academic institutions?"
polish_mission_events.25.a:0 "Achieve Academic Excellence"
polish_mission_events.25.b:0 "Implement Educational Reforms"

polish_mission_events.26.t:0 "Defender of the Faith"
polish_mission_events.26.d:0 "As the Catholic faith faces challenges from the Reformation and eastern religions, Poland stands as a bastion of traditional Christianity. Our defense of the faith earns us the Pope's favor and divine blessing for our endeavors. How should we position ourselves in religious matters?"
polish_mission_events.26.a:0 "Become Defender of the Faith"
polish_mission_events.26.b:0 "Inspire Religious Fervor"

polish_mission_events.40.t:0 "Balancing Szlachta Power"
polish_mission_events.40.d:0 "The nobility's growing influence requires careful management to maintain royal authority while keeping the szlachta satisfied. Their support is crucial for governance, but their demands increasingly constrain the crown's power. How should we handle this delicate balance?"
polish_mission_events.40.a:0 "Maintain Careful Balance"
polish_mission_events.40.b:0 "Accept Some Noble Demands"

polish_mission_events.41.t:0 "Burgher Estate Management"
polish_mission_events.41.d:0 "The merchant class seeks greater privileges and trade concessions. Their wealth fuels our economy, but their demands often conflict with noble interests. How should we manage the burghers' growing influence?"
polish_mission_events.41.a:0 "Balance Burgher Interests"
polish_mission_events.41.b:0 "Grant Trade Concessions"

polish_mission_events.42.t:0 "Peasant Estate Concerns"
polish_mission_events.42.d:0 "The peasantry, while having little political power, forms the backbone of our agricultural economy. Their productivity could be improved with better conditions, but such reforms might anger the nobility. How should we address rural concerns?"
polish_mission_events.42.a:0 "Improve Peasant Conditions"
polish_mission_events.42.b:0 "Focus on Manpower Needs"

polish_mission_events.43.t:0 "Estate Balance Achieved"
polish_mission_events.43.d:0 "Through careful management, we have achieved a stable balance between the competing interests of our various estates. This equilibrium promotes efficient governance and reduces internal conflicts. How should we consolidate this achievement?"
polish_mission_events.43.a:0 "Consolidate Estate Balance"
polish_mission_events.43.b:0 "Strengthen Noble Privileges"

polish_mission_events.46.t:0 "Rural Development Boom"
polish_mission_events.46.d:0 "Investment in our agricultural heartland is paying remarkable dividends. New farming techniques, improved infrastructure, and better rural conditions are transforming the countryside. How should we continue our rural development efforts?"
polish_mission_events.46.a:0 "Promote Rural Prosperity"
polish_mission_events.46.b:0 "Focus on Agricultural Innovation"

# === NEW EVENT LOCALIZATION ===
polish_mission_events.51.t:0 "Expanding Kraków's Influence"
polish_mission_events.51.d:0 "Kraków has grown beyond a mere capital - it has become a beacon of Polish culture and learning that attracts scholars, artists, and merchants from across Europe. The city's influence now extends throughout the region, shaping Polish identity and serving as a model for urban development."
polish_mission_events.51.a:0 "Establish Regional Cultural Center"

polish_mission_events.52.t:0 "Establishing Baltic Naval Presence"  
polish_mission_events.52.d:0 "Our Baltic ports now host a formidable Polish navy, capable of projecting power across the sea and protecting our vital trade routes. The establishment of proper naval bases ensures that our merchant marine can operate safely while our warships can respond to any threats to Polish interests in the region."
polish_mission_events.52.a:0 "Build Naval Infrastructure"

polish_mission_events.53.t:0 "Securing the Cossack Frontier"
polish_mission_events.53.d:0 "The eastern frontier has been secured through cooperation with the Cossack hosts. These fierce warriors now serve as our first line of defense against eastern threats, while their unique military traditions enrich our own. The frontier is no longer a vulnerability but a source of strength."
polish_mission_events.53.a:0 "Integrate Cossack Defenses"

polish_mission_events.54.t:0 "Developing the Vistula Trade Network"
polish_mission_events.54.d:0 "The Vistula River has been transformed into Poland's economic backbone, with improved ports, warehouses, and trade infrastructure along its length. Grain, timber, and other goods flow efficiently from the heartland to our Baltic ports, making this waterway the lifeblood of our economy."
polish_mission_events.54.a:0 "Expand River Trade"

polish_mission_events.55.t:0 "Promoting Sarmatism"
polish_mission_events.55.d:0 "The Sarmatian ideal has taken root among the Polish nobility, blending eastern and western influences into a unique cultural identity. This ideology emphasizes the szlachta's ancient origins and special role in defending Polish liberty, creating a powerful unifying myth that strengthens noble cohesion and national pride."
polish_mission_events.55.a:0 "Embrace Sarmatian Culture"

polish_mission_events.56.t:0 "Consolidating Golden Liberty"
polish_mission_events.56.d:0 "The system of Golden Liberty is now fully established, with the nobility's privileges firmly enshrined in law. The liberum veto, free election of monarchs, and other noble rights create a unique political system that balances royal authority with aristocratic freedom. This represents the culmination of Polish political development."
polish_mission_events.56.a:0 "Complete the Golden Liberty System"

polish_mission_events.901.t:0 "A Call to Defend the Faith"
polish_mission_events.901.d:0 "The clergy reminds the king of his oath once the fires of heresy burn close, Poland must answer. As our banners rise against a Protestant foe, the realm rallies with renewed zeal."
polish_mission_events.901.a:0 "Stand firm."


