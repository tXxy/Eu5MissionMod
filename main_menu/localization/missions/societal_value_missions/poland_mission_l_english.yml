# === GOLDEN AGE FINAL STRINGS ===
polish_golden_age_final_t:0 "The Zenith of the Commonwealth"
polish_golden_age_final_d:0 "History will remember this era as the time when Poland stood as the beacon of civilization. Our granaries feed the continent, our laws are studied in foreign courts, and our winged hussars are the envy of every monarch."

