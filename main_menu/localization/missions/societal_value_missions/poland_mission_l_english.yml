# === EVENT LOCALIZATION ===
polish_mission_events.5.t:0 "Challenge to Bohemian Authority"
polish_mission_events.5.d:0 "Our successful assertion of Polish claims in Silesia has sent shockwaves through Central Europe. The Bohemian crown is weakened, and other powers are taking notice of Poland's growing influence. How shall we capitalize on this diplomatic victory?"
polish_mission_events.5.a:0 "Pursue Further Ambitions"
polish_mission_events.5.b:0 "Consolidate Our Gains"

polish_mission_events.6.t:0 "The Jagiellonian Marriage"
polish_mission_events.6.d:0 "The union between our royal house and the Lithuanian ruling family has been finalized. This marriage not only strengthens our alliance but potentially paves the way for a permanent union between our nations. How shall we approach this new relationship?"
polish_mission_events.6.a:0 "Embrace Dynastic Union"
polish_mission_events.6.b:0 "Strengthen the Alliance"

polish_mission_events.8.t:0 "Rivalry with the Emperor"
polish_mission_events.8.d:0 "Poland's growing power has positioned us as a direct challenger to Imperial authority in Central Europe. The Emperor views our expansion with suspicion, while smaller German states look to us for protection. How should we manage this delicate situation?"
polish_mission_events.8.a:0 "Assert Our Independence"
polish_mission_events.8.b:0 "Pursue Diplomatic Maneuvers"

polish_mission_events.10.t:0 "Integration of Red Ruthenia"
polish_mission_events.10.d:0 "The Ruthenian lands have been brought under Polish control, but their integration presents both challenges and opportunities. The local nobility seeks to preserve their traditions, while our administrators push for full assimilation. What approach should we take?"
polish_mission_events.10.a:0 "Implement Integration Policies"
polish_mission_events.10.b:0 "Accommodate Local Traditions"

polish_mission_events.12.t:0 "The Commonwealth is Born"
polish_mission_events.12.d:0 "The Union of Lublin has been signed, creating the Polish-Lithuanian Commonwealth - one of the largest and most diverse states in Europe. This historic moment marks the culmination of years of diplomatic effort. How shall we shape this new union?"
polish_mission_events.12.a:0 "Establish Strong Central Authority"
polish_mission_events.12.b:0 "Strengthen Military Cooperation"

polish_mission_events.20.t:0 "The Winged Hussars Arrive"
polish_mission_events.20.d:0 "The first regiments of Winged Hussars have completed their training. These elite heavy cavalry, with their distinctive wings and unmatched prowess, are ready to take the field. Their creation marks a new era in Polish military history. How shall we deploy this formidable force?"
polish_mission_events.20.a:0 "Create Elite Regiments"
polish_mission_events.20.b:0 "Establish Hussar Traditions"

polish_mission_events.30.t:0 "Dominance in Eastern Europe"
polish_mission_events.30.d:0 "From the Baltic to the Black Sea, Polish influence now stretches across Eastern Europe. Our armies are feared, our diplomacy respected, and our culture admired. We have achieved what many thought impossible. How shall we manage our newfound hegemony?"
polish_mission_events.30.a:0 "Focus on Regional Leadership"
polish_mission_events.30.b:0 "Strengthen Military Supremacy"

polish_mission_events.35.t:0 "Champion of the Counter-Reformation"
polish_mission_events.35.d:0 "Poland has emerged as the leading defender of Catholicism in Eastern Europe. Our missionaries work tirelessly, and our support for the Church has earned us the Pope's favor. How should we continue our religious campaign?"
polish_mission_events.35.a:0 "Intensify Religious Zeal"
polish_mission_events.35.b:0 "Promote Religious Unity"

polish_mission_events.45.t:0 "The Liberum Veto"
polish_mission_events.45.d:0 "The Sejm has formally established the liberum veto, giving any single noble the power to block legislation. This unprecedented privilege for the szlachta fundamentally changes how our Commonwealth is governed. What consequences will this have for our state?"
polish_mission_events.45.a:0 "Embrace Noble Privileges"
polish_mission_events.45.b:0 "Expand Noble Power Further"

polish_mission_events.50.t:0 "The Polish Golden Age"
polish_mission_events.50.d:0 "We stand at the zenith of Polish power and prosperity. Our cities flourish with artistic and scientific achievement, our fields produce abundant harvests, and our armies are unmatched. This is truly Poland's golden age. How shall we ensure this era endures?"
polish_mission_events.50.a:0 "Invest in Cultural Legacy"
polish_mission_events.50.b:0 "Focus on Economic Prosperity"

# Mission requirement tooltips
mission_consolidate_polish_heartland_trigger:0 "We must control at least 95% of both Lesser Poland and Greater Poland areas"
mission_develop_krakow_trigger:0 "Our capital needs 35 development, 25 building levels, and a marketplace"
mission_secure_silesia_trigger:0 "We need to control 80% of Silesia and have 30 army tradition"
mission_form_polish_lithuanian_commonwealth_trigger:0 "Lithuania must be our subject or in personal union, with high prestige and legitimacy"
mission_establish_winged_hussars_trigger:0 "We need strong military tradition, Eastern technology, stables, and noble support"

# Mission completion tooltips
mission_consolidate_polish_heartland_completion:0 "Control strengthened across Polish heartland"
mission_develop_krakow_completion:0 "Kraków has become a major cultural and economic center"
mission_secure_silesia_completion:0 "Silesian resources now fuel Polish growth"
mission_form_polish_lithuanian_commonwealth_completion:0 "The Commonwealth stands as a European power"
mission_establish_winged_hussars_completion:0 "Winged Hussars now dominate the battlefield"