l_english:

# ========== MISSION PACK ==========
yuan_mission_pack:0 "Great Yuan: Mongol Restoration"
yuan_mission_pack_desc:0 "Restore the glory of the Mongol Empire under the Yuan Dynasty, blending steppe traditions with Chinese administration to create the largest land empire in history."
yuan_mission_pack_BUTTON_TOOLTIP:0 "Complete missions to restore Mongol traditions, integrate Chinese bureaucracy, and expand across Eurasia."
yuan_mission_pack_CRITERIA_DESCRIPTION:0 "As the Great Yuan, revive Mongol military traditions while maintaining Chinese administrative systems to create a syncretic empire spanning from the Pacific to Europe."

# ========== YUAN FOUNDATION MISSIONS ==========
mission_establish_yuan_dynasty:0 "Establish the Yuan Dynasty"
mission_establish_yuan_dynasty_desc:0 "Secure our rule over China proper and establish the Yuan Dynasty as the legitimate successor to imperial Chinese traditions while maintaining our Mongol heritage."

mission_revive_mongol_traditions:0 "Revive Mongol Traditions" 
mission_revive_mongol_traditions_desc:0 "Embrace our steppe heritage by promoting Mongol culture and maintaining the cavalry traditions that made our ancestors conquerors of continents."

mission_restore_great_khanate:0 "Restore the Great Khanate"
mission_restore_great_khanate_desc:0 "Reestablish the authority of the Great Khan over all Mongol peoples, commanding respect and tribute from subject nations across Eurasia."

# ========== CHINESE ADMINISTRATION MISSIONS ==========
mission_integrate_chinese_bureaucracy:0 "Integrate Chinese Bureaucracy"
mission_integrate_chinese_bureaucracy_desc:0 "Adopt the sophisticated Chinese administrative system to efficiently govern our vast empire while maintaining Mongol leadership."

mission_imperial_examination_system:0 "Implement Imperial Examinations"
mission_imperial_examination_system_desc:0 "Establish the merit-based imperial examination system to recruit talented administrators and scholars to serve the Yuan court."

mission_construct_imperial_capital:0 "Construct Imperial Capital"
mission_construct_imperial_capital_desc:0 "Transform Dadu into a magnificent imperial capital worthy of the world's largest empire, showcasing both Mongol might and Chinese sophistication."

# ========== CONTINENTAL EXPANSION MISSIONS ==========
mission_secure_mongolia:0 "Secure Mongolia"
mission_secure_mongolia_desc:0 "Consolidate control over our ancestral Mongolian homeland, the source of our military strength and nomadic traditions."

mission_conquer_tibet:0 "Conquer Tibet"
mission_conquer_tibet_desc:0 "Bring the Tibetan plateau under Yuan control, securing the strategic highlands and gaining influence over Tibetan Buddhism."

mission_subjugate_korea:0 "Subjugate Korea"
mission_subjugate_korea_desc:0 "Establish Korean states as loyal tributaries, securing our eastern flank and gaining access to Korean shipbuilding expertise."

mission_invade_japan:0 "Invade Japan"
mission_invade_japan_desc:0 "Launch a massive naval expedition to bring the Japanese islands under Yuan authority, completing our domination of East Asia."

# ========== SILK ROAD MISSIONS ==========
mission_control_silk_road:0 "Control the Silk Road"
mission_control_silk_road_desc:0 "Dominate the historic Silk Road trade routes, ensuring that the wealth of Eurasian commerce flows through our territories."

mission_develop_silk_road_cities:0 "Develop Silk Road Cities"
mission_develop_silk_road_cities_desc:0 "Invest in the urban centers along the Silk Road, transforming them into prosperous hubs of trade and cultural exchange."

mission_establish_maritime_trade:0 "Establish Maritime Trade"
mission_establish_maritime_trade_desc:0 "Develop our naval capabilities to control maritime trade routes and establish the Yuan as a major naval power."

# ========== WESTERN EXPANSION MISSIONS ==========
mission_conquer_central_asia:0 "Conquer Central Asia"
mission_conquer_central_asia_desc:0 "Complete the conquest of Central Asia, securing the strategic heartland of the Eurasian steppe and its nomadic warriors."

mission_invade_persia:0 "Invade Persia"
mission_invade_persia_desc:0 "Bring the wealthy Persian lands under Yuan control, gaining access to their advanced administration and rich cultural heritage."

mission_push_to_europe:0 "Push into Europe"
mission_push_to_europe_desc:0 "Extend Yuan authority into Eastern Europe, demonstrating that no land is beyond the reach of the Great Khan's armies."

# ========== MILITARY REFORM MISSIONS ==========
mission_reform_mongol_army:0 "Reform Mongol Army"
mission_reform_mongol_army_desc:0 "Modernize our military while preserving the mobility and shock power that made the Mongol armies unstoppable."

mission_develop_siege_warfare:0 "Develop Siege Warfare"
mission_develop_siege_warfare_desc:0 "Master the art of siege warfare by combining Mongol mobility with advanced Chinese engineering and gunpowder technology."

mission_integrate_chinese_artillery:0 "Integrate Chinese Artillery"
mission_integrate_chinese_artillery_desc:0 "Incorporate Chinese gunpowder weapons and artillery into our armies, creating the most technologically advanced military force in the world."

# ========== CULTURAL SYNCRETISM MISSIONS ==========
mission_promote_buddhism:0 "Promote Buddhism"
mission_promote_buddhism_desc:0 "Patronize Buddhist institutions to strengthen imperial legitimacy and promote religious harmony across our multicultural empire."

mission_syncretic_culture:0 "Foster Syncretic Culture"
mission_syncretic_culture_desc:0 "Encourage cultural exchange and tolerance between Mongol, Chinese, and other subject peoples to create a unique Yuan civilization."

mission_imperial_academies:0 "Establish Imperial Academies"
mission_imperial_academies_desc:0 "Found centers of learning that blend Mongol practical knowledge with Chinese scholarly traditions to drive technological innovation."

# ========== ECONOMIC DEVELOPMENT MISSIONS ==========
mission_agricultural_reforms:0 "Implement Agricultural Reforms"
mission_agricultural_reforms_desc:0 "Improve agricultural productivity through irrigation projects and new farming techniques to support our growing population."

mission_grand_canal_development:0 "Develop Grand Canal"
mission_grand_canal_development_desc:0 "Expand and maintain the Grand Canal network to facilitate internal trade and transport across our vast empire."

mission_imperial_manufactories:0 "Establish Imperial Manufactories"
mission_imperial_manufactories_desc:0 "Create state-sponsored workshops for silk, porcelain, and other luxury goods to dominate global luxury markets."

# ========== TRIBUTARY SYSTEM MISSIONS ==========
mission_establish_tributary_system:0 "Establish Tributary System"
mission_establish_tributary_system_desc:0 "Formalize the traditional Chinese tributary system, requiring neighboring states to acknowledge Yuan supremacy through regular tribute."

mission_expand_tributary_network:0 "Expand Tributary Network"
mission_expand_tributary_network_desc:0 "Extend our tributary system across maritime Southeast Asia, establishing Yuan hegemony over the entire region."

# ========== NAVAL EXPANSION MISSIONS ==========
mission_develop_naval_power:0 "Develop Naval Power"
mission_develop_naval_power_desc:0 "Build a powerful navy capable of projecting Yuan power across the seas and protecting our maritime trade routes."

mission_expedition_to_indonesia:0 "Expedition to Indonesia"
mission_expedition_to_indonesia_desc:0 "Launch naval expeditions to the spice islands of Indonesia, securing direct access to the world's most valuable trade goods."

# ========== MEGA PROJECT MISSIONS ==========
mission_construct_summer_palace:0 "Construct Summer Palace"
mission_construct_summer_palace_desc:0 "Build a magnificent summer palace complex that showcases the wealth, power, and cultural sophistication of the Yuan Dynasty."

mission_great_wall_restoration:0 "Restore the Great Wall"
mission_great_wall_restoration_desc:0 "Repair and strengthen the Great Wall defenses while adapting them to our mobile cavalry-based military doctrine."

# ========== NEW EXPANDED BRANCHES MISSIONS ==========
mission_unify_mongol_tribes:0 "Unify Mongol Tribes"
mission_unify_mongol_tribes_desc:0 "Bring all remaining independent Mongol tribes under Yuan authority, recreating the unity of Chinggis Khan's era."

mission_steppe_confederation:0 "Form Steppe Confederation"
mission_steppe_confederation_desc:0 "Establish a confederation of all steppe peoples under Yuan leadership, creating an unstoppable nomadic coalition."

mission_patronize_tibetan_buddhism:0 "Patronize Tibetan Buddhism"
mission_patronize_tibetan_buddhism_desc:0 "Establish close relations with Tibetan Buddhist institutions, gaining spiritual legitimacy and influence in Central Asia."

mission_religious_tolerance:0 "Promote Religious Tolerance"
mission_religious_tolerance_desc:0 "Implement policies of religious tolerance across our empire, preventing sectarian conflict in our multicultural domains."

mission_establish_indian_ocean_trade:0 "Establish Indian Ocean Trade"
mission_establish_indian_ocean_trade_desc:0 "Dominate Indian Ocean trade routes, connecting our Silk Road network with the maritime commerce of South Asia."

mission_colonize_southeast_asia:0 "Colonize Southeast Asia"
mission_colonize_southeast_asia_desc:0 "Establish permanent Yuan settlements in Southeast Asia, securing our control over the region's resources and trade."

mission_advance_siege_technology:0 "Advance Siege Technology"
mission_advance_siege_technology_desc:0 "Push the boundaries of military engineering by developing advanced siege weapons and fortification techniques."

mission_scientific_revolution:0 "Spark Scientific Revolution"
mission_scientific_revolution_desc:0 "Foster a golden age of scientific discovery by combining the practical knowledge of steppe nomads with Chinese scholarly traditions."

# ========== ULTIMATE GOAL MISSIONS ==========
mission_world_domination:0 "Achieve World Domination"
mission_world_domination_desc:0 "Extend Yuan authority over all known civilizations, creating the largest contiguous land empire in human history."

mission_pax_mongolica:0 "Establish Pax Mongolica"
mission_pax_mongolica_desc:0 "Usher in an era of unprecedented peace, prosperity, and cultural exchange across the entire Eurasian continent under Yuan rule."

# ========== MODIFIER LOCALIZATION ==========
STATIC_MODIFIER_NAME_yuan_dynasty_established:0 "Yuan Dynasty Established"
STATIC_MODIFIER_DESC_yuan_dynasty_established:0 "The establishment of the Yuan Dynasty has strengthened imperial authority and reduced stability costs."

STATIC_MODIFIER_NAME_mongol_military_traditions:0 "Mongol Military Traditions"
STATIC_MODIFIER_DESC_mongol_military_traditions:0 "Revived steppe traditions have reduced cavalry costs and improved army morale."

STATIC_MODIFIER_NAME_great_khan_restored:0 "Great Khan Restored"
STATIC_MODIFIER_DESC_great_khan_restored:0 "The restoration of the Great Khanate has increased manpower and diplomatic prestige."

STATIC_MODIFIER_NAME_chinese_bureaucracy:0 "Chinese Bureaucracy"
STATIC_MODIFIER_DESC_chinese_bureaucracy:0 "The sophisticated Chinese administrative system has improved tax efficiency and technological development."

STATIC_MODIFIER_NAME_imperial_examinations:0 "Imperial Examinations"
STATIC_MODIFIER_DESC_imperial_examinations:0 "Merit-based recruitment has improved administrative efficiency and institution spread."

STATIC_MODIFIER_NAME_pax_mongolica:0 "Pax Mongolica"
STATIC_MODIFIER_DESC_pax_mongolica:0 "The Mongol Peace has brought unprecedented stability, technological progress, and population growth across Eurasia."

# ========== EVENT LOCALIZATION ==========
yuan_mission_events.1.t:0 "Yuan Dynasty Proclaimed"
yuan_mission_events.1.d:0 "With the imperial capital secured and legitimacy established, we have formally proclaimed the Yuan Dynasty. The fusion of Mongol martial prowess with Chinese administrative sophistication begins. How shall we commemorate this historic occasion?"
yuan_mission_events.1.a:0 "Celebrate with Traditional Mongol Ceremonies"
yuan_mission_events.1.b:0 "Hold Grand Chinese Imperial Rituals"

yuan_mission_events.2.t:0 "Mongol Traditions Revived"
yuan_mission_events.2.d:0 "Our efforts to revive Mongol military traditions have borne fruit. The steppe ways are once again honored in our court and armies. What emphasis should we place in our military reforms?"
yuan_mission_events.2.a:0 "Focus on Cavalry Excellence"
yuan_mission_events.2.b:0 "Develop Combined Arms Tactics"

yuan_mission_events.3.t:0 "Great Khanate Restored"
yuan_mission_events.3.d:0 "The authority of the Great Khan has been restored across the Mongol world. Subject nations pay tribute and our prestige reaches new heights. How shall we exercise this renewed authority?"
yuan_mission_events.3.a:0 "Assert Absolute Imperial Authority"
yuan_mission_events.3.b:0 "Build Diplomatic Consensus"

yuan_mission_events.50.t:0 "Pax Mongolica Achieved"
yuan_mission_events.50.d:0 "From the Pacific to Europe, from the Arctic to the Indian Ocean, peace reigns under Yuan authority. The Silk Road flourishes as never before, and cultural exchange transforms civilizations across Eurasia. This is the culmination of our imperial project - the Pax Mongolica. How shall this golden age be remembered?"
yuan_mission_events.50.a:0 "Focus on Cultural and Scientific Legacy"
yuan_mission_events.50.b:0 "Ensure Economic Prosperity for All"

# ========== MISSION TRIGGER TOOLTIPS ==========
mission_establish_yuan_dynasty_trigger:0 "We must control Beijing and Dadu with at least 50 prestige and 60 legitimacy"
mission_revive_mongol_traditions_trigger:0 "Mongol culture must be accepted with 40 army tradition and 50% cavalry ratio"
mission_restore_great_khanate_trigger:0 "We need 80 prestige, 75 military strength, and 5 subject nations"
mission_integrate_chinese_bureaucracy_trigger:0 "Han Chinese culture must be accepted with scholar estate power at 40% and admin tech 12"
mission_control_silk_road_trigger:0 "We must control 70% of Central Asia with 75 trade income"
mission_world_domination_trigger:0 "We need 3000 total development, 95 military strength, 95 prestige, and 20 tributaries"
mission_pax_mongolica_trigger:0 "We must have 100 prestige, 90 stability, 750 monthly trade/tax income, and be in a golden era"

# ========== MISSION COMPLETION TOOLTIPS ==========
mission_establish_yuan_dynasty_completion:0 "Gained imperial authority and capital development bonuses"
mission_revive_mongol_traditions_completion:0 "Mongol military traditions strengthened with cavalry and morale bonuses"
mission_control_silk_road_completion:0 "Silk Road trade dominance established with significant income boost"
mission_world_domination_completion:0 "Achieved world hegemony with massive prestige and military bonuses"
mission_pax_mongolica_completion:0 "Established eternal peace and prosperity across the Eurasian continent"